<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX - Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* হেডার স্টাইল */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 4%; background: rgba(30, 41, 59, 0.95); border-bottom: 1px solid #334155; z-index: 100; }
        .logo { font-size: 22px; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .logo span { color: #f43f5e; }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .btn-auth { background: #38bdf8; color: #0f172a; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }

        /* ট্যাব মেনু (Student Chat / Teacher & Admin Notice) */
        .tab-header { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: #94a3b8; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; text-align: center; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }

        /* চ্যাট বক্স লেআউট */
        .chat-container { flex: 1; display: flex; flex-direction: column; background: #0b1120; overflow: hidden; position: relative; }
        .messages-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }

        /* মেসেজ বাবল স্টাইল */
        .msg-card { display: flex; flex-direction: column; max-width: 80%; width: fit-content; border-radius: 12px; padding: 8px 12px; position: relative; font-size: 14px; word-wrap: break-word; }
        .msg-left { align-self: flex-start; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-top-left-radius: 2px; }
        .msg-right { align-self: flex-end; background: #0284c7; color: #ffffff; border-top-right-radius: 2px; }
        .msg-notice { align-self: center; max-width: 90%; background: #1e293b; border: 1px solid #38bdf8; border-left: 4px solid #38bdf8; border-radius: 8px; width: 100%; }
        
        .msg-sender { font-size: 11px; font-weight: 700; color: #38bdf8; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .msg-right .msg-sender { color: #e0f2fe; }
        .role-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #ea580c; color: #fff; text-transform: uppercase; }
        
        .msg-text { line-height: 1.4; white-space: pre-wrap; }
        
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 4px; font-size: 10px; opacity: 0.75; }
        .delete-btn { background: none; border: none; color: #f43f5e; cursor: pointer; font-size: 12px; padding: 0 4px; opacity: 0.8; }
        .delete-btn:hover { opacity: 1; }

        /* রিপ্লাই বক্স প্রিভিউ (WhatsApp Like Quoted Message) */
        .reply-preview-box { background: rgba(15, 23, 42, 0.6); border-left: 3px solid #38bdf8; padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; font-size: 12px; opacity: 0.9; cursor: pointer; }
        .msg-right .reply-preview-box { background: rgba(0, 0, 0, 0.2); border-left-color: #fff; }
        .reply-preview-sender { font-weight: bold; color: #38bdf8; font-size: 11px; }
        .msg-right .reply-preview-sender { color: #fff; }
        .reply-preview-text { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 200px; }

        /* ইনপুট এরিয়া */
        .input-area-container { background: #1e293b; border-top: 1px solid #334155; padding: 10px 15px; display: flex; flex-direction: column; gap: 6px; }
        .active-reply-bar { display: none; justify-content: space-between; align-items: center; background: #0f172a; border-left: 3px solid #38bdf8; padding: 6px 10px; border-radius: 4px; font-size: 12px; }
        .active-reply-bar .close-reply { cursor: pointer; color: #f43f5e; font-weight: bold; }
        
        .input-row { display: flex; gap: 8px; align-items: center; }
        .chat-input { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 14px; outline: none; }
        .chat-input:focus { border-color: #38bdf8; }
        .btn-send { background: #38bdf8; color: #0f172a; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex-shrink: 0; font-weight: bold; }

        .notice-only-msg { text-align: center; color: #94a3b8; font-size: 13px; padding: 15px; }
    </style>
</head>
<body>

    <!-- হেডার -->
    <header class="navbar">
        <a href="index.html" class="logo">GAIVEX<span>.</span> Community</a>
        <div class="nav-right">
            <a href="index.html" class="btn-auth">🏠 হোম</a>
        </div>
    </header>

    <!-- উপরের দিকে স্টুডেন্ট এবং টিচার/এডমিন সেকশন বাটন -->
    <div class="tab-header">
        <button class="tab-btn active" id="btnStudentTab" onclick="switchTab('student')">💬 Student Chat</button>
        <button class="tab-btn" id="tabTeacherBtn" onclick="switchTab('teacher')">📢 Teacher & Admin Notices</button>
    </div>

    <!-- কমিউনিটি চ্যাট এরিয়া -->
    <div class="chat-container">
        
        <!-- সকল মেসেজ দেখানোর স্থান -->
        <div class="messages-box" id="messagesBox">
            <p style="color:#94a3b8; text-align:center; margin-top:20px;">মেসেজ লোড হচ্ছে...</p>
        </div>

        <!-- স্টুডেন্ট ইনপুট বক্স (শুধু স্টুডেন্ট চ্যাট ট্যাবে একটিভ থাকবে) -->
        <div class="input-area-container" id="inputContainer">
            <!-- রিপ্লাই বার প্রিভিউ -->
            <div class="active-reply-bar" id="activeReplyBar">
                <div>
                    <span style="color:#38bdf8; font-weight:bold;" id="replyTargetUser">কারো মেসেজ</span>-কে রিপ্লাই দেওয়া হচ্ছে:
                    <div style="color:#94a3b8; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:260px;" id="replyTargetText">...</div>
                </div>
                <span class="close-reply" onclick="cancelReply()">✕</span>
            </div>

            <div class="input-row">
                <input type="text" id="msgInput" class="chat-input" placeholder="আপনার বার্তা লিখুন (মেসেজে ক্লিক করে রিপ্লাই দিন)..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
        authDomain: "gaivexexam.firebaseapp.com",
        databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
        projectId: "gaivexexam",
        storageBucket: "gaivexexam.firebasestorage.app",
        messagingSenderId: "956204530190",
        appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const auth = getAuth(app);

      let currentUser = null;
      let userRole = 'student'; // 'admin', 'teacher', or 'student'
      let currentTab = 'student';
      let replyingTo = null; // Stores reply object if replying to a message

      // অথেন্টিকেশন চেক & রোল নিরূপণ
      onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (user) {
            // ডেটাবেজ থেকে রোল চেক (যদি ইউজার Admin/Teacher হয়)
            try {
                const roleSnap = await get(ref(db, `users/${user.uid}/role`));
                if (roleSnap.exists()) {
                    userRole = roleSnap.val(); // e.g. 'admin' or 'teacher'
                }
            } catch(e) {}
        }
        loadMessages();
      });

      // ট্যাব পরিবর্তন ফাংশন
      window.switchTab = function(tab) {
          currentTab = tab;
          document.getElementById('btnStudentTab').classList.toggle('active', tab === 'student');
          document.getElementById('tabTeacherBtn').classList.toggle('active', tab === 'teacher');

          const inputContainer = document.getElementById('inputContainer');
          if (tab === 'teacher') {
              // টিচার/এডমিন ট্যাবে স্টুডেন্টদের মেসেজ দেওয়ার অপশন সম্পূর্ণ হাইড থাকবে
              inputContainer.style.display = 'none';
          } else {
              inputContainer.style.display = 'flex';
          }
          cancelReply();
          loadMessages();
      };

      // মেসেজ লোড করার ফাংশন
      function loadMessages() {
          const dbPath = currentTab === 'student' ? 'community_student_chats' : 'community_teacher_notices';
          const messagesBox = document.getElementById('messagesBox');

          onValue(ref(db, dbPath), (snapshot) => {
              messagesBox.innerHTML = '';
              if (!snapshot.exists()) {
                  if(currentTab === 'teacher') {
                      messagesBox.innerHTML = '<div class="notice-only-msg">📢 টিচার ও এডমিনদের থেকে এখনো কোনো নোটিশ দেওয়া হয়নি।</div>';
                  } else {
                      messagesBox.innerHTML = '<div class="notice-only-msg">💬 এখানে কোনো বার্তা নেই। প্রথম বার্তাটি লিখুন!</div>';
                  }
                  return;
              }

              const data = snapshot.val();
              for (let key in data) {
                  const msg = data[key];
                  const isMe = currentUser && currentUser.uid === msg.uid;
                  const canDelete = isMe || userRole === 'admin' || userRole === 'teacher';
                  
                  // মেসেজ কার্ড তৈরি
                  const card = document.createElement('div');
                  if (currentTab === 'teacher') {
                      card.className = 'msg-card msg-notice';
                  } else {
                      card.className = `msg-card ${isMe ? 'msg-right' : 'msg-left'}`;
                  }

                  // রিপ্লাই প্রিভিউ তৈরি (যদি মেসেজটিতে কারো রিপ্লাই থাকে)
                  let replyHTML = '';
                  if (msg.replyTo) {
                      replyHTML = `
                          <div class="reply-preview-box">
                              <div class="reply-preview-sender">${escapeHTML(msg.replyTo.sender)}</div>
                              <div class="reply-preview-text">${escapeHTML(msg.replyTo.text)}</div>
                          </div>
                      `;
                  }

                  // রোল ব্যাজ (Admin/Teacher হলে দেখাবে)
                  let roleBadge = '';
                  if(msg.role === 'admin') roleBadge = `<span class="role-badge" style="background:#ef4444;">ADMIN</span>`;
                  else if(msg.role === 'teacher') roleBadge = `<span class="role-badge" style="background:#10b981;">TEACHER</span>`;

                  // ডিলিট বাটন (নিজের মেসেজ অথবা Admin/Teacher হলে ডিলিট করতে পারবে)
                  let deleteHTML = canDelete ? `<button class="delete-btn" title="ডিলিট করুন" onclick="deleteMessage('${dbPath}', '${key}')">🗑️</button>` : '';

                  // সময় ফর্ম্যাট
                  const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('bn-BD', {hour: '2-digit', minute:'2-digit'}) : '';

                  card.innerHTML = `
                      <div class="msg-sender">
                          <span>${escapeHTML(msg.senderName)} ${roleBadge}</span>
                      </div>
                      ${replyHTML}
                      <div class="msg-text">${escapeHTML(msg.text)}</div>
                      <div class="msg-meta">
                          <span>${timeStr}</span>
                          ${deleteHTML}
                      </div>
                  `;

                  // স্টুডেন্ট ট্যাবে যেকোনো মেসেজে ক্লিক করলে WhatsApp-এর মতো রিপ্লাই অপশন চালু হবে
                  if(currentTab === 'student') {
                      card.onclick = (e) => {
                          if (!e.target.classList.contains('delete-btn')) {
                              setReplyMode(msg.senderName, msg.text);
                          }
                      };
                  }

                  messagesBox.appendChild(card);
              }
              // স্ক্রোল একদম নিচে পাঠানো
              messagesBox.scrollTop = messagesBox.scrollHeight;
          });
      }

      // মেসেজ পাঠানোর ফাংশন
      window.sendMessage = async function() {
          if (!currentUser) {
              alert("মেসেজ পাঠাতে হলে আগে আপনাকে লগইন করতে হবে!");
              return;
          }

          const input = document.getElementById('msgInput');
          const text = input.value.trim();
          if (!text) return;

          const dbPath = 'community_student_chats';

          const msgData = {
              uid: currentUser.uid,
              senderName: currentUser.displayName || currentUser.email.split('@')[0],
              text: text,
              role: userRole,
              timestamp: Date.now()
          };

          if (replyingTo) {
              msgData.replyTo = replyingTo;
          }

          try {
              await push(ref(db, dbPath), msgData);
              input.value = '';
              cancelReply();
          } catch(e) {
              alert("মেসেজ পাঠাতে ব্যর্থ হয়েছে। আবার চেষ্টা করুন।");
          }
      };

      // রিপ্লাই সেট করা (WhatsApp Style)
      function setReplyMode(sender, text) {
          replyingTo = { sender: sender, text: text };
          document.getElementById('replyTargetUser').innerText = sender;
          document.getElementById('replyTargetText').innerText = text;
          document.getElementById('activeReplyBar').style.display = 'flex';
          document.getElementById('msgInput').focus();
      }

      // রিপ্লাই বাতিল করা
      window.cancelReply = function() {
          replyingTo = null;
          document.getElementById('activeReplyBar').style.display = 'none';
      };

      // মেসেজ ডিলিট করার ফাংশন (Admin, Teacher & Owner specific)
      window.deleteMessage = async function(path, key) {
          if (confirm("আপনি কি নিশ্চিত যে এই ম্যাসেজটি ডিলিট করতে চান?")) {
              try {
                  await remove(ref(db, `${path}/${key}`));
              } catch(e) {
                  alert("ডিলিট করার অনুমতি নেই অথবা কোনো ত্রুটি ঘটেছে।");
              }
          }
      };

      function escapeHTML(str) {
          return str.replace(/[&<>'"]/g, 
              tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
          );
      }
    </script>
</body>
</html>

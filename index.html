<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>GAIVEX.AI</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Hind Siliguri',sans-serif;
}

html,body{
    width:100%;
    height:100%;
    background:#06101f;
    color:#f8fafc;
    overflow:hidden;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    height:76px;
    min-height:76px;
    display:flex;
    align-items:center;
    padding:0 22px;
    background:#0b172a;
    border-bottom:1px solid #263852;
    position:relative;
    z-index:10;
}

.logo{
    font-size:30px;
    font-weight:700;
    letter-spacing:.3px;
    color:#06b6f4;
}

.logo-dot{
    color:#f43f5e;
}

.logo-ai{
    color:#06b6f4;
}

/* =========================
   MAIN CHAT
========================= */

.chat-wrapper{
    flex:1;
    min-height:0;
    width:100%;
    display:flex;
    justify-content:center;
    padding:18px;
}

.chat-container{
    width:100%;
    max-width:850px;
    height:100%;
    min-height:0;
    background:rgba(10,25,44,.96);
    border:1px solid #29405d;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
    padding:15px 18px;
    background:#14243a;
    border-bottom:1px solid #29405d;
    display:flex;
    align-items:center;
    gap:12px;
}

.bot-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:linear-gradient(135deg,#08baf3,#0879c9);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    box-shadow:0 0 20px rgba(0,191,255,.18);
}

.bot-info{
    flex:1;
}

.bot-name{
    font-size:19px;
    font-weight:700;
    color:#08baf3;
}

.bot-status{
    color:#94a3b8;
    font-size:12px;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:20px;
    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:5px;
}

.messages::-webkit-scrollbar-thumb{
    background:#30465f;
    border-radius:20px;
}

.message-row{
    display:flex;
    margin-bottom:15px;
    width:100%;
}

.message-row.bot{
    justify-content:flex-start;
}

.message-row.user{
    justify-content:flex-end;
}

.message{
    max-width:82%;
    padding:12px 15px;
    border-radius:16px;
    font-size:15px;
    line-height:1.65;
    word-wrap:break-word;
    white-space:pre-wrap;
}

.message.bot{
    background:#172a40;
    border:1px solid #2b435d;
    border-bottom-left-radius:5px;
    color:#e2e8f0;
}

.message.user{
    background:#008fd0;
    border-bottom-right-radius:5px;
    color:white;
}

.message strong{
    color:#38bdf8;
}

.message a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:600;
}

.message a:hover{
    text-decoration:underline;
}

/* typing */

.typing{
    display:none;
    align-items:center;
    gap:5px;
    background:#172a40;
    border:1px solid #2b435d;
    padding:11px 14px;
    border-radius:15px;
    width:max-content;
    margin-bottom:12px;
}

.typing.show{
    display:flex;
}

.typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#38bdf8;
    animation:typing .9s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* =========================
   INPUT
========================= */

.input-area{
    padding:13px;
    background:#0d1d31;
    border-top:1px solid #29405d;
}

.input-box{
    display:flex;
    align-items:center;
    gap:8px;
}

.voice-btn,
.send-btn{
    width:54px;
    height:54px;
    min-width:54px;
    border-radius:14px;
    border:1px solid #3b526c;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    transition:.2s;
}

.voice-btn{
    background:#1a2d43;
    color:#e2e8f0;
}

.voice-btn:hover{
    border-color:#06b6f4;
}

.voice-btn.listening{
    background:#ef4444;
    border-color:#ef4444;
    animation:pulseMic 1.2s infinite;
}

@keyframes pulseMic{
    0%{
        box-shadow:0 0 0 0 rgba(239,68,68,.55);
    }
    70%{
        box-shadow:0 0 0 12px rgba(239,68,68,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(239,68,68,0);
    }
}

.question-input{
    flex:1;
    height:54px;
    border-radius:14px;
    border:1px solid #40566f;
    background:#050b16;
    color:white;
    padding:0 15px;
    outline:none;
    font-size:16px;
    min-width:0;
}

.question-input::placeholder{
    color:#64748b;
}

.question-input:focus{
    border-color:#06b6f4;
    box-shadow:0 0 0 2px rgba(6,182,244,.08);
}

.send-btn{
    background:#08baf3;
    color:#02101c;
    border-color:#08baf3;
    font-size:27px;
    font-weight:bold;
}

.send-btn:hover{
    background:#38c9f7;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.input-hint{
    font-size:11px;
    color:#64748b;
    padding:6px 4px 0;
}

/* =========================
   WELCOME
========================= */

.welcome{
    text-align:center;
    padding:35px 15px;
}

.welcome-icon{
    width:90px;
    height:90px;
    border-radius:50%;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#079dd8,#0878c5);
    font-size:50px;
    box-shadow:0 0 30px rgba(0,174,255,.18);
}

.welcome h1{
    font-size:26px;
    margin-bottom:6px;
    color:#f8fafc;
}

.welcome h1 span{
    color:#08baf3;
}

.welcome p{
    color:#94a3b8;
    font-size:14px;
}

/* =========================
   SEARCH BUTTON
========================= */

.search-card{
    margin-top:8px;
    background:#14243a;
    border:1px solid #29405d;
    padding:12px;
    border-radius:12px;
}

.search-card a{
    display:inline-block;
    margin-top:8px;
    padding:8px 12px;
    border-radius:8px;
    background:#008fd0;
    color:white;
    text-decoration:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        height:68px;
        min-height:68px;
        padding:0 18px;
    }

    .logo{
        font-size:28px;
    }

    .chat-wrapper{
        padding:0;
    }

    .chat-container{
        border-radius:0;
        border-left:none;
        border-right:none;
        border-bottom:none;
    }

    .chat-header{
        padding:11px 15px;
    }

    .messages{
        padding:15px;
    }

    .message{
        max-width:88%;
        font-size:15px;
    }

    .input-area{
        padding:9px;
        padding-bottom:calc(9px + env(safe-area-inset-bottom));
    }

    .voice-btn,
    .send-btn{
        width:50px;
        min-width:50px;
        height:50px;
    }

    .question-input{
        height:50px;
        font-size:15px;
    }

    .welcome{
        padding:25px 10px;
    }

    .welcome-icon{
        width:75px;
        height:75px;
        font-size:40px;
    }

    .welcome h1{
        font-size:23px;
    }
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:360px){

    .logo{
        font-size:24px;
    }

    .voice-btn,
    .send-btn{
        width:46px;
        min-width:46px;
        height:46px;
    }

    .question-input{
        height:46px;
        padding:0 10px;
    }
}
</style>
</head>

<body>

     HEADER
========================= -->

        GAIVEX<span class="logo-dot">.</span><span class="logo-ai">AI</span>

<!-- =========================

========================= -->

<main class="chat-wrapper">

<div class="chat-container">

<script type="module">

/* =========================================================
   FIREBASE IMPORT
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",

    authDomain:
        "gaivexexam.firebaseapp.com",

    databaseURL:
        "https://gaivexexam-default-rtdb.firebaseio.com",

    projectId:
        "gaivexexam",

    storageBucket:
        "gaivexexam.firebasestorage.app",

    messagingSenderId:
        "956204530190",

    appId:
        "1:956204530190:web:4e5550afefa3e314c99a5f"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentUser = null;

let knowledgeBase = {

    notices: [],

    notes: [],

    exams: [],

    liveExam: null,

    practiceExam: null

};

let studentAttempts = {};

let isDataLoaded = false;


/* =========================================================
   DOM
========================================================= */

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("questionInput");

const sendButton =
    document.getElementById("sendButton");

const voiceButton =
    document.getElementById("voiceButton");

const typingIndicator =
    document.getElementById("typingIndicator");

const welcomeMessage =
    document.getElementById("welcomeMessage");

const botStatus =
    document.getElementById("botStatus");

const inputHint =
    document.getElementById("inputHint");


/* =========================================================
   UTILITY: HTML ESCAPE
========================================================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   TEXT NORMALIZATION
========================================================= */

function normalizeText(text){

    return String(text || "")
        .toLowerCase()
        .replace(/[।,!?;:()[\]{}"'`]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   BANGLA NUMBER
========================================================= */

function bnNumber(number){

    const map = {
        "0":"০",
        "1":"১",
        "2":"২",
        "3":"৩",
        "4":"৪",
        "5":"৫",
        "6":"৬",
        "7":"৭",
        "8":"৮",
        "9":"৯"
    };

    return String(number)
        .split("")
        .map(x => map[x] || x)
        .join("");
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value){

    if(!value){
        return "তারিখ নেই";
    }

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return "তারিখ নেই";
    }

    return d.toLocaleDateString("bn-BD",{
        year:"numeric",
        month:"long",
        day:"numeric"
    });
}


/* =========================================================
   LOAD FIREBASE KNOWLEDGE
========================================================= */

async function loadKnowledge(){

    botStatus.textContent =
        "তথ্য প্রস্তুত করা হচ্ছে...";

    try{

        /* -------------------------
           NOTICES
        ------------------------- */

        const noticeSnap =
            await get(ref(db,"notices"));

        if(noticeSnap.exists()){

            const data = noticeSnap.val();

            knowledgeBase.notices =
                Object.values(data || {});
        }


        /* -------------------------
           NOTES
        ------------------------- */

        const notesSnap =
            await get(ref(db,"notes"));

        if(notesSnap.exists()){

            const data = notesSnap.val();

            knowledgeBase.notes =
                Object.values(data || {});
        }


        /* -------------------------
           LIVE EXAM
        ------------------------- */

        const liveSnap =
            await get(
                ref(db,"live_exams/live_daily_exam")
            );

        if(liveSnap.exists()){

            knowledgeBase.liveExam =
                liveSnap.val();
        }


        /* -------------------------
           PRACTICE EXAM
        ------------------------- */

        const practiceSnap =
            await get(
                ref(db,"practice_exams")
            );

        if(practiceSnap.exists()){

            knowledgeBase.practiceExam =
                practiceSnap.val();
        }


        /* -------------------------
           STUDENT EXAMS
        ------------------------- */

        if(currentUser){

            const examSnap =
                await get(
                    ref(
                        db,
                        `exam_attempts/${currentUser.uid}`
                    )
                );

            if(examSnap.exists()){

                studentAttempts =
                    examSnap.val() || {};

            }else{

                studentAttempts = {};
            }

        }else{

            studentAttempts = {};
        }


        isDataLoaded = true;

        botStatus.textContent =
            "আপনার প্রশ্নের অপেক্ষায়...";

    }catch(error){

        console.error(
            "Knowledge load error:",
            error
        );

        botStatus.textContent =
            "প্রশ্ন করুন";

        isDataLoaded = true;
    }
}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async(user)=>{

        currentUser = user;

        await loadKnowledge();

    }
);


/* =========================================================
   REFRESH STUDENT DATA
========================================================= */

async function refreshStudentData(){

    if(!currentUser){

        studentAttempts = {};

        return;
    }

    try{

        const snap =
            await get(
                ref(
                    db,
                    `exam_attempts/${currentUser.uid}`
                )
            );

        studentAttempts =
            snap.exists()
                ? snap.val() || {}
                : {};

    }catch(error){

        console.error(error);
    }
}


/* =========================================================
   REMOVE WELCOME
========================================================= */

function removeWelcome(){

    if(welcomeMessage){

        welcomeMessage.remove();

    }
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
    text,
    type="bot"
){

    removeWelcome();

    const row =
        document.createElement("div");

    row.className =
        `message-row ${type}`;

    const bubble =
        document.createElement("div");

    bubble.className =
        `message ${type}`;

    bubble.innerHTML =
        formatResponse(text);

    row.appendChild(bubble);

    messages.insertBefore(
        row,
        typingIndicator
    );

    scrollToBottom();

}


/* =========================================================
   RESPONSE FORMAT
========================================================= */

function formatResponse(text){

    let safe =
        escapeHTML(text);

    /*
      URLsকে clickable করার জন্য
    */

    safe =
        safe.replace(
            /(https?:\/\/[^\s<]+)/g,
            function(url){

                return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;

            }
        );


    /*
      Bold
    */

    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    return safe.replace(
        /\n/g,
        "<br>"
    );
}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom(){

    setTimeout(()=>{

        messages.scrollTop =
            messages.scrollHeight;

    },50);
}


/* =========================================================
   TYPING
========================================================= */

function showTyping(){

    typingIndicator.classList.add("show");

    scrollToBottom();
}

function hideTyping(){

    typingIndicator.classList.remove("show");

}


/* =========================================================
   KEYWORD MATCH
========================================================= */

function containsAny(
    text,
    words
){

    return words.some(
        word => text.includes(
            normalizeText(word)
        )
    );
}


/* =========================================================
   GOOGLE SEARCH
========================================================= */

function googleSearchLink(query){

    const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

    return url;
}


/* =========================================================
   GOOGLE RESPONSE
========================================================= */

function googleFallback(query){

    const url =
        googleSearchLink(query);

    return `
এই প্রশ্নের নির্দিষ্ট তথ্য GAIVEX-এর বর্তমান Knowledge Base-এ পাওয়া যায়নি।

Google-এ এই বিষয়ে খুঁজতে নিচের লিংকে যান:

${url}
`;
}


/* =========================================================
   STUDENT ANALYTICS
========================================================= */

function getStudentAnalytics(){

    const attempts =
        Object.values(studentAttempts || {});

    if(attempts.length === 0){

        return {
            totalExams:0,
            totalScore:0,
            totalPossible:0,
            accuracy:0,
            average:0,
            best:null,
            worst:null
        };
    }


    let totalScore = 0;

    let totalPossible = 0;

    let best = null;

    let worst = null;


    attempts.forEach(item=>{

        const score =
            Number(item.score) || 0;

        const total =
            Number(item.total) || 0;


        totalScore += score;

        totalPossible += total;


        if(
            !best ||
            score / Math.max(total,1) >
            Number(best.score || 0) /
            Math.max(Number(best.total || 1),1)
        ){

            best = item;

        }


        if(
            !worst ||
            score / Math.max(total,1) <
            Number(worst.score || 0) /
            Math.max(Number(worst.total || 1),1)
        ){

            worst = item;

        }

    });


    const accuracy =
        totalPossible > 0
        ? (totalScore / totalPossible) * 100
        : 0;


    return {

        totalExams:attempts.length,

        totalScore,

        totalPossible,

        accuracy,

        average:
            totalScore / attempts.length,

        best,

        worst

    };
}


/* =========================================================
   ANSWER: STUDENT RESULT
========================================================= */

function answerStudentResult(){

    if(!currentUser){

        return `
আপনার পরীক্ষার ফলাফল দেখতে আগে GAIVEX Portal-এ লগইন করুন।

Portal থেকে লগইন করার পর আবার এখানে প্রশ্ন করুন।
`;
    }


    const analytics =
        getStudentAnalytics();


    if(analytics.totalExams === 0){

        return `
আপনার নামে এখনো কোনো পরীক্ষার রেজাল্ট পাওয়া যায়নি।

আপনি পরীক্ষা দেওয়ার পর আপনার ফলাফল ও performance এখানে দেখা যাবে।
`;
    }


    return `
আপনার পরীক্ষার সংক্ষিপ্ত ফলাফল:

📊 মোট পরীক্ষা: ${bnNumber(analytics.totalExams)}টি

/* =========================================================
   ANSWER: NOTES
========================================================= */

function answerNotes(query){

    const notes =
        knowledgeBase.notes || [];


    if(!notes.length){

        return `
বর্তমানে Knowledge Base-এ কোনো Notes পাওয়া যায়নি।
`;
    }


    const words =
        normalizeText(query)
        .split(" ")
        .filter(x=>x.length>2);


    const matched =
        notes.filter(note=>{

            const combined =
                normalizeText(
                    `${note.title || ""}
                     ${note.subject || ""}
                     ${note.paper || ""}
                     ${note.chapter || ""}
                     ${note.textContent || ""}`
                );

            return words.some(
                word=>combined.includes(word)
            );

        });


    if(!matched.length){

        return googleFallback(
            query
        );
    }


    let result =
        "📚 আপনার প্রশ্নের সাথে সম্পর্কিত Notes:\n\n";


    matched.slice(0,5).forEach(
        (note,index)=>{

            result +=
`📌 ${bnNumber(index+1)}. ${note.title || "Note"}

বিষয়: ${note.subject || "তথ্য নেই"}
পত্র: ${note.paper || "তথ্য নেই"}
অধ্যায়: ${note.chapter || "তথ্য নেই"}

`;

            if(note.contentType === "pdf"){

                result +=
                    `PDF: ${note.contentUrl || ""}\n\n`;

            }else if(
                note.contentType === "image"
            ){

                result +=
                    `Image: ${note.contentUrl || ""}\n\n`;

            }else if(note.textContent){

                result +=
                    `${String(note.textContent).slice(0,500)}\n\n`;

            }

        }
    );


    return result;
}

/* =========================================================
   MAIN AI ENGINE
========================================================= */

async function generateAnswer(query){

    const q =
        normalizeText(query);


    /* -------------------------
       EMPTY
    ------------------------- */

    if(!q){

        return "দয়া করে একটি প্রশ্ন লিখুন।";
    }


    /* -------------------------
       REFRESH
    ------------------------- */

    if(
        containsAny(q,[
            "refresh",
            "রিফ্রেশ",
            "নতুন তথ্য",
            "তথ্য আপডেট"
        ])
    ){

        await loadKnowledge();

        return `
Knowledge Base সফলভাবে আপডেট করা হয়েছে।

এখন আবার আপনার প্রশ্ন করুন।
`;
    }


    /* -------------------------
       RESULT
    ------------------------- */

    if(
        containsAny(q,[
            "আমার রেজাল্ট",
            "আমার ফলাফল",
            "আমার স্কোর",
            "আমার নম্বর",
            "result",
            "score",
            "ফলাফল"
        ])
    ){

        return answerStudentResult();
    }


    /* -------------------------
       HISTORY
    ------------------------- */

    if(
        containsAny(q,[
            "exam history",
            "পরীক্ষার history",
            "পরীক্ষার হিস্টোরি",
            "আগের পরীক্ষা",
            "কতটি পরীক্ষা",
            "কয়টি পরীক্ষা"
        ])
    ){

        return answerExamHistory();
    }


    /* -------------------------
       PERFORMANCE
    ------------------------- */

    if(
        containsAny(q,[
            "performance",
            "পারফরম্যান্স",
            "দুর্বল",
            "আমার অবস্থান",
            "accuracy",
            "এক্যুরেসি"
        ])
    ){

        return answerPerformance();
    }


    /* -------------------------
       NOTICES
    ------------------------- */

    if(
        containsAny(q,[
            "notice",
            "নোটিশ",
            "ঘোষণা",
            "নোটিশ বোর্ড"
        ])
    ){

        return answerNotices();
    }


    /* -------------------------
       LIVE EXAM
    ------------------------- */

    if(
        containsAny(q,[
            "live exam",
            "লাইভ পরীক্ষা",
            "লাইভ এক্সাম",
            "আজকের পরীক্ষা",
            "daily exam"
        ])
    ){

        return answerLiveExam();
    }


    /* -------------------------
       PRACTICE
    ------------------------- */

    if(
        containsAny(q,[
            "practice",
            "প্র্যাকটিস",
            "practice exam",
            "অনুশীলন পরীক্ষা"
        ])
    ){

        return answerPracticeExam();
    }


    /* -------------------------
       NOTES
    ------------------------- */

    if(
        containsAny(q,[
            "note",
            "notes",
            "নোট",
            "নোটস",
            "পড়ার নোট"
        ])
    ){

        return answerNotes(query);
    }


    /* -------------------------
       SUBJECT
    ------------------------- */

    const subjectAnswer =
        answerSubject(query);

    if(subjectAnswer){

        return subjectAnswer;
    }


    /* -------------------------
       WEBSITE
    ------------------------- */

    const websiteAnswer =
        answerWebsite(query);

    if(websiteAnswer){

        return websiteAnswer;
    }


    /* -------------------------
       GENERAL
    ------------------------- */

    const generalAnswer =
        answerGeneral(query);

    if(generalAnswer){

        return generalAnswer;
    }


    /* =====================================================
       FIREBASE CONTENT SEARCH
    ===================================================== */

    const searchable = [];


    /* Notices */

    knowledgeBase.notices.forEach(
        item=>{

            searchable.push({

                type:"notice",

                title:item.title || "",

                text:
                    `${item.title || ""}
                     ${item.description || ""}`,

                data:item

            });

        }
    );


    /* Notes */

    knowledgeBase.notes.forEach(
        item=>{

            searchable.push({

                type:"note",

                title:item.title || "",

                text:
                    `${item.title || ""}
                     ${item.subject || ""}
                     ${item.paper || ""}
                     ${item.chapter || ""}
                     ${item.textContent || ""}`,

                data:item

            });

        }
    );


    const queryWords =
        q.split(" ")
        .filter(word=>word.length>1);


    const matches =
        searchable
        .map(item=>{

            const text =
                normalizeText(
                    item.text
                );

            let score = 0;


            queryWords.forEach(
                word=>{

                    if(text.includes(word)){

                        score++;

                    }

                }
            );


            return {
                ...item,
                score
            };

        })
        .filter(item=>item.score>0)
        .sort(
            (a,b)=>b.score-a.score
        );


    if(matches.length){

        const top =
            matches.slice(0,4);


        let result =
            "🔎 GAIVEX-এর তথ্য থেকে যা পাওয়া গেছে:\n\n";


        top.forEach(
            (item,index)=>{

                result +=
`📌 ${bnNumber(index+1)}. ${item.title || "তথ্য"}

`;

                if(item.type==="notice"){

                    result +=
                        `${item.data.description || ""}\n\n`;

                }else{

                    result +=
                        `বিষয়: ${item.data.subject || "তথ্য নেই"}
অধ্যায়: ${item.data.chapter || "তথ্য নেই"}
`;

                    if(item.data.textContent){

                        result +=
                            `${String(item.data.textContent).slice(0,500)}\n`;

                    }

                    if(item.data.contentUrl){

                        result +=
                            `লিংক: ${item.data.contentUrl}\n`;

                    }

                    result += "\n";
                }

            }
        );


        return result;
    }


    /* =====================================================
       GOOGLE FALLBACK
    ===================================================== */

    return googleFallback(query);
}


/* =========================================================
   SEND QUESTION
========================================================= */

async function sendQuestion(){

    const question =
        input.value.trim();


    if(!question){

        return;
    }


    input.value = "";

    sendButton.disabled = true;

    addMessage(
        question,
        "user"
    );


    showTyping();


    try{

        const answer =
            await generateAnswer(question);


        /*
          ছোট delay
          যাতে response natural লাগে
        */

        await new Promise(
            resolve =>
            setTimeout(resolve,350)
        );


        hideTyping();

        addMessage(
            answer,
            "bot"
        );


    }catch(error){

        console.error(error);

        hideTyping();

        addMessage(
            "দুঃখিত, তথ্য প্রক্রিয়া করার সময় একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।",
            "bot"
        );

    }


    sendButton.disabled = false;

    input.focus();

}

   SEND BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendQuestion
);


/* =========================================================
   ENTER KEY
========================================================= */

input.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendQuestion();

        }

    }
);


/* =========================================================
   VOICE INPUT
========================================================= */

/*
   Browser compatibility
*/

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let isListening = false;


/* =========================================================
   CHECK VOICE SUPPORT
========================================================= */

if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    /*
       Continuous false:
       একটি প্রশ্ন বলা শেষ হলে
       recognition নিজে stop করবে।
    */

    recognition.continuous = false;


    /*
       Interim result true:
       কথা বলার সময় text দেখা যাবে।
    */

    recognition.interimResults = true;


    /*
       Bengali first.
    */

    recognition.lang = "bn-BD";


    recognition.maxAlternatives = 1;


    /* =========================
       START
    ========================= */

    recognition.onstart = ()=>{

        isListening = true;

        voiceButton.classList.add(
            "listening"
        );

        voiceButton.textContent =
            "⏹️";

        input.placeholder =
            "শুনছি... কথা বলুন";

        inputHint.textContent =
            "🔴 এখন আপনার কথা শুনছি...";


        botStatus.textContent =
            "আপনার কথা শুনছি...";

    };


    /* =========================
       RESULT
    ========================= */

    recognition.onresult =
        event=>{

            let finalText = "";

            let interimText = "";


            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                const transcript =
                    event.results[i][0].transcript;


                if(
                    event.results[i].isFinal
                ){

                    finalText +=
                        transcript;

                }else{

                    interimText +=
                        transcript;

                }

            }


            /*
               Final text থাকলে input-এ বসানো
            */

            if(finalText){

                input.value =
                    finalText.trim();

            }else if(interimText){

                input.value =
                    interimText.trim();

            }


            input.focus();

        };


    /* =========================
       END
    ========================= */

    recognition.onend = ()=>{

        isListening = false;

        voiceButton.classList.remove(
            "listening"
        );

        voiceButton.textContent =
            "🎤";

        input.placeholder =
            "আপনার প্রশ্ন লিখুন...";

        inputHint.textContent =
            "Enter চাপলে প্রশ্ন পাঠানো যাবে • 🎤 মাইক্রোফোনে কথা বলুন";

        botStatus.textContent =
            "আপনার প্রশ্নের অপেক্ষায়...";


        /*
           Speech recognition শেষ হলে
           text automatically send করবে না।
           
           User চাইলে edit করে পাঠাতে পারবে।
        */

    };


    /* =========================
       ERROR
    ========================= */

    recognition.onerror =
        event=>{

            console.error(
                "Speech recognition error:",
                event.error
            );


            isListening = false;

            voiceButton.classList.remove(
                "listening"
            );

            voiceButton.textContent =
                "🎤";

            input.placeholder =
                "আপনার প্রশ্ন লিখুন...";


            let message =
                "মাইক্রোফোন ব্যবহার করা যায়নি।";


            if(
                event.error ===
                "not-allowed"
            ){

                message =
                    "মাইক্রোফোন Permission দেওয়া হয়নি। Browser Settings থেকে Microphone permission Allow করুন।";

            }else if(
                event.error ===
                "no-speech"
            ){

                message =
                    "কোনো কথা শোনা যায়নি। আবার মাইক্রোফোন চাপুন।";

            }else if(
                event.error ===
                "network"
            ){

                message =
                    "Voice Recognition-এর জন্য browser-এর network service ব্যবহার করা প্রয়োজন। Internet connection পরীক্ষা করুন।";

            }


            inputHint.textContent =
                message;

            botStatus.textContent =
                "Voice Input প্রস্তুত";

        };

}else{

    /*
       Browser unsupported
    */

    voiceButton.disabled =
        true;

    voiceButton.style.opacity =
        ".45";

    inputHint.textContent =
        "এই browser-এ Voice Input support নেই। Chrome ব্যবহার করে চেষ্টা করুন।";

}


/* =========================================================
   MICROPHONE BUTTON
========================================================= */

voiceButton.addEventListener(
    "click",
    async()=>{

        /*
           Browser unsupported
        */

        if(!recognition){

            alert(
                "আপনার browser-এ Voice Input support নেই। Android Chrome ব্যবহার করে চেষ্টা করুন।"
            );

            return;

        }


        /*
           Already listening
        */

        if(isListening){

            recognition.stop();

            return;

        }


        /*
           Start
        */

        try{

            /*
               Bengali recognition
            */

            recognition.lang =
                "bn-BD";


            recognition.start();

        }catch(error){

            console.error(error);

            /*
               কিছু browser-এ দ্রুত
               start করলে InvalidStateError হতে পারে।
            */

            try{

                recognition.stop();

            }catch(e){}

            setTimeout(()=>{

                try{

                    recognition.start();

                }catch(e){

                    inputHint.textContent =
                        "মাইক্রোফোন চালু করা যায়নি। আবার চেষ্টা করুন।";

                }

            },300);

        }

    }
);


/* =========================================================
   SPEECH OUTPUT
   Optional:
   AI answer পড়ে শোনানোর function
========================================================= */

function speakText(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    /*
       URL বাদ
    */

    let clean =
        String(text)
        .replace(
            /https?:\/\/\S+/g,
            ""
        );


    /*
       পুরোনো speech বন্ধ
    */

    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "bn-BD";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;


    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   OPTIONAL: LONG PRESS / DOUBLE TAP
   Bot answer এ click করলে পড়ে শোনাবে
========================================================= */

messages.addEventListener(
    "dblclick",
    event=>{

        const bubble =
            event.target.closest(
                ".message.bot"
            );

        if(!bubble){

            return;
        }


        speakText(
            bubble.innerText
        );

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

(async function(){

    try{

        await loadKnowledge();

    }catch(error){

        console.error(error);

    }

})();


</script>

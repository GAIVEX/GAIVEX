<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX - Admission Exam Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #1e293b; border-bottom: 1px solid #334155; }
        .logo { font-size: 24px; font-weight: 700; color: #38bdf8; }
        .logo span { color: #f43f5e; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 15px; font-weight: 600; }
        .nav-links a.active, .nav-links a:hover { color: #38bdf8; }

        .hero-section { text-align: center; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        .hero-section h1 { font-size: 28px; margin-bottom: 10px; color: #f8fafc; }
        .highlight { color: #38bdf8; }
        .hero-section p { color: #94a3b8; margin-bottom: 30px; }

        .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 10px; }
        .subject-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px 15px; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .subject-box:hover { transform: translateY(-5px); border-color: #38bdf8; background: #334155; }
        .subject-box .icon { font-size: 36px; margin-bottom: 10px; }
        .subject-box h3 { font-size: 20px; color: #f8fafc; }

        /* Admin & Exam Modal Styling */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; }
        .modal-content { background:#1e293b; color:#f8fafc; padding:20px; border-radius:12px; width:92%; max-width:500px; max-height:85vh; overflow-y:auto; border:1px solid #334155; }
        .modal-content label { font-weight:600; display:block; margin-top:10px; margin-bottom:4px; font-size:14px; }
        .modal-content input, .modal-content select, .modal-content textarea { width:100%; padding:8px 10px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff; font-size:14px; margin-bottom:5px; }
        
        .btn-group { display:flex; gap:10px; margin-top:15px; }
        .btn { padding:10px 15px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; flex:1; }
        .btn-save { background:#10b981; color:white; }
        .btn-close { background:#ef4444; color:white; }
        
        .admin-trigger { position: fixed; bottom: 20px; right: 20px; background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; border-radius: 50px; font-weight: bold; cursor: pointer; z-index: 999; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">GAIVEX<span>.</span></div>
        <nav class="nav-links">
            <a href="index.html" class="active">হোম</a>
            <a href="physics.html">পদার্থবিজ্ঞান</a>
            <a href="chemistry.html">রসায়ন</a>
            <a href="biology.html">জীববিজ্ঞান</a>
            <a href="math.html">উচ্চতর গণিত</a>
        </nav>
    </header>

    <main class="hero-section">
        <h1>স্বপ্নের বিশ্ববিদ্যালয়ে ভর্তির প্রস্তুতি হোক <span class="highlight">GAIVEX</span> এর সাথে</h1>
        <p>মেডিক্যাল, ভার্সিটি ও ইঞ্জিনিয়ারিং এডমিশন টেস্টের জন্য বিশেষ মডেল টেস্ট ও সমাধান।</p>
        
        <div class="subject-grid">
            <a href="physics.html" class="subject-box">
                <div class="icon">⚛️</div>
                <h3>পদার্থবিজ্ঞান</h3>
            </a>
            <a href="chemistry.html" class="subject-box">
                <div class="icon">🧪</div>
                <h3>রসায়ন</h3>
            </a>
            <a href="biology.html" class="subject-box">
                <div class="icon">🧬</div>
                <h3>জীববিজ্ঞান</h3>
            </a>
            <a href="math.html" class="subject-box">
                <div class="icon">📐</div>
                <h3>উচ্চতর গণিত</h3>
            </a>
        </div>
    </main>

    <!-- Admin Button & Popup -->
    <button class="admin-trigger" onclick="toggleAdmin()">⚙️ Admin</button>

    <div id="adminModal" class="modal">
      <div class="modal-content">
        <h3 style="color:#38bdf8; text-align:center;">প্রশ্ন ও ব্যাখ্যা যোগ করুন</h3>
        
        <label>১. বিষয় নির্বাচন করুন:</label>
        <select id="admSubject" onchange="updatePaperOptions()">
          <option value="">-- বিষয় বেছে নিন --</option>
          <option value="physics">পদার্থবিজ্ঞান (Physics)</option>
          <option value="chemistry">রসায়ন (Chemistry)</option>
          <option value="biology">জীববিজ্ঞান (Biology)</option>
          <option value="math">উচ্চতর গণিত (Math)</option>
        </select>

        <label>২. পত্র নির্বাচন করুন:</label>
        <select id="admPaper" onchange="updateChapterOptions()">
          <option value="">-- আগে বিষয় বেছে নিন --</option>
        </select>

        <label>৩. অধ্যায় নির্বাচন করুন:</label>
        <select id="admChapter">
          <option value="">-- আগে পত্র বেছে নিন --</option>
        </select>

        <label>পরীক্ষার সময় (মিনিট):</label>
        <input type="number" id="admTime" value="10">

        <label>প্রশ্ন:</label>
        <textarea id="admQuestion" rows="2" placeholder="প্রশ্ন লিখুন..."></textarea>

        <label>অপশন ১:</label> <input type="text" id="admOpt0">
        <label>অপশন ২:</label> <input type="text" id="admOpt1">
        <label>অপশন ৩:</label> <input type="text" id="admOpt2">
        <label>অপশন ৪:</label> <input type="text" id="admOpt3">

        <label>সঠিক উত্তর:</label>
        <select id="admCorrect">
          <option value="0">অপশন ১</option>
          <option value="1">অপশন ২</option>
          <option value="2">অপশন ৩</option>
          <option value="3">অপশন ৪</option>
        </select>

        <label>ব্যাখ্যামূলক উত্তর:</label>
        <textarea id="admExplanation" rows="2" placeholder="এখানে ব্যাখ্যামূলক উত্তর লিখুন..."></textarea>

        <div class="btn-group">
            <button class="btn btn-save" onclick="saveQuestionFromAdmin()">সেভ করুন</button>
            <button class="btn btn-close" onclick="toggleAdmin()">বন্ধ করুন</button>
        </div>
      </div>
    </div>

    <script>
    const ADMIN_PASS = "GAIVEX#@0987";

    // সকল বিষয়ের পত্র ও অধ্যায়ের তালিকা
    const chaptersData = {
        physics: {
            paper1: ["অধ্যায় ১: ভৌতজগৎ ও পরিমাপ", "অধ্যায় ২: ভেক্টর", "অধ্যায় ৩: গতিবিদ্যা", "অধ্যায় ৪: নিউটনীয় বলবিজ্ঞান", "অধ্যায় ৫: কাজ, শক্তি ও ক্ষমতা"],
            paper2: ["অধ্যায় ১: তাপগতিবিদ্যা", "অধ্যায় ২: স্থির তড়িৎ", "অধ্যায় ৩: চল তড়িৎ", "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া"]
        },
        chemistry: {
            paper1: ["অধ্যায় ১: ল্যাবরেটরি নিরাপদ ব্যবহার", "অধ্যায় ২: গুণগত রসায়ন", "অধ্যায় ৩: পর্যায়বৃত্ত ধর্ম", "অধ্যায় ৪: রাসায়নিক পরিবর্তন"],
            paper2: ["অধ্যায় ১: পরিবেশ রসায়ন", "অধ্যায় ২: জৈব রসায়ন", "অধ্যায় ৩: পরিমাণগত রসায়ন", "অধ্যায় ৪: তড়িৎ রসায়ন"]
        },
        biology: {
            paper1: ["অধ্যায় ১: কোষ ও এর গঠন", "অধ্যায় ২: কোষ বিভাজন", "অধ্যায় ৩: কোষ রসায়ন", "অধ্যায় ৪: অণুজীব"],
            paper2: ["অধ্যায় ১: প্রাণীর বিভিন্নতা ও শ্রেণিবিন্যাস", "অধ্যায় ২: প্রাণীর পরিচিতি", "অধ্যায় ৩: মানব শারীরতত্ত্ব"]
        },
        math: {
            paper1: ["অধ্যায় ১: ম্যাট্রিক্স ও নির্ণায়ক", "অধ্যায় ৩: সরলরেখা", "অধ্যায় ৪: বৃত্ত", "অধ্যায় ৯: ডিফারেন্সিয়েশন"],
            paper2: ["অধ্যায় ৩: জটিল সংখ্যা", "অধ্যায় ৪: বহুপদী", "অধ্যায় ৬: কনিক", "অধ্যায় ৭: বিপরীত ত্রিকোণমিতি"]
        }
    };

    function toggleAdmin() {
      const modal = document.getElementById('adminModal');
      if(modal.style.display === 'none' || modal.style.display === '') {
        let pass = prompt("এডমিন পাসওয়ার্ড দিন:");
        if(pass === ADMIN_PASS) {
          modal.style.display = 'flex';
        } else if(pass !== null) {
          alert("ভুল পাসওয়ার্ড!");
        }
      } else {
        modal.style.display = 'none';
      }
    }

    function updatePaperOptions() {
        const sub = document.getElementById('admSubject').value;
        const paperSelect = document.getElementById('admPaper');
        paperSelect.innerHTML = '<option value="">-- পত্র বেছে নিন --</option>';
        document.getElementById('admChapter').innerHTML = '<option value="">-- আগে পত্র বেছে নিন --</option>';

        if(sub) {
            paperSelect.innerHTML += `
                <option value="paper1">১ম পত্র</option>
                <option value="paper2">২য় পত্র</option>
            `;
        }
    }

    function updateChapterOptions() {
        const sub = document.getElementById('admSubject').value;
        const paper = document.getElementById('admPaper').value;
        const chapSelect = document.getElementById('admChapter');
        chapSelect.innerHTML = '<option value="">-- অধ্যায় বেছে নিন --</option>';

        if(sub && paper && chaptersData[sub][paper]) {
            chaptersData[sub][paper].forEach((chap) => {
                chapSelect.innerHTML += `<option value="${chap}">${chap}</option>`;
            });
        }
    }

    function saveQuestionFromAdmin() {
      const subject = document.getElementById('admSubject').value;
      const paper = document.getElementById('admPaper').value;
      const chapter = document.getElementById('admChapter').value;
      const timeLimit = parseInt(document.getElementById('admTime').value) || 10;
      const questionText = document.getElementById('admQuestion').value;
      const options = [
        document.getElementById('admOpt0').value,
        document.getElementById('admOpt1').value,
        document.getElementById('admOpt2').value,
        document.getElementById('admOpt3').value
      ];
      const correct = parseInt(document.getElementById('admCorrect').value);
      const explanation = document.getElementById('admExplanation').value;

      if(!subject || !paper || !chapter || !questionText || !options[0] || !options[1]) {
        alert("দয়া করে বিষয়, পত্র, অধ্যায়, প্রশ্ন এবং অন্তত ২টি অপশন সঠিকভাবে নির্বাচন করুন!");
        return;
      }

      let db = JSON.parse(localStorage.getItem('gaivex_exam_db')) || {};
      
      // ইউনিক কি (Key) তৈরি
      let storageKey = `${subject}_${paper}_${chapter}`;
      
      if(!db[storageKey]) {
        db[storageKey] = { timeLimit: timeLimit, questions: [] };
      }
      
      db[storageKey].timeLimit = timeLimit;
      db[storageKey].questions.push({
        id: Date.now(),
        question: questionText,
        options: options,
        correct: correct,
        explanation: explanation
      });

      localStorage.setItem('gaivex_exam_db', JSON.stringify(db));
      alert("প্রশ্নটি সফলভাবে সেভ করা হয়েছে! আপনি আরও প্রশ্ন সেভ করতে পারেন।");
      
      // প্রশ্ন ইনপুট বক্স ফাঁকা করা যেন পরবর্তী প্রশ্ন লেখা যায়
      document.getElementById('admQuestion').value = '';
      document.getElementById('admOpt0').value = '';
      document.getElementById('admOpt1').value = '';
      document.getElementById('admOpt2').value = '';
      document.getElementById('admOpt3').value = '';
      document.getElementById('admExplanation').value = '';
    }
    </script>
</body>
</html>

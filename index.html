<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX — এক্সাম পোর্টাল</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 15px; }

        /* হেডার এবং ৩-ডট মেনু */
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; position: relative; }
        .logo { font-size: 20px; font-weight: bold; color: #38bdf8; text-decoration: none; }
        
        .menu-container { position: relative; }
        .menu-btn { background: #0f172a; border: 1px solid #475569; color: #fff; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 48px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; width: 160px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; }
        .dropdown-menu a { display: block; padding: 10px 15px; color: #f8fafc; text-decoration: none; font-size: 14px; border-bottom: 1px solid #334155; transition: 0.2s; }
        .dropdown-menu a:last-child { border-bottom: none; }
        .dropdown-menu a:hover { background: #334155; color: #38bdf8; }
        .dropdown-menu.show { display: block; }

        .container { max-width: 600px; margin: 0 auto; }
        
        /* নোটিশ বোর্ড বক্স */
        .notice-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .notice-title { color: #38bdf8; font-size: 18px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .notice-content-area { max-height: 220px; overflow-y: auto; padding-right: 5px; }
        .notice-item { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .notice-item h4 { color: #f8fafc; font-size: 15px; margin-bottom: 5px; }
        .notice-item p { color: #94a3b8; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
        .notice-item img { max-width: 100%; border-radius: 6px; margin-top: 8px; border: 1px solid #334155; }
        .notice-date { font-size: 11px; color: #38bdf8; margin-top: 5px; display: block; }

        /* কার্ড স্টাইল */
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card h2 { color: #38bdf8; font-size: 18px; margin-bottom: 15px; }
        
        .btn { display: block; width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; text-align: center; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 16px; transition: 0.3s; margin-top: 15px; }
        .btn:hover { background: #7dd3fc; }

        /* সাবজেক্ট গ্রিড ডিজাইন (আপনার আগের মতো) */
        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .subject-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; text-align: center; text-decoration: none; color: #fff; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        .subject-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
        .subject-card span { font-size: 28px; }
        .subject-card p { font-size: 15px; color: #f8fafc; }
    </style>
</head>
<body>

    <div class="container">
        <!-- নেভিগেশন বার এবং ৩-ডট মেনু -->
        <div class="header">
            <a href="index.html" class="logo">🚀 GAIVEX</a>
            <div class="menu-container">
                <button class="menu-btn" onclick="toggleMenu()">⋮</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="index.html">🏠 হোম পেজ</a>
                    <a href="admin.html">🛠️ অ্যাডমিন প্যানেল</a>
                </div>
            </div>
        </div>

        <!-- 📢 নোটিশ বোর্ড সেকশন -->
        <div class="notice-box">
            <div class="notice-title">📢 নোটিশ বোর্ড</div>
            <div class="notice-content-area" id="homeNoticeContainer">
                <p style="color: #94a3b8; font-size: 13px; text-align: center;">নোটিশ লোড হচ্ছে...</p>
            </div>
        </div>

        <!-- 🔥 লাইভ ডেইলি এক্সাম কার্ড -->
        <div class="card">
            <h2>🔥 আজকের লাইভ ডেইলি এক্সাম</h2>
            <div id="liveExamInfo" style="color: #94a3b8; font-size: 14px; margin-bottom: 10px;">পরীক্ষার তথ্য লোড হচ্ছে...</div>
            <a href="#" id="startLiveBtn" class="btn" style="display: none;">এক্সাম শুরু করুন 🎯</a>
        </div>

        <!-- 📚 বিষয়ভিত্তিক সাবজেক্ট গ্রিড (পদার্থ, রসায়ন, জীববিজ্ঞান, উচ্চতর গণিত) -->
        <div style="color: #38bdf8; font-weight: bold; font-size: 18px; margin-bottom: 12px;">📚 বিষয়ভিত্তিক এক্সাম</div>
        <div class="subject-grid">
            <a href="chapter-select.html?sub=physics" class="subject-card">
                <span>⚛️</span>
                <p>পদার্থবিজ্ঞান</p>
            </a>
            <a href="chapter-select.html?sub=chemistry" class="subject-card">
                <span>🧪</span>
                <p>রসায়ন</p>
            </a>
            <a href="chapter-select.html?sub=biology" class="subject-card">
                <span>🧬</span>
                <p>জীববিজ্ঞান</p>
            </a>
            <a href="chapter-select.html?sub=math" class="subject-card">
                <span>📐</span>
                <p>উচ্চতর গণিত</p>
            </a>
        </div>
    </div>

    <!-- ফায়ারবেস স্ক্রিপ্ট এবং লজিক -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
        authDomain: "gaivexexam.firebaseapp.com",
        databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
        projectId: "gaivexexam",
        storageBucket: "gaivexexam.firebasestorage.app",
        messagingSenderId: "956204530190",
        appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // ৩-ডট মেনু টগল ফাংশন
      window.toggleMenu = function() {
          const menu = document.getElementById('dropdownMenu');
          menu.classList.toggle('show');
      }

      // মেনুর বাইরে ক্লিক করলে মেনু বন্ধ হয়ে যাবে
      window.onclick = function(event) {
          if (!event.target.matches('.menu-btn')) {
              const dropdowns = document.getElementsByClassName("dropdown-menu");
              for (let i = 0; i < dropdowns.length; i++) {
                  let openDropdown = dropdowns[i];
                  if (openDropdown.classList.contains('show')) {
                      openDropdown.classList.remove('show');
                  }
              }
          }
      }

      // হোম পেজে নোটিশ লোড করা
      async function loadHomeNotices() {
          const container = document.getElementById('homeNoticeContainer');
          try {
              const snapshot = await get(ref(db, 'notices'));
              if (snapshot.exists()) {
                  container.innerHTML = '';
                  const data = snapshot.val();
                  const sortedNotices = Object.values(data).sort((a, b) => b.date - a.date);
                  
                  sortedNotices.forEach(item => {
                      const dateStr = new Date(item.date).toLocaleDateString('bn-BD');
                      let imgTag = item.image ? `<img src="${item.image}" alt="Notice Image">` : '';
                      container.innerHTML += `
                          <div class="notice-item">
                              <h4>📌 ${item.title}</h4>
                              <p>${item.description}</p>
                              ${imgTag}
                              <span class="notice-date">তারিখ: ${dateStr}</span>
                          </div>
                      `;
                  });
              } else {
                  container.innerHTML = '<p style="color:#94a3b8; font-size:13px; text-align:center;">বর্তমানে কোনো নোটিশ নেই।</p>';
              }
          } catch (e) {
              container.innerHTML = '<p style="color:#f43f5e; font-size:13px; text-align:center;">নোটিশ লোড করতে সমস্যা হয়েছে।</p>';
          }
      }

      // লাইভ এক্সাম ডাটা লোড
      async function loadLiveExam() {
          try {
              const snapshot = await get(ref(db, 'live_exams/live_daily_exam'));
              const infoDiv = document.getElementById('liveExamInfo');
              const startBtn = document.getElementById('startLiveBtn');

              if (snapshot.exists()) {
                  const data = snapshot.val();
                  infoDiv.innerHTML = `<b>শিরোনাম:</b> ${data.title}<br><b>সময়:</b> ${data.duration} মিনিট | <b>প্রশ্ন সংখ্যা:</b> ${data.questions ? data.questions.length : 0}টি`;
                  startBtn.style.display = 'block';
                  startBtn.href = `exam.html?type=live`;
              } else {
                  infoDiv.innerHTML = "আজকের কোনো লাইভ এক্সাম এখন পাবলিশ করা হয়নি।";
                  startBtn.style.display = 'none';
              }
          } catch(e) {
              document.getElementById('liveExamInfo').innerHTML = "ডেটা লোড করতে সমস্যা হয়েছে।";
          }
      }

      loadHomeNotices();
      loadLiveExam();
    </script>
</body>
</html>

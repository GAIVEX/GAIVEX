<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .login-card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-card h2 { color: #38bdf8; margin-bottom: 10px; font-size: 22px; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 15px; margin-bottom: 15px; outline: none; }
        .login-card input:focus { border-color: #38bdf8; }
        .login-card button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .login-card button:hover { background: #7dd3fc; }
        .error-msg { color: #f43f5e; font-size: 13px; margin-top: 10px; display: none; }

        .admin-card { display: none; width: 100%; max-width: 800px; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-card h2 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
        label { font-weight: bold; margin-top: 12px; display: block; color: #cbd5e1; font-size: 14px; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px 12px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        
        .btn-submit { background: #10b981; color: #fff; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 25px; font-size: 16px; transition: 0.3s; }
        .btn-submit:hover { background: #059669; }
        .btn-clear { background: #f43f5e; color: #fff; font-weight: bold; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-clear:hover { background: #e11d48; }
        
        .q-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-top: 15px; position: relative; }
        .remove-btn { position: absolute; top: 10px; right: 10px; background: #f43f5e; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .status-badge { background: #0284c7; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="login-card" id="loginBox">
        <h2>🔒 GAIVEX অ্যাডমিন লক</h2>
        <p>অ্যাডমিন প্যানেলে প্রবেশ করতে পাসওয়ার্ড লিখুন</p>
        <form onsubmit="verifyPassword(event)">
            <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড লিখুন..." required>
            <button type="submit">আনলক করুন 🔓</button>
        </form>
        <div class="error-msg" id="errorMsg">❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</div>
    </div>

    <div class="admin-card" id="adminPanel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;">
            <h2 style="margin:0;">🛠️ GAIVEX প্রশ্ন ব্যবস্থাপনা</h2>
            <button onclick="location.reload()" style="background: #475569; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">লগআউট</button>
        </div>

        <div id="loadingText" style="color: #38bdf8; text-align: center; margin: 15px 0;">ডাটাবেস থেকে প্রশ্ন লোড হচ্ছে...</div>

        <div id="examFormContent" style="display: none;">
            <label>পরীক্ষার শিরোনাম (Exam Title):</label>
            <input type="text" id="examTitle" placeholder="যেমন: প্রাণীর পরিচিতি — ৩০টি MCQ">

            <label>পরীক্ষার সময় (মিনিটে):</label>
            <input type="number" id="examDuration" placeholder="20">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px; flex-wrap: wrap; gap: 10px;">
                <h3 style="color: #38bdf8;">প্রশ্ন তালিকা (<span id="totalQCount">0</span>টি)</h3>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn-clear" onclick="deleteAllQuestions()">🗑️ সকল প্রশ্ন ডিলিট করুন</button>
                    <button type="button" onclick="addQuestionField()" style="background: #0284c7; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">+ নতুন প্রশ্ন</button>
                </div>
            </div>

            <div id="questionsContainer"></div>

            <button type="button" class="btn-submit" onclick="saveExamData()">পরিবর্তন সেভ ও লাইভ আপডেট করুন 🚀</button>
        </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
        authDomain: "gaivexexam.firebaseapp.com",
        databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
        projectId: "gaivexexam",
        storageBucket: "gaivexexam.firebasestorage.app",
        messagingSenderId: "956204530190",
        appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const SECRET_PASS = "GAIVEX#@004754Scholars";

      window.verifyPassword = function(e) {
        e.preventDefault();
        const inputPass = document.getElementById('adminPassword').value;
        if (inputPass === SECRET_PASS) {
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          document.body.style.alignItems = 'flex-start';
          loadExistingData();
        } else {
          document.getElementById('errorMsg').style.display = 'block';
          document.getElementById('adminPassword').value = '';
        }
      };

      function cleanText(text, type = 'q') {
        if (!text) return '';
        let str = text.trim();
        if (type === 'q') return str.replace(/^[\d১-৯]+\.\s*/, '');
        if (type === 'opt') return str.replace(/^[ক-ঘa-dA-D]\)\s*/, '');
        return str;
      }

      async function loadExistingData() {
        try {
          const snapshot = await get(ref(db, 'live_exams/live_daily_exam'));
          document.getElementById('loadingText').style.display = 'none';
          document.getElementById('examFormContent').style.display = 'block';

          if (snapshot.exists()) {
            const data = snapshot.val();
            document.getElementById('examTitle').value = data.title || '';
            document.getElementById('examDuration').value = data.duration || 20;

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            if (data.questions && data.questions.length > 0) {
              data.questions.forEach((q, index) => addQuestionField(q, index + 1));
            } else {
              addQuestionField();
            }
          } else {
            addQuestionField();
          }
          updateQCount();
        } catch (e) {
          alert("ডাটা লোড করতে সমস্যা হয়েছে: " + e.message);
        }
      }

      window.addQuestionField = function(qData = null) {
        const container = document.getElementById('questionsContainer');
        const qIndex = container.children.length + 1;

        const div = document.createElement('div');
        div.className = 'q-box';
        
        const qText = qData ? cleanText(qData.question, 'q') : '';
        const opts = qData ? (qData.options || []).map(o => cleanText(o, 'opt')) : ['', '', '', ''];
        const correct = qData ? qData.correct : 0;
        const exp = qData ? qData.explanation || '' : '';

        div.innerHTML = `
          <button type="button" class="remove-btn" onclick="this.parentElement.remove(); window.updateQCount();">🗑️ ডিলিট</button>
          <span class="status-badge">প্রশ্ন #<span class="q-num">${qIndex}</span></span>
          <input type="text" class="q-text" value="${qText}" placeholder="প্রশ্নটি লিখুন" required>
          
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:8px;">
            <input type="text" class="opt-0" value="${opts[0] || ''}" placeholder="ক অপশন" required>
            <input type="text" class="opt-1" value="${opts[1] || ''}" placeholder="খ অপশন" required>
            <input type="text" class="opt-2" value="${opts[2] || ''}" placeholder="গ অপশন" required>
            <input type="text" class="opt-3" value="${opts[3] || ''}" placeholder="ঘ অপশন" required>
          </div>
          
          <label style="margin-top:10px;">সঠিক উত্তর সিলেক্ট করুন:</label>
          <select class="q-correct">
            <option value="0" ${correct === 0 ? 'selected' : ''}>ক) ১ম অপশন</option>
            <option value="1" ${correct === 1 ? 'selected' : ''}>খ) ২য় অপশন</option>
            <option value="2" ${correct === 2 ? 'selected' : ''}>গ) ৩য় অপশন</option>
            <option value="3" ${correct === 3 ? 'selected' : ''}>ঘ) ৪র্থ অপশন</option>
          </select>
          
          <textarea class="q-exp" placeholder="উত্তর ব্যাখ্যা (ঐচ্ছিক)" style="margin-top:8px;" rows="2">${exp}</textarea>
        `;
        
        container.appendChild(div);
        updateQCount();
      };

      window.updateQCount = function() {
        const boxes = document.querySelectorAll('.q-box');
        document.getElementById('totalQCount').innerText = boxes.length;
        boxes.forEach((box, i) => {
          const numSpan = box.querySelector('.q-num');
          if(numSpan) numSpan.innerText = i + 1;
        });
      };

      // সকল প্রশ্ন ডিলিট ফংশন
      window.deleteAllQuestions = async function() {
        if(confirm("⚠️ আপনি কি নিশ্চিত যে অ্যাডমিন প্যানেল থেকে সকল প্রশ্ন মুছে ফেলতে চান? এতে liveexam.html ফাইলে অটোমেটিক ডিফল্ট ৩০টি প্রশ্ন লোড হয়ে যাবে।")) {
          try {
            await remove(ref(db, 'live_exams/live_daily_exam'));
            alert("✅ ফায়ারবেস থেকে সমস্ত প্রশ্ন সফলভাবে মুছে ফেলা হয়েছে!");
            location.reload();
          } catch(e) {
            alert("ত্রুটি ঘটেছে: " + e.message);
          }
        }
      };

      window.saveExamData = async function() {
        const title = document.getElementById('examTitle').value;
        const duration = parseInt(document.getElementById('examDuration').value, 10) || 20;
        const qBoxes = document.querySelectorAll('.q-box');
        const questions = [];

        qBoxes.forEach(box => {
          const qText = cleanText(box.querySelector('.q-text').value, 'q');
          const opt0 = cleanText(box.querySelector('.opt-0').value, 'opt');
          const opt1 = cleanText(box.querySelector('.opt-1').value, 'opt');
          const opt2 = cleanText(box.querySelector('.opt-2').value, 'opt');
          const opt3 = cleanText(box.querySelector('.opt-3').value, 'opt');
          const correct = parseInt(box.querySelector('.q-correct').value, 10);
          const exp = box.querySelector('.q-exp').value;

          if(qText) {
            questions.push({
              question: qText,
              options: [opt0, opt1, opt2, opt3],
              correct: correct,
              explanation: exp
            });
          }
        });

        if(!title || questions.length === 0) {
          alert("অনুগ্রহ করে পরীক্ষার শিরোনাম এবং অন্তত ১টি প্রশ্ন রাখুন!");
          return;
        }

        try {
          await set(ref(db, 'live_exams/live_daily_exam'), {
            id: "exam_" + Date.now(),
            title: title,
            duration: duration,
            questions: questions
          });
          alert("🎉 প্রশ্নগুলো সফলভাবে আপডেট ও সেভ হয়েছে!");
          location.reload();
        } catch(e) {
          alert("ত্রুটি ঘটেছে: " + e.message);
        }
      };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .login-card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-card h2 { color: #38bdf8; margin-bottom: 10px; font-size: 22px; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; font-size: 15px; margin-bottom: 15px; outline: none; }
        .login-card input:focus { border-color: #38bdf8; }
        .login-card button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .login-card button:hover { background: #7dd3fc; }
        .error-msg { color: #f43f5e; font-size: 13px; margin-top: 10px; display: none; }

        .admin-card { display: none; width: 100%; max-width: 750px; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-card h2 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
        label { font-weight: bold; margin-top: 12px; display: block; color: #cbd5e1; font-size: 14px; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px 12px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        
        .btn-submit { background: #10b981; color: #fff; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 25px; font-size: 16px; transition: 0.3s; }
        .btn-submit:hover { background: #059669; }
        
        .q-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-top: 15px; position: relative; }
        .remove-btn { position: absolute; top: 10px; right: 10px; background: #f43f5e; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="login-card" id="loginBox">
        <h2>🔒 GAIVEX অ্যাডমিন লক</h2>
        <p>অ্যাডমিন প্যানেলে প্রবেশ করতে পাসওয়ার্ড লিখুন</p>
        <form onsubmit="verifyPassword(event)">
            <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড লিখুন..." required>
            <button type="submit">আনলক করুন 🔓</button>
        </form>
        <div class="error-msg" id="errorMsg">❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</div>
    </div>

    <div class="admin-card" id="adminPanel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;">
            <h2 style="margin:0;">🛠️ GAIVEX অ্যাডমিন প্যানেল</h2>
            <button onclick="location.reload()" style="background: #f43f5e; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">লগআউট</button>
        </div>
        
        <label>পরীক্ষার শিরোনাম (Exam Title):</label>
        <input type="text" id="examTitle" placeholder="যেমন: সাধারণ বিজ্ঞান - মডেল টেস্ট ১">

        <label>পরীক্ষার সময় (মিনিটে):</label>
        <input type="number" id="examDuration" placeholder="15">

        <h3 style="margin-top: 25px; color: #38bdf8;">প্রশ্নাবলি যুক্ত করুন</h3>
        <div id="questionsContainer"></div>

        <button type="button" onclick="addQuestionField()" style="background: #334155; color: #38bdf8; border: 1px solid #38bdf8; padding: 10px 18px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; width: 100%;">+ নতুন প্রশ্ন যোগ করুন</button>

        <button type="button" class="btn-submit" onclick="saveExamData()">লাইভ পরীক্ষা পাবলিশ করুন 🚀</button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
        authDomain: "gaivexexam.firebaseapp.com",
        databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
        projectId: "gaivexexam",
        storageBucket: "gaivexexam.firebasestorage.app",
        messagingSenderId: "956204530190",
        appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const SECRET_PASS = "GAIVEX#@004754Scholars";
      let questionCount = 0;

      window.verifyPassword = function(e) {
        e.preventDefault();
        const inputPass = document.getElementById('adminPassword').value;
        const errorMsg = document.getElementById('errorMsg');

        if (inputPass === SECRET_PASS) {
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          document.body.style.alignItems = 'flex-start';
          if(questionCount === 0) {
            window.addQuestionField();
          }
        } else {
          errorMsg.style.display = 'block';
          document.getElementById('adminPassword').value = '';
        }
      };

      window.addQuestionField = function() {
        questionCount++;
        const container = document.getElementById('questionsContainer');
        const div = document.createElement('div');
        div.className = 'q-box';
        div.id = `q_box_${questionCount}`;
        div.innerHTML = `
          <button type="button" class="remove-btn" onclick="document.getElementById('q_box_${questionCount}').remove()">মুছে ফেলুন</button>
          <h4 style="color: #38bdf8;">প্রশ্ন #${questionCount}</h4>
          <input type="text" class="q-text" placeholder="প্রশ্নটি লিখুন" required>
          <input type="text" class="opt-0" placeholder="ক) ১ম অপশন" required style="margin-top:5px;">
          <input type="text" class="opt-1" placeholder="খ) ২য় অপশন" required style="margin-top:5px;">
          <input type="text" class="opt-2" placeholder="গ) ৩য় অপশন" required style="margin-top:5px;">
          <input type="text" class="opt-3" placeholder="ঘ) ৪র্থ অপশন" required style="margin-top:5px;">
          
          <label>সঠিক উত্তর বেছে নিন:</label>
          <select class="q-correct">
            <option value="0">ক) ১ম অপশন</option>
            <option value="1">খ) ২য় অপশন</option>
            <option value="2">গ) ৩য় অপশন</option>
            <option value="3">ঘ) ৪র্থ অপশন</option>
          </select>
          
          <textarea class="q-exp" placeholder="উত্তর ব্যাখ্যা (ঐচ্ছিক)" style="margin-top:8px;" rows="2"></textarea>
        `;
        container.appendChild(div);
      };

      window.saveExamData = async function() {
        const title = document.getElementById('examTitle').value;
        const duration = parseInt(document.getElementById('examDuration').value, 10) || 15;
        
        const qBoxes = document.querySelectorAll('.q-box');
        const questions = [];

        qBoxes.forEach(box => {
          const qText = box.querySelector('.q-text').value;
          const opt0 = box.querySelector('.opt-0').value;
          const opt1 = box.querySelector('.opt-1').value;
          const opt2 = box.querySelector('.opt-2').value;
          const opt3 = box.querySelector('.opt-3').value;
          
          // সঠিক উত্তরের ভ্যালু ইন্টারজারে কনভার্ট করা
          const correct = parseInt(box.querySelector('.q-correct').value, 10);
          const exp = box.querySelector('.q-exp').value;

          if(qText) {
            questions.push({
              question: qText,
              options: [opt0, opt1, opt2, opt3],
              correct: correct,
              explanation: exp
            });
          }
        });

        if(!title || questions.length === 0) {
          alert("অনুগ্রহ করে পরীক্ষার শিরোনাম এবং অন্তত ১টি প্রশ্ন পূরণ করুন!");
          return;
        }

        try {
          await set(ref(db, 'live_exams/live_daily_exam'), {
            id: "exam_" + Date.now(),
            title: title,
            duration: duration,
            questions: questions
          });
          alert("🎉 নতুন পরীক্ষা সফলভাবে লাইভ পাবলিশ হয়েছে!");
          location.reload();
        } catch(e) {
          alert("ত্রুটি ঘটেছে: " + e.message);
        }
      };
    </script>
</body>
</html>

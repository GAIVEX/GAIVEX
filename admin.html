<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন প্যানেল - GAIVEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .admin-card { max-width: 800px; margin: 0 auto 20px auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 15px; font-size: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 14px; }
        
        .btn { background: #38bdf8; color: #0f172a; padding: 10px 20px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.2s; font-size: 15px; }
        .btn:hover { background: #0284c7; color: white; }
        .btn-danger { background: #f43f5e; color: white; }
        .btn-danger:hover { background: #e11d48; }

        .q-item { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .q-text { font-size: 14px; color: #f8fafc; flex: 1; }
        .action-btns { display: flex; gap: 6px; }
        
        .edit-btn { background: #f59e0b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .edit-btn:hover { background: #d97706; }
        .del-btn { background: #f43f5e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .del-btn:hover { background: #e11d48; }

        .editing-mode { border: 2px solid #f59e0b; }
    </style>
</head>
<body>

    <!-- হেডার/পরীক্ষার তথ্য সেকশন -->
    <div class="admin-card">
        <h2>পরীক্ষার শিরোনাম ও সময় আপডেট করুন</h2>
        <label>পরীক্ষার বিষয়/শিরোনাম</label>
        <input type="text" id="examTitle" placeholder="যেমন: প্রাণীর পরিচিতি - রুই মাছ">
        
        <label>পরীক্ষার সময় (মিনিটে)</label>
        <input type="number" id="examDuration" value="20">

        <button class="btn" id="saveHeaderBtn">পরীক্ষার তথ্য সেভ করুন 💾</button>
    </div>

    <!-- প্রশ্ন যোগ ও এডিট ফর্ম -->
    <div class="admin-card" id="questionFormCard">
        <h2 id="formHeaderTitle">নতুন প্রশ্ন যোগ করুন</h2>
        <form id="questionForm">
            <input type="hidden" id="editIndex" value="-1">

            <label>প্রশ্ন:</label>
            <input type="text" id="qTitle" required placeholder="প্রশ্ন লিখুন...">

            <label>অপশন ১:</label>
            <input type="text" id="opt0" required placeholder="প্রথম অপশন">

            <label>অপশন ২:</label>
            <input type="text" id="opt1" required placeholder="দ্বিতীয় অপশন">

            <label>অপশন ৩:</label>
            <input type="text" id="opt2" required placeholder="তৃতীয় অপশন">

            <label>অপশন ৪:</label>
            <input type="text" id="opt3" required placeholder="চতুর্থ অপশন">

            <label>সঠিক উত্তরটি সিলেক্ট করুন:</label>
            <select id="correctOpt">
                <option value="0">অপশন ১</option>
                <option value="1">অপশন ২</option>
                <option value="2">অপশন ৩</option>
                <option value="3">অপশন ৪</option>
            </select>

            <label>ব্যাখ্যা (ঐচ্ছিক):</label>
            <textarea id="qExplanation" rows="2" placeholder="সঠিক উত্তরের ব্যাখ্যা..."></textarea>

            <button type="submit" class="btn" id="submitFormBtn" style="background: #10b981;">প্রশ্ন যোগ করুন ➕</button>
            <button type="button" class="btn btn-danger" id="cancelEditBtn" style="display:none; margin-top: 8px;">এডিট বাতিল করুন ✖️</button>
        </form>
    </div>

    <!-- বর্তমান প্রশ্নসমূহের তালিকা -->
    <div class="admin-card">
        <h2>বর্তমান সকল প্রশ্নের তালিকা (<span id="totalQCount">0</span>)</h2>
        <div id="questionsList">লোড হচ্ছে...</div>
        <button class="btn btn-danger" id="deleteAllBtn" style="margin-top:20px;">সকল প্রশ্ন একবারে মুছে ফেলুন ⚠️</button>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
        authDomain: "gaivexexam.firebaseapp.com",
        databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
        projectId: "gaivexexam",
        storageBucket: "gaivexexam.firebasestorage.app",
        messagingSenderId: "956204530190",
        appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      let currentExamData = {
        title: "লাইভ পরীক্ষা",
        duration: 20,
        questions: []
      };

      // ডেটাবেজ থেকে বিদ্যমান ডেটা লোড করা
      async function loadExamData() {
        try {
          const snapshot = await get(ref(db, 'live_exams/live_daily_exam'));
          if (snapshot.exists()) {
            currentExamData = snapshot.val();
            if (!currentExamData.questions) currentExamData.questions = [];
          }
          document.getElementById('examTitle').value = currentExamData.title || '';
          document.getElementById('examDuration').value = currentExamData.duration || 20;
          renderAdminQuestions();
        } catch(e) {
          alert("ডেটা লোড করতে সমস্যা হয়েছে: " + e.message);
        }
      }

      // তালিকা রেন্ডার করা
      function renderAdminQuestions() {
        const listDiv = document.getElementById('questionsList');
        const qList = currentExamData.questions || [];
        document.getElementById('totalQCount').innerText = qList.length;

        if (qList.length === 0) {
          listDiv.innerHTML = "<p style='color:#94a3b8;'>বর্তমানে কোনো প্রশ্ন যোগ করা নেই।</p>";
          return;
        }

        listDiv.innerHTML = qList.map((q, index) => `
          <div class="q-item">
            <div class="q-text">
              <b>${index + 1}. ${q.question}</b><br>
              <small style="color: #10b981;">সঠিক উত্তর: ${q.options ? q.options[q.correct] : 'অজানা'}</small>
            </div>
            <div class="action-btns">
              <button class="edit-btn" onclick="editQuestion(${index})">এডিট ✏️</button>
              <button class="del-btn" onclick="deleteQuestion(${index})">ডিলিট 🗑️</button>
            </div>
          </div>
        `).join('');

        // প্রশ্ন এডিট করার ফাংশন
        window.editQuestion = function(index) {
          const q = currentExamData.questions[index];
          document.getElementById('editIndex').value = index;
          document.getElementById('qTitle').value = q.question || '';
          document.getElementById('opt0').value = q.options ? q.options[0] : '';
          document.getElementById('opt1').value = q.options ? q.options[1] : '';
          document.getElementById('opt2').value = q.options ? q.options[2] : '';
          document.getElementById('opt3').value = q.options ? q.options[3] : '';
          document.getElementById('correctOpt').value = q.correct !== undefined ? q.correct : 0;
          document.getElementById('qExplanation').value = q.explanation || '';

          // ফর্মে এডিট মোড অন করা
          document.getElementById('formHeaderTitle').innerText = `প্রশ্ন নং ${index + 1} এডিট করা হচ্ছে...`;
          document.getElementById('formHeaderTitle').style.color = '#f59e0b';
          const submitBtn = document.getElementById('submitFormBtn');
          submitBtn.innerText = "প্রশ্ন আপডেট করুন 🔄";
          submitBtn.style.background = "#f59e0b";
          document.getElementById('cancelEditBtn').style.display = "block";
          document.getElementById('questionFormCard').classList.add('editing-mode');

          window.scrollTo({ top: document.getElementById('questionFormCard').offsetTop - 20, behavior: 'smooth' });
        };

        // প্রশ্ন ডিলিট করার ফাংশন
        window.deleteQuestion = async function(index) {
          if (confirm(`আপনি কি সত্যিই ${index + 1} নম্বর প্রশ্নটি ডিলিট করতে চান?`)) {
            currentExamData.questions.splice(index, 1);
            await saveToDatabase();
            resetForm();
            renderAdminQuestions();
          }
        };
      }

      // ফর্ম রিসেট
      function resetForm() {
        document.getElementById('editIndex').value = "-1";
        document.getElementById('questionForm').reset();
        document.getElementById('formHeaderTitle').innerText = "নতুন প্রশ্ন যোগ করুন";
        document.getElementById('formHeaderTitle').style.color = '#38bdf8';
        const submitBtn = document.getElementById('submitFormBtn');
        submitBtn.innerText = "প্রশ্ন যোগ করুন ➕";
        submitBtn.style.background = "#10b981";
        document.getElementById('cancelEditBtn').style.display = "none";
        document.getElementById('questionFormCard').classList.remove('editing-mode');
      }

      // ক্লাউড ডেটাবেজে সেভ করা
      async function saveToDatabase() {
        try {
          await set(ref(db, 'live_exams/live_daily_exam'), currentExamData);
          alert("ডেটাবেজ সফলভাবে আপডেট করা হয়েছে!");
        } catch(err) {
          alert("সেভ করতে সমস্যা হয়েছে: " + err.message);
        }
      }

      // টাইটেল ও সময় সেভ
      document.getElementById('saveHeaderBtn').addEventListener('click', async () => {
        currentExamData.title = document.getElementById('examTitle').value;
        currentExamData.duration = parseInt(document.getElementById('examDuration').value) || 20;
        await saveToDatabase();
      });

      // নতুন প্রশ্ন যোগ বা আপডেট
      document.getElementById('questionForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const editIndex = parseInt(document.getElementById('editIndex').value);

        const qData = {
          question: document.getElementById('qTitle').value,
          options: [
            document.getElementById('opt0').value,
            document.getElementById('opt1').value,
            document.getElementById('opt2').value,
            document.getElementById('opt3').value
          ],
          correct: parseInt(document.getElementById('correctOpt').value),
          explanation: document.getElementById('qExplanation').value || "কোনো ব্যাখ্যা নেই।"
        };

        if(!currentExamData.questions) currentExamData.questions = [];

        if (editIndex >= 0) {
          currentExamData.questions[editIndex] = qData; // আপডেট
        } else {
          currentExamData.questions.push(qData); // নতুন যোগ
        }
        
        await saveToDatabase();
        resetForm();
        renderAdminQuestions();
      });

      document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

      // সব প্রশ্ন মোছা
      document.getElementById('deleteAllBtn').addEventListener('click', async () => {
        if(confirm("সতর্কতা: আপনি কি সবগুলো প্রশ্ন মুছে ফেলতে চান?")) {
          currentExamData.questions = [];
          await saveToDatabase();
          resetForm();
          renderAdminQuestions();
        }
      });

      loadExamData();
    </script>
</body>
</html>

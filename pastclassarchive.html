<head>

<title>GAIVEX - Class Archiver Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
    --bg:#080d1a;
    --bg-glow-1: rgba(56,189,248,.14);
    --bg-glow-2: rgba(244,63,94,.10);
    --glass: rgba(22,32,52,.55);
    --glass-border: rgba(148,163,184,.14);
    --ink:#f1f5f9;
    --ink-dim:#94a3b8;
    --ink-faint:#64748b;
    --sky:#38bdf8;
    --sky-deep:#0284c7;
    --rose:#f43f5e;
    --ok:#10b981;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; font-family:'Hind Siliguri', sans-serif; background:var(--bg); color:var(--ink); }
.latin{ font-family:'Outfit',sans-serif; }

body{
    background:
        radial-gradient(ellipse 900px 600px at 12% -5%, var(--bg-glow-1), transparent 55%),
        radial-gradient(ellipse 800px 700px at 95% 15%, var(--bg-glow-2), transparent 50%),
        var(--bg);
    min-height:100vh;
    padding-bottom: 50px;
}

button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; }

.glass{
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-border);
    box-shadow:0 8px 32px rgba(0,0,0,.3);
}

/* TOPBAR */
.topbar{
    position:sticky; top:0; z-index:200;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; border-bottom:1px solid var(--glass-border);
    background:rgba(8,13,26,.75); backdrop-filter:blur(18px);
}
.brand-mark{ font-family:'Outfit',sans-serif; font-weight:800; font-size:22px; color:var(--sky); }
.brand-mark span{ color:var(--rose); }

/* CONTAINER & FORMS */
.main-container{ max-width:850px; margin:30px auto; padding:0 18px; }

.card{ border-radius:var(--radius-lg); padding:24px; margin-bottom:20px; }
.card-title{ font-size:18px; font-weight:700; color:var(--sky); margin-bottom:18px; border-bottom:1px solid var(--glass-border); padding-bottom:10px; }

.form-group{ margin-bottom:14px; }
.form-label{ font-size:13px; font-weight:600; color:var(--ink-dim); margin-bottom:6px; display:block; }
.form-control{
    width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--glass-border);
    background:rgba(15,23,42,.6); color:#fff; font-size:13.5px; outline:none; transition:.2s;
}
.form-control:focus{ border-color:var(--sky); box-shadow:0 0 10px rgba(56,189,248,.2); }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.btn-primary{
    padding:12px 20px; border-radius:var(--radius-sm); border:none;
    background:linear-gradient(135deg,#38bdf8,#0284c7); color:#04121e;
    font-weight:700; font-size:14px; transition:.15s; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
}
.btn-primary:hover{ opacity:.9; }

.btn-secondary{
    padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--glass-border);
    background:rgba(255,255,255,.05); color:var(--ink); font-size:12px; font-weight:600;
}
.btn-secondary:hover{ background:rgba(255,255,255,.1); }

.res-item-row{ display:grid; grid-template-columns:140px 1fr 40px; gap:8px; margin-bottom:8px; align-items:center; }
.btn-del{ background:rgba(244,63,94,.15); color:var(--rose); border:1px solid rgba(244,63,94,.3); border-radius:6px; height:38px; cursor:pointer; font-weight:700; }

@media(max-width:600px){
    .form-row{ grid-template-columns:1fr; }
    .res-item-row{ grid-template-columns:1fr; }
}
</style>
</head>

        </div>

        <hr style="border-color:var(--glass-border); margin:18px 0;">

        <!-- STEP 3: RESOURCES (PDF & SHEETS) -->
        <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <label class="form-label" style="margin:0;">📁 লেকচার শিট / নোটস / প্র্যাকটিস লিঙ্ক</label>

            </div>

        </div>

            💾 ডাটাবেসে সেভ ও আর্কাইভ করুন
        </button>
    </div>
</div>

    Object.keys(SUBJECT_DATA).forEach(key => {

    });
    document.getElementById("classDate").valueAsDate = new Date();
    addResourceRow(); // default 1 resource field
};

window.onSubjectChange = function(){
    const subKey = document.getElementById("selSubject").value;

    const selChapter = document.getElementById("selChapter");

    selPaper.innerHTML = '<option value="">পত্র সিলেক্ট করুন...</option>';
    selChapter.innerHTML = '<option value="">আগে পত্র সিলেক্ট করুন</option>';

    if(subKey && SUBJECT_DATA[subKey]){
        const papers = SUBJECT_DATA[subKey].papers;
        Object.keys(papers).forEach(pKey => {
            selPaper.innerHTML += `<option value="${pKey}">${papers[pKey].title}</option>`;
        });
    }
};

    selChapter.innerHTML = '<option value="">অধ্যায় সিলেক্ট করুন...</option>';

    if(subKey && paperKey && SUBJECT_DATA[subKey].papers[paperKey]){
        const chapters = SUBJECT_DATA[subKey].papers[paperKey].chapters;
        chapters.forEach(chap => {
            selChapter.innerHTML += `<option value="${chap}">${chap}</option>`;
        });
    }
};

// RESOURCE ROW HANDLERS
window.addResourceRow = function(){
    const container = document.getElementById("resourceContainer");
    const div = document.createElement("div");
    div.className = "res-item-row";
    div.innerHTML = `
        <select class="form-control res-type">
            <option value="Lecture Sheet">Lecture Sheet</option>
            <option value="Practice Sheet">Practice Sheet</option>
            <option value="Class Note">Class Note</option>
            <option value="Exam Link">Exam Link</option>
        </select>
        <input class="form-control res-url" placeholder="Google Drive/PDF link (https://...)">
        <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(div);
};

// FIREBASE UPLOAD
window.uploadClassArchive = async function(){
    const sub = document.getElementById("selSubject").value;
    const paper = document.getElementById("selPaper").value;
    const chapter = document.getElementById("selChapter").value;
    const title = document.getElementById("classTitle").value.trim();
    const teacher = document.getElementById("teacherName").value.trim();
    const date = document.getElementById("classDate").value;
    const videoUrl = document.getElementById("videoUrl").value.trim();

    if(!sub || !paper || !chapter || !title || !videoUrl){
        alert("⚠️ বিষয, পত্র, অধ্যায়, ক্লাসের শিরোনাম এবং ভিডিও লিংক দেওয়া বাধ্যতামূলক!");
        return;
    }

    // Collect resources
    const resources = [];
    document.querySelectorAll(".res-item-row").forEach(row => {
        const type = row.querySelector(".res-type").value;
        const url = row.querySelector(".res-url").value.trim();
        if(url){
            resources.push({ title: type, type: type, url: url });
        }
    });

    // Sanitized Firebase Key
    const sanitizedChapter = chapter.replace(/[.#$\[\]]/g, "_");
    const targetPath = `archives/${sub}/${paper}/${sanitizedChapter}`;

    const payload = {
        title: title,
        teacher: teacher,
        date: date,
        videoUrl: videoUrl,
        resources: resources,
        timestamp: Date.now()
    };

    try {
        await push(ref(db, targetPath), payload);
        alert("✅ ক্লাসটি সফলভাবে আর্কাইভ করা হয়েছে!");
        document.getElementById("classTitle").value = "";
        document.getElementById("videoUrl").value = "";
        document.getElementById("resourceContainer").innerHTML = "";
        addResourceRow();
    } catch(err) {
        console.error(err);
        alert("❌ আপলোড করতে সমস্যা হয়েছে! ইন্টারনেট ও কনফিগারেশন চেক করুন।");
    }
};
</script>

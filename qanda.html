<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIVEX Q&A</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- KaTeX CSS & JS (Mathematical Formula Rendering Support) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Hind Siliguri',sans-serif;
}

body{
    background:#0f172a;
    color:#f8fafc;
    min-height:100vh;
}

button,input,select,textarea{
    font-family:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(30,41,59,.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #334155;
    padding:12px 4%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#38bdf8;
    font-size:22px;
    font-weight:700;
    text-decoration:none;
}

.logo span{
    color:#f43f5e;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    cursor:pointer;
    position:relative;
    font-size:19px;
}

.notification-count{
    position:absolute;
    top:-4px;
    right:-3px;
    background:#f43f5e;
    color:white;
    min-width:18px;
    height:18px;
    border-radius:50%;
    font-size:10px;
    display:none;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px 14px 80px;
}

.top-title{
    text-align:center;
    margin:10px 0 18px;
}

.top-title h1{
    color:#38bdf8;
    font-size:25px;
}

.top-title p{
    color:#94a3b8;
    font-size:13px;
    margin-top:4px;
}

.card{
    background:rgba(30,41,59,.94);
    border:1px solid #334155;
    border-radius:14px;
    padding:16px;
    margin-bottom:15px;
}

.card-title{
    color:#38bdf8;
    font-size:17px;
    font-weight:700;
    margin-bottom:12px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

select{
    width:100%;
    padding:10px;
    background:#0f172a;
    border:1px solid #475569;
    color:white;
    border-radius:8px;
    outline:none;
}

select:focus{
    border-color:#38bdf8;
}

textarea{
    width:100%;
    min-height:125px;
    resize:vertical;
    background:#0f172a;
    border:1px solid #475569;
    border-radius:9px;
    color:white;
    padding:12px;
    outline:none;
    font-size:14px;
}

textarea:focus{
    border-color:#38bdf8;
}

.attachments{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

.attach-btn{
    background:#0f172a;
    color:#cbd5e1;
    border:1px solid #475569;
    padding:11px 5px;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
    font-size:13px;
}

.attach-btn:hover{
    border-color:#38bdf8;
    color:#38bdf8;
}

input[type=file]{
    display:none;
}

.preview{
    margin-top:10px;
    display:none;
    background:#0f172a;
    border:1px solid #334155;
    padding:10px;
    border-radius:8px;
}

.preview img{
    max-width:100%;
    max-height:220px;
    border-radius:7px;
}

.file-name{
    color:#cbd5e1;
    font-size:13px;
    word-break:break-word;
}

.submit-btn{
    width:100%;
    border:none;
    background:linear-gradient(135deg,#38bdf8,#0284c7);
    color:#06121f;
    padding:12px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
    margin-top:12px;
    font-size:15px;
}

.submit-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.question-toolbar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:12px;
}

.filter-btn{
    flex-shrink:0;
    background:#0f172a;
    border:1px solid #475569;
    color:#cbd5e1;
    padding:8px 13px;
    border-radius:20px;
    cursor:pointer;
    font-size:12px;
}

.filter-btn.active{
    background:#0284c7;
    color:white;
    border-color:#38bdf8;
}

.question-card{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:11px;
    padding:13px;
    margin-bottom:10px;
}

.question-head{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.student-name{
    color:#38bdf8;
    font-weight:700;
    font-size:13px;
}

.question-date{
    color:#64748b;
    font-size:10px;
}

.question-meta{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin:7px 0;
}

.tag{
    background:#1e293b;
    border:1px solid #334155;
    color:#94a3b8;
    padding:3px 7px;
    border-radius:5px;
    font-size:10px;
}

.question-text{
    color:#e2e8f0;
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
    margin-top:8px;
}

.question-image{
    max-width:100%;
    max-height:400px;
    border-radius:8px;
    margin-top:10px;
    display:block;
}

.pdf-link{
    display:inline-block;
    margin-top:10px;
    padding:8px 11px;
    background:#7c3aed;
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-size:12px;
}

.answer-box{
    background:#172554;
    border:1px solid #1d4ed8;
    border-radius:9px;
    padding:11px;
    margin-top:12px;
}

.answer-title{
    color:#60a5fa;
    font-weight:bold;
    font-size:13px;
}

.answer-text{
    color:#e2e8f0;
    font-size:13px;
    line-height:1.65;
    white-space:pre-wrap;
    margin-top:5px;
}

.voice-player{
    width:100%;
    margin-top:8px;
}

.action-row{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.action-btn{
    flex:1;
    padding:8px;
    border-radius:7px;
    border:1px solid #475569;
    background:#1e293b;
    color:#cbd5e1;
    cursor:pointer;
    font-size:12px;
}

.action-btn:hover{
    border-color:#38bdf8;
}

.action-btn.delete-btn{
    color:#f43f5e;
    border-color:#f43f5e;
}

.action-btn.delete-btn:hover{
    background:#881337;
    color:white;
}

.bookmarked{
    color:#facc15!important;
    border-color:#eab308!important;
}

.followup-box{
    margin-top:10px;
    display:none;
}

.followup-box textarea{
    min-height:80px;
}

.followup-submit{
    width:100%;
    background:#0284c7;
    color:white;
    border:none;
    padding:8px;
    border-radius:7px;
    margin-top:6px;
    cursor:pointer;
}

.reply{
    background:#1e293b;
    border-left:3px solid #38bdf8;
    padding:9px;
    margin-top:8px;
    border-radius:5px;
}

.reply.teacher-reply{
    border-left-color: #22c55e;
    background: #064e3b22;
}

.reply-author{
    color:#38bdf8;
    font-size:11px;
    font-weight:bold;
}

.reply.teacher-reply .reply-author{
    color:#4ade80;
}

.reply-text{
    color:#cbd5e1;
    font-size:12px;
    white-space:pre-wrap;
    line-height:1.6;
    margin-top:3px;
}

.empty{
    text-align:center;
    color:#64748b;
    padding:30px 10px;
    font-size:13px;
}

.loading{
    text-align:center;
    color:#38bdf8;
    padding:20px;
}

.notification-panel{
    position:fixed;
    top:65px;
    right:10px;
    width:min(380px,calc(100% - 20px));
    max-height:75vh;
    overflow-y:auto;
    background:#1e293b;
    border:1px solid #475569;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
    z-index:2000;
    display:none;
}

.notification-panel.show{
    display:block;
}

.notification-header{
    padding:12px;
    border-bottom:1px solid #334155;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.notification-item{
    padding:11px;
    border-bottom:1px solid #334155;
    cursor:pointer;
}

.notification-item:hover{
    background:#253346;
}

.notification-item.unread{
    border-left:3px solid #38bdf8;
}

.notification-item-title{
    color:#f8fafc;
    font-size:13px;
    font-weight:bold;
}

.notification-item-text{
    color:#94a3b8;
    font-size:11px;
    margin-top:3px;
}

.notification-delete{
    float:right;
    border:none;
    background:none;
    color:#f43f5e;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:5000;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-content{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow-y:auto;
    background:#1e293b;
    border:1px solid #475569;
    border-radius:13px;
    padding:16px;
}

.modal-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #334155;
    padding-bottom:10px;
    margin-bottom:12px;
}

.modal-title h3{
    color:#38bdf8;
    font-size:17px;
}

.close{
    background:none;
    border:none;
    color:#94a3b8;
    font-size:24px;
    cursor:pointer;
}

.status{
    display:inline-block;
    padding:3px 8px;
    border-radius:15px;
    font-size:10px;
    background:#854d0e;
    color:#fef08a;
}

.status.answered{
    background:#065f46;
    color:#a7f3d0;
}

@media(max-width:700px){
    .filters{
        grid-template-columns:1fr;
    }

    .attachments{
        grid-template-columns:1fr 1fr 1fr;
    }

    .top-title h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">GAIVEX<span>.</span></a>
    <div class="header-right">
        <button class="icon-btn" onclick="window.toggleNotifications()" title="Notifications">
            🔔
            <span id="notificationCount" class="notification-count">0</span>
        </button>
    </div>
</header>

<div id="notificationPanel" class="notification-panel">
    <div class="notification-header">
        <strong>🔔 নোটিফিকেশন</strong>
        <button onclick="window.markAllNotificationsRead()" style="background:none;border:none;color:#38bdf8;cursor:pointer;font-size:11px;">
            সব পড়া হয়েছে
        </button>
    </div>
    <div id="notificationList">
        <div class="empty">নোটিফিকেশন লোড হচ্ছে...</div>
    </div>
</div>

<main class="container">
    <div class="top-title">
        <h1>❓ GAIVEX Q&A</h1>
        <p>প্রশ্ন করুন • টিচারের উত্তর পান • গুরুত্বপূর্ণ প্রশ্ন সংরক্ষণ করুন</p>
    </div>

    <!-- ASK QUESTION -->
    <section class="card">
        <div class="card-title">✍️ নতুন প্রশ্ন করুন</div>

        <div class="filters">
            <select id="questionSubject" onchange="window.updateQuestionPapers()">
                <option value="">বিষয় নির্বাচন করুন</option>
                <option value="physics">পদার্থবিজ্ঞান</option>
                <option value="chemistry">রসায়ন</option>
                <option value="biology">জীববিজ্ঞান</option>
                <option value="math">উচ্চতর গণিত</option>
            </select>

            <select id="questionPaper" onchange="window.updateQuestionChapters()">
                <option value="">পত্র নির্বাচন করুন</option>
                <option value="paper1">১ম পত্র</option>
                <option value="paper2">২য় পত্র</option>
            </select>

            <select id="questionChapter">
                <option value="">অধ্যায় নির্বাচন করুন</option>
            </select>
        </div>

        <textarea
            id="questionText"
            placeholder="আপনার প্রশ্নটি এখানে লিখুন..."
            style="margin-top:10px;"
        ></textarea>

        <div class="attachments">
            <label class="attach-btn">
                📷 Camera
                <input
                    type="file"
                    id="cameraInput"
                    accept="image/*"
                    capture="environment"
                    onchange="window.handleImage(event)"
                >
            </label>

            <label class="attach-btn">
                🖼️ ছবি
                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    onchange="window.handleImage(event)"
                >
            </label>

            <label class="attach-btn">
                📄 PDF
                <input
                    type="file"
                    id="pdfInput"
                    accept="application/pdf"
                    onchange="window.handlePDF(event)"
                >
            </label>
        </div>

        <div id="attachmentPreview" class="preview"></div>

        <button id="submitQuestionBtn" class="submit-btn" onclick="window.submitQuestion()">
            🚀 প্রশ্ন প্রকাশ করুন
        </button>
    </section>

    <!-- QUESTION LIST -->
    <section class="card">
        <div class="card-title">📚 শিক্ষার্থীদের প্রশ্ন ও উত্তর</div>

        <div class="question-toolbar">
            <button class="filter-btn active" id="allFilter" onclick="window.setQuestionFilter('all')">
                🌐 All Questions
            </button>
            <button class="filter-btn" id="myFilter" onclick="window.setQuestionFilter('my')">
                👤 My Questions
            </button>
            <button class="filter-btn" id="bookmarkFilter" onclick="window.setQuestionFilter('bookmark')">
                ⭐ Bookmarks
            </button>
        </div>

        <div class="filters" style="margin-bottom:10px;">
            <select id="viewSubject" onchange="window.updateViewPapers()">
                <option value="">সব বিষয়</option>
                <option value="physics">পদার্থবিজ্ঞান</option>
                <option value="chemistry">রসায়ন</option>
                <option value="biology">জীববিজ্ঞান</option>
                <option value="math">উচ্চতর গণিত</option>
            </select>

            <select id="viewPaper" onchange="window.updateViewChapters()">
                <option value="">সব পত্র</option>
                <option value="paper1">১ম পত্র</option>
                <option value="paper2">২য় পত্র</option>
            </select>

            <select id="viewChapter" onchange="window.renderQuestions()">
                <option value="">সব অধ্যায়</option>
            </select>
        </div>

        <div id="questionList">
            <div class="loading">প্রশ্ন লোড হচ্ছে...</div>
        </div>
    </section>
</main>

<!-- QUESTION VIEW MODAL -->
<div id="questionModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">
            <h3>📖 প্রশ্ন ও উত্তর</h3>
            <button class="close" onclick="window.closeQuestionModal()">×</button>
        </div>
        <div id="questionModalBody"></div>
    </div>
</div>

function escapeHTML(value){
    if(value === undefined || value === null) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ===============================
   ATTACHMENTS (IMAGE / PDF)
================================ */
window.handleImage = function(event){
    const file = event.target.files[0];
    if(!file) return;
    if(file.size > 2 * 1024 * 1024){
        alert("ছবির size সর্বোচ্চ 2MB হতে হবে।");
        event.target.value = "";
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e){
        selectedAttachment = {
            type: file.type,
            name: file.name,
            data: e.target.result
        };
        const preview = document.getElementById("attachmentPreview");
        preview.style.display = "block";
        preview.innerHTML = `
            <div class="file-name">🖼️ ${escapeHTML(file.name)}</div>
            <img src="${e.target.result}">
            <button onclick="window.removeAttachment()" style="margin-top:8px;background:#ef4444;color:white;border:0;padding:6px 10px;border-radius:5px;cursor:pointer;">Remove</button>
        `;
    };
    reader.readAsDataURL(file);
};

window.handlePDF = function(event){
    const file = event.target.files[0];
    if(!file) return;
    if(file.size > 3 * 1024 * 1024){
        alert("PDF-এর size সর্বোচ্চ 3MB হতে হবে।");
        event.target.value = "";
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e){
        selectedAttachment = {
            type: "application/pdf",
            name: file.name,
            data: e.target.result
        };
        const preview = document.getElementById("attachmentPreview");
        preview.style.display = "block";
        preview.innerHTML = `
            <div class="file-name">📄 ${escapeHTML(file.name)}</div>
            <button onclick="window.removeAttachment()" style="margin-top:8px;background:#ef4444;color:white;border:0;padding:6px 10px;border-radius:5px;cursor:pointer;">Remove</button>
        `;
    };
    reader.readAsDataURL(file);
};

window.submitQuestion = async function(){
    if(!currentUser){
        alert("আগে লগইন করুন।");
        return;
    }

    const subject = document.getElementById("questionSubject").value;
    const paper = document.getElementById("questionPaper").value;
    const chapter = document.getElementById("questionChapter").value;
    const text = document.getElementById("questionText").value.trim();

    if(!subject || !paper || !chapter){
        alert("বিষয়, পত্র এবং অধ্যায় নির্বাচন করুন।");
        return;
    }

    if(!text && !selectedAttachment){
        alert("প্রশ্ন লিখুন অথবা ছবি/PDF সংযুক্ত করুন।");
        return;
    }

    const btn = document.getElementById("submitQuestionBtn");
    btn.disabled = true;
    btn.innerText = "⏳ প্রশ্ন প্রকাশ হচ্ছে...";

    try{
        const questionRef = push(ref(db, "qanda/questions"));
        const questionId = questionRef.key;

        const questionData = {
            questionId: questionId,
            studentUid: currentUser.uid,
            uid: currentUser.uid,
            studentName: currentUser.displayName || currentUser.email?.split("@")[0] || "Student",
            studentEmail: currentUser.email || "",
            subject: subject,
            paper: paper,
            chapter: chapter,
            questionText: text,
            text: text,
            fileType: selectedAttachment ? selectedAttachment.type : "",
            fileData: selectedAttachment ? selectedAttachment.data : "",
            attachment: selectedAttachment || null,
            status: "pending",
            createdAt: Date.now(),
            updatedAt: Date.now()
        };

        await set(questionRef, questionData);

        const notificationRef = push(ref(db, `notifications/${currentUser.uid}`));
        await set(notificationRef, {
            type: "question_submitted",
            title: "প্রশ্ন সফলভাবে প্রকাশ হয়েছে",
            message: `${chapter} অধ্যায়ে আপনার প্রশ্নটি Teacher Panel-এ পাঠানো হয়েছে।`,
            questionId: questionId,
            createdAt: Date.now(),
            read: false
        });

        document.getElementById("questionText").value = "";
        window.removeAttachment();
        document.getElementById("questionSubject").value = "";
        document.getElementById("questionPaper").value = "";
        document.getElementById("questionChapter").innerHTML = `<option value="">অধ্যায় নির্বাচন করুন</option>`;

        alert("✅ আপনার প্রশ্ন সফলভাবে প্রকাশ হয়েছে।");

    }catch(error){
        console.error(error);
        alert("প্রশ্ন প্রকাশ করতে সমস্যা হয়েছে:\n" + error.message);
    }finally{
        btn.disabled = false;
        btn.innerText = "🚀 প্রশ্ন প্রকাশ করুন";
    }
};

================================ */
window.deleteQuestion = async function(questionId){
    if(!currentUser){
        alert("আগে লগইন করুন।");
        return;
    }

    const question = allQuestions[questionId];
    if(!question){
        alert("প্রশ্নটি পাওয়া যায়নি।");
        return;
    }

    const studentUid = question.studentUid || question.uid;
    if(studentUid !== currentUser.uid){
        alert("আপনি শুধুমাত্র নিজের তৈরি করা প্রশ্ন মুছে ফেলতে পারবেন।");
        return;
    }

    if(!confirm("আপনি কি নিশ্চিত যে এই প্রশ্নটি মুছে ফেলতে চান? এটি পুনরুদ্ধার করা যাবে না।")){
        return;
    }

    try{
        await remove(ref(db, `qanda/questions/${questionId}`));
        await remove(ref(db, `qanda_replies/${questionId}`));
        await remove(ref(db, `qanda_bookmarks/${currentUser.uid}/${questionId}`));

        const modal = document.getElementById("questionModal");
        if(modal && modal.style.display === "flex"){
            window.closeQuestionModal();
        }

        alert("🗑️ আপনার প্রশ্নটি সফলভাবে মুছে ফেলা হয়েছে।");
    }catch(error){
        console.error("Delete Error:", error);
        alert("প্রশ্নটি মুছে ফেলতে সমস্যা হয়েছে: " + error.message);
    }
};

   LOAD QUESTIONS
================================ */
function loadQuestions(){
    const qRef = ref(db, "qanda/questions");
    onValue(qRef, (snapshot) => {
        const val = snapshot.val() || {};
        allQuestions = {};
        
        Object.keys(val).forEach(key => {
            allQuestions[key] = {
                ...val[key],
                questionId: val[key].questionId || key
            };
        });

        window.renderQuestions();
        
        // Modal খোলা থাকলে তা রিয়েলটাইমে রি-রেন্ডার করবে
        if(activeModalQuestionId && allQuestions[activeModalQuestionId]){
            loadReplies(activeModalQuestionId);
        }
    }, (error) => {
        console.error(error);
        document.getElementById("questionList").innerHTML = `<div class="empty">প্রশ্ন লোড করতে সমস্যা হয়েছে।</div>`;
    });
}

async function isBookmarked(questionId){
    if(!currentUser || !questionId) return false;
    const snap = await get(ref(db, `qanda_bookmarks/${currentUser.uid}/${questionId}`));
    return snap.exists();
}

window.renderQuestions = async function(){
    const container = document.getElementById("questionList");
    let questions = Object.values(allQuestions || {});

    const subject = document.getElementById("viewSubject").value;
    const paper = document.getElementById("viewPaper").value;
    const chapter = document.getElementById("viewChapter").value;

    if(subject) questions = questions.filter(q => q.subject === subject);
    if(paper) questions = questions.filter(q => q.paper === paper);
    if(chapter) questions = questions.filter(q => q.chapter === chapter);

    if(currentFilter === "my"){
        questions = questions.filter(q => (q.studentUid || q.uid) === currentUser?.uid);
    }

    if(currentFilter === "bookmark"){
        if(!currentUser){
            container.innerHTML = `<div class="empty">লগইন করুন।</div>`;
            return;
        }
        const bookmarkSnap = await get(ref(db, `qanda_bookmarks/${currentUser.uid}`));
        const bookmarks = bookmarkSnap.exists() ? bookmarkSnap.val() : {};
        questions = questions.filter(q => bookmarks[q.questionId || q.key]);
    }

    questions.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

    if(questions.length === 0){
        container.innerHTML = `<div class="empty">কোনো প্রশ্ন পাওয়া যায়নি।</div>`;
        return;
    }

    container.innerHTML = "";
    for(const q of questions){
        const qId = q.questionId || q.key;
        const card = document.createElement("div");
        card.className = "question-card";
        const bookmarked = await isBookmarked(qId);
        card.innerHTML = createQuestionHTML(q, bookmarked);
        container.appendChild(card);
    }

    // KaTeX এর সাহায্যে সব ফর্মুলা এবং গাণিতিক কোড রেন্ডার করা
    if (typeof renderMathInElement === "function") {
        renderMathInElement(container, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError : false
        });
    }
};

function createQuestionHTML(q, bookmarked){
    const qId = q.questionId || q.key;
    const date = q.createdAt ? new Date(q.createdAt).toLocaleString("bn-BD") : "";

    let attachment = "";
    const fData = q.fileData || q.attachment?.data;
    const fType = q.fileType || q.attachment?.type || "";

    if(fData){
        if(fType.startsWith("image/")){
            attachment = `<img src="${fData}" class="question-image" alt="Question image">`;
        } else if(fType === "application/pdf"){
            attachment = `<a href="${fData}" download="file.pdf" target="_blank" class="pdf-link">📄 PDF ফাইল দেখুন/ডাউনলোড করুন</a>`;
        }
    }

    const isAnswered = q.status === "answered";

    const status = isAnswered
        ? `<span class="status answered">✓ উত্তর দেওয়া হয়েছে</span>`
        : `<span class="status">⏳ উত্তর অপেক্ষমাণ</span>`;

    // শিক্ষক প্যানেলের উত্তরগুলো প্রসেস করার উন্নত লজিক
    let ansText = q.answerText || "";
    let ansVoice = q.answerVoiceData || q.answerVoice || "";
    let ansImg = q.answerImageData || "";
    let ansPdf = q.answerPdfData || "";

    if (!ansText && q.answers) {
        const answersList = Object.values(q.answers);
        if (answersList.length > 0) {
            const lastAns = answersList[answersList.length - 1];
            ansText = lastAns.answerText || lastAns.text || "";
            ansVoice = lastAns.voiceData || lastAns.audioUrl || ansVoice;
            ansImg = lastAns.imageData || ansImg;
            ansPdf = lastAns.pdfData || ansPdf;
        }
    }

    let answerHtml = "";
    if(isAnswered || ansText || ansVoice || ansImg || ansPdf){
        answerHtml = `
            <div class="answer-box">
                <div class="answer-title">👨‍🏫 শিক্ষকের উত্তর:</div>
                ${ansText ? `<div class="answer-text">${escapeHTML(ansText)}</div>` : ''}
                ${ansImg ? `<img src="${ansImg}" class="question-image">` : ''}
                ${ansPdf ? `<a href="${ansPdf}" target="_blank" class="pdf-link">📄 উত্তরের PDF দেখুন</a>` : ''}
                ${ansVoice ? `<audio controls class="voice-player" src="${ansVoice}"></audio>` : ''}
            </div>
        `;
    }

    const isOwner = currentUser && (q.studentUid === currentUser.uid || q.uid === currentUser.uid);

    return `
        <div class="question-head">
            <div>
                <div class="student-name">👤 ${escapeHTML(q.studentName || "Student")}</div>
                <div class="question-date">${date}</div>
            </div>
            ${status}
        </div>

        <div class="question-meta">
            <span class="tag">${getSubjectName(q.subject)}</span>
            <span class="tag">${q.paper === "paper1" ? "১ম পত্র" : (q.paper === "paper2" ? "২য় পত্র" : q.paper)}</span>
            <span class="tag">${escapeHTML(q.chapter || "")}</span>
        </div>

        ${(q.questionText || q.text) ? `<div class="question-text">${escapeHTML(q.questionText || q.text)}</div>` : ""}

        ${attachment}

        ${answerHtml}

        <div class="action-row">
            <button class="action-btn ${bookmarked ? "bookmarked" : ""}" onclick="window.toggleBookmark('${qId}')">
                ${bookmarked ? "⭐ Bookmarked" : "☆ Bookmark"}
            </button>
            <button class="action-btn" onclick="window.openQuestion('${qId}')">
                👁️ বিস্তারিত
            </button>
            ${isOwner ? `
            <button class="action-btn delete-btn" onclick="window.deleteQuestion('${qId}')" title="প্রশ্নটি মুছে ফেলুন">
                🗑️ Delete
            </button>
            ` : ''}
        </div>
    `;
}

/* ===============================
   MODAL & REPLIES
================================ */
window.openQuestion = async function(questionId){
    const q = allQuestions[questionId];
    if(!q) return;

    activeModalQuestionId = questionId;

    const body = document.getElementById("questionModalBody");
    body.innerHTML = createQuestionHTML(q, await isBookmarked(questionId)) +
    `
    <div style="margin-top:15px;">
        <div style="color:#38bdf8;font-weight:bold;margin-bottom:7px;">
            💬 অন্যান্য আলোচনা / Follow-up
        </div>
        <div id="replyList">
            <div class="loading">লোড হচ্ছে...</div>
        </div>
    </div>
    `;

    document.getElementById("questionModal").style.display = "flex";
    await loadReplies(questionId);
};

async function loadReplies(questionId){
    const box = document.getElementById("replyList");
    if(!box) return;

    try{
        const q = allQuestions[questionId];
        let repliesArr = [];

        // ১. মূল প্রশ্নের `followups` নোডের ডাটা রিসিভ
        if(q && q.followups){
            const fVals = Object.values(q.followups);
            repliesArr = repliesArr.concat(fVals);
        }

        // ২. পুরোনো qanda_replies নোডের ডাটা সাপোর্ট (যদি থাকে)
        const snap = await get(ref(db, `qanda_replies/${questionId}`));
        if(snap.exists()){
            const oldReplies = Object.values(snap.val());
            repliesArr = repliesArr.concat(oldReplies);
        }

        let html = "";
        if(repliesArr.length > 0){
            // সময় অনুযায়ী সাজানো
            repliesArr.sort((a,b) => (a.createdAt || a.timestamp || 0) - (b.createdAt || b.timestamp || 0));

            repliesArr.forEach(r => {
                const isTeacher = r.role === "teacher" || r.sender === "teacher";
                const authorName = isTeacher ? "👨‍🏫 Teacher" : `👤 ${escapeHTML(r.studentName || "Student")}`;
                const textMsg = r.text || r.message || r.questionText || "";

                html += `
                    <div class="reply ${isTeacher ? "teacher-reply" : ""}">
                        <div class="reply-author">${authorName}</div>
                        ${textMsg ? `<div class="reply-text">${escapeHTML(textMsg)}</div>` : ""}
                        ${r.attachment?.type === "image" ? `<img src="${r.attachment.data}" class="question-image">` : ""}
                        ${r.attachment?.type === "pdf" ? `<a href="${r.attachment.data}" target="_blank" class="pdf-link">📄 PDF</a>` : ""}
                        ${(r.audioUrl || r.attachment?.type === "audio") ? `<audio controls class="voice-player" src="${r.audioUrl || r.attachment.data}"></audio>` : ""}
                    </div>
                `;
            });
        } else {
            html = `<div class="empty">কোনো ফলো-আপ বার্তা নেই।</div>`;
        }

        const studentUid = q?.studentUid || q?.uid;

        if(currentUser && studentUid === currentUser.uid){
            html += `
                <div class="followup-box" style="display:block;margin-top:12px;">
                    <textarea id="followupText" placeholder="উত্তর বুঝতে সমস্যা হলে আবার প্রশ্ন করুন..."></textarea>
                    <button class="followup-submit" onclick="window.submitFollowup('${questionId}')">
                        🔄 আবার প্রশ্ন করুন
                    </button>
                </div>
            `;
        }

        box.innerHTML = html;

        // KaTeX Render in modal reply list
        if (typeof renderMathInElement === "function") {
            renderMathInElement(box, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError : false
            });
        }
    }catch(e){
        console.error("Replies error:", e);
        box.innerHTML = `<div class="empty">উত্তর লোড করা যায়নি।</div>`;
    }
}

window.submitFollowup = async function(questionId){
    if(!currentUser){
        alert("আগে লগইন করুন।");
        return;
    }

    const question = allQuestions[questionId];
    const studentUid = question?.studentUid || question?.uid;

    if(!question || studentUid !== currentUser.uid){
        alert("শুধু নিজের প্রশ্নে follow-up করতে পারবেন।");
        return;
    }

    const text = document.getElementById("followupText")?.value.trim();
    if(!text){
        alert("আপনার প্রশ্নটি লিখুন।");
        return;
    }

    // Teacher Panel এর সাথে মিল রেখে সরাসরি `qanda/questions/${questionId}/followups` পাথে সাবমিট
    const followupRef = push(ref(db, `qanda/questions/${questionId}/followups`));
    const followupData = {
        id: followupRef.key,
        studentUid: currentUser.uid,
        studentName: currentUser.displayName || currentUser.email?.split("@")[0] || "Student",
        sender: "student",
        role: "student",
        text: text,
        message: text,
        questionText: text,
        createdAt: Date.now(),
        timestamp: Date.now()
    };

    await set(followupRef, followupData);

    // প্রশ্ন স্টেট আপডেট
    await update(ref(db, `qanda/questions/${questionId}`), {
        status: "pending",
        updatedAt: Date.now()
    });

    await createTeacherNotification(questionId, "Student আবার Follow-up প্রশ্ন করেছে");

    alert("আপনার Follow-up প্রশ্ন পাঠানো হয়েছে।");
    await loadReplies(questionId);
};

async function createTeacherNotification(questionId, message){
    const q = allQuestions[questionId];
    if(!q) return;

    const notificationRef = push(ref(db, "teacher_notifications"));
    await set(notificationRef, {
        type: "qanda",
        questionId: questionId,
        studentUid: q.studentUid || q.uid,
        studentName: q.studentName,
        title: "Q&A নতুন প্রশ্ন",
        message: message,
        createdAt: Date.now(),
        read: false
    });
}

window.toggleBookmark = async function(questionId){
    if(!currentUser){
        alert("Bookmark করতে লগইন করুন।");
        return;
    }

    const bookmarkRef = ref(db, `qanda_bookmarks/${currentUser.uid}/${questionId}`);
    const snap = await get(bookmarkRef);

    if(snap.exists()){
        await remove(bookmarkRef);
    }else{
        await set(bookmarkRef, {
            questionId: questionId,
            createdAt: Date.now()
        });
    }

    window.renderQuestions();
};

/* ===============================
   NOTIFICATIONS
================================ */
function loadNotifications(){
    if(!currentUser) return;
    const nRef = ref(db, `notifications/${currentUser.uid}`);
    onValue(nRef, (snap) => {
        const list = document.getElementById("notificationList");

        if(!snap.exists()){
            list.innerHTML = `<div class="empty">কোনো নোটিফিকেশন নেই।</div>`;
            updateNotificationCount(0);
            return;
        }

        const data = snap.val();
        const notifications = Object.entries(data)
            .map(([id, item]) => ({ id, ...item }))
            .sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

        let unread = 0;
        let html = "";

        notifications.forEach(n => {
            if(!n.read) unread++;
            html += `
                <div class="notification-item ${n.read ? "" : "unread"}" onclick="window.openNotification('${n.id}')">
                    <button class="notification-delete" onclick="window.deleteNotification(event,'${n.id}')">×</button>
                    <div class="notification-item-title">${escapeHTML(n.title || "Notification")}</div>
                    <div class="notification-item-text">${escapeHTML(n.message || "")}</div>
                </div>
            `;
        });

        list.innerHTML = html;
        updateNotificationCount(unread);
    });
}

function updateNotificationCount(count){
    const badge = document.getElementById("notificationCount");
    if(count > 0){
        badge.style.display = "flex";
        badge.textContent = count > 99 ? "99+" : count;
    }else{
        badge.style.display = "none";
    }
}

window.toggleNotifications = function(){
    document.getElementById("notificationPanel").classList.toggle("show");
};

window.openNotification = async function(id){
    const snap = await get(ref(db, `notifications/${currentUser.uid}/${id}`));
    if(!snap.exists()) return;

    const n = snap.val();
    await update(ref(db, `notifications/${currentUser.uid}/${id}`), { read: true });

    document.getElementById("notificationPanel").classList.remove("show");

    if(n.questionId){
        if(allQuestions[n.questionId]){
            window.openQuestion(n.questionId);
        }
    }else{
        alert(n.message || "নোটিফিকেশন");
    }
};

window.deleteNotification = async function(event, id){
    event.stopPropagation();
    if(!currentUser) return;
    if(!confirm("এই নোটিফিকেশনটি মুছে ফেলবেন?")) return;

    await remove(ref(db, `notifications/${currentUser.uid}/${id}`));
};

window.markAllNotificationsRead = async function(){
    if(!currentUser) return;
    const snap = await get(ref(db, `notifications/${currentUser.uid}`));
    if(!snap.exists()) return;

    const data = snap.val();
    const updates = {};
    Object.keys(data).forEach(id => {
        updates[`notifications/${currentUser.uid}/${id}/read`] = true;
    });

    await update(ref(db), updates);
};

window.closeQuestionModal = function(){
    document.getElementById("questionModal").style.display = "none";
    activeModalQuestionId = null;
};

document.addEventListener("click", function(e){
    const panel = document.getElementById("notificationPanel");
    const btn = e.target.closest(".icon-btn");
    if(panel && !panel.contains(e.target) && !btn){
        panel.classList.remove("show");
    }
});
</script>

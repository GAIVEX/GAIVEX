<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX - Q&A Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 4%; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .logo span { color: #f43f5e; }
        .container { max-width: 800px; margin: 20px auto; padding: 15px; width: 100%; flex: 1; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        select, textarea, input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 14px; margin-bottom: 12px; outline: none; }
        select:focus, textarea:focus { border-color: #38bdf8; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #7dd3fc; }
        .filter-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-tab { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .filter-tab.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .question-box { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .teacher-reply { background: #0f172a; border-left: 3px solid #10b981; padding: 10px; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">GAIVEX<span>.</span> Q&A</a>
        <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 14px;">🏠 হোম পেজ</a>
    </header>

    <div class="container">
        <!-- প্রশ্ন করার ফর্ম -->
        <div class="card">
            <h3 style="color: #38bdf8; margin-bottom: 12px;">✍️ নতুন প্রশ্ন করুন</h3>
            <form id="questionForm" onsubmit="submitQuestion(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <select id="qSubject" required onchange="updatePapers()">
                        <option value="">বিষয় বাছুন</option>
                        <option value="physics">পদার্থবিজ্ঞান</option>
                        <option value="chemistry">রসায়ন</option>
                        <option value="biology">জীববিজ্ঞান</option>
                        <option value="math">উচ্চতর গণিত</option>
                    </select>
                    <select id="qPaper" required onchange="updateChapters()">
                        <option value="">আগে বিষয় বাছুন</option>
                    </select>
                </div>
                <select id="qChapter" required>
                    <option value="">আগে পত্র বাছুন</option>
                </select>
                <textarea id="qText" rows="3" placeholder="আপনার সমস্যাটি বিস্তারিত লিখুন..." required></textarea>
                
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px;">
                    <label style="cursor: pointer; background: #334155; padding: 8px 12px; border-radius: 6px; font-size: 13px;">
                        📁 ছবি/ফাইল যুক্ত করুন <input type="file" id="qFile" accept="image/*,application/pdf" style="display: none;">
                    </label>
                    <label style="cursor: pointer; background: #0284c7; padding: 8px 12px; border-radius: 6px; font-size: 13px; color: white;">
                        📷 ক্যামেরা দিয়ে ছবি তুলুন <input type="file" id="qCamera" accept="image/*" capture="environment" style="display: none;">
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">প্রশ্ন জমা দিন</button>
            </form>
        </div>

        <!-- ফিল্টার ট্যাব -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="setFilter('all', this)">সব প্রশ্ন</button>
            <button class="filter-tab" onclick="setFilter('my', this)">আমার প্রশ্ন</button>
            <button class="filter-tab" onclick="setFilter('bookmark', this)">বুকমার্কড</button>
        </div>

        <!-- প্রশ্ন লিস্ট -->
        <div id="questionsContainer">
            <p style="text-align: center; color: #94a3b8;">প্রশ্ন লোড হচ্ছে...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, get, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
            authDomain: "gaivexexam.firebaseapp.com",
            databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
            projectId: "gaivexexam"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        let currentUser = null;
        let currentFilter = 'all';
        let allQuestionsData = {};
        let bookmarks = JSON.parse(localStorage.getItem('gaivex_bookmarks') || '[]');

        const chaptersData = {
            physics: { paper1: ["অধ্যায় ১: ভৌতজগৎ ও পরিমাপ", "অধ্যায় ২: ভেক্টর", "অধ্যায় ৩: গতিবিদ্যা", "অধ্যায় ৪: নিউটনীয় বলবিজ্ঞান", "অধ্যায় ৫: কাজ, শক্তি ও ক্ষমতা"], paper2: ["অধ্যায় ১: তাপগতিবিদ্যা", "অধ্যায় ২: স্থির তড়িৎ", "অধ্যায় ৩: চল তড়িৎ"] },
            chemistry: { paper1: ["অধ্যায় ১: ল্যাবরেটরি নিরাপদ ব্যবহার", "অধ্যায় ২: গুণগত রসায়ন"], paper2: ["অধ্যায় ১: পরিবেশ রসায়ন", "অধ্যায় ২: জৈব রসায়ন"] },
            biology: { paper1: ["অধ্যায় ১: কোষ ও এর গঠন", "অধ্যায় ২: কোষ বিভাজন"], paper2: ["অধ্যায় ১: প্রাণীর বিভিন্নতা ও শ্রেণিবিন্যাস"] },
            math: { paper1: ["অধ্যায় ১: ম্যাট্রিক্স ও নির্ণায়ক", "অধ্যায় ২: ভেক্টর"], paper2: ["অধ্যায় ১: বাস্তব সংখ্যা ও অসমতা"] }
        };

        window.updatePapers = () => {
            const sub = document.getElementById('qSubject').value;
            const paperSelect = document.getElementById('qPaper');
            paperSelect.innerHTML = '<option value="">পত্র বাছুন</option><option value="paper1">১ম পত্র</option><option value="paper2">২য় পত্র</option>';
        }
        window.updateChapters = () => {
            const sub = document.getElementById('qSubject').value;
            const paper = document.getElementById('qPaper').value;
            const chapSelect = document.getElementById('qChapter');
            chapSelect.innerHTML = '<option value="">অধ্যায় বাছুন</option>';
            if(sub && paper && chaptersData[sub][paper]) {
                chaptersData[sub][paper].forEach(c => chapSelect.innerHTML += `<option value="${c}">${c}</option>`);
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            loadQuestions();
        });

        window.submitQuestion = async (e) => {
            e.preventDefault();
            if(!currentUser) { alert("প্রশ্ন করতে হলে আগে লগইন করুন!"); return; }

            const fileInput = document.getElementById('qFile');
            const cameraInput = document.getElementById('qCamera');
            let fileUrl = "";

            // ছবি বা ফাইলের হ্যান্ডলিং (লোকাল স্টোরেজ বা বেসড অন রিড)
            const handleFileRead = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => resolve(uploadEvent.target.result);
                    reader.readAsDataURL(file);
                });
            };

            if (fileInput.files[0]) {
                fileUrl = await handleFileRead(fileInput.files[0]);
            } else if (cameraInput.files[0]) {
                fileUrl = await handleFileRead(cameraInput.files[0]);
            }

            const newQRef = push(ref(db, 'questions'));
            await set(newQRef, {
                id: newQRef.key,
                uid: currentUser.uid,
                userName: currentUser.displayName || currentUser.email,
                subject: document.getElementById('qSubject').value,
                paper: document.getElementById('qPaper').value,
                chapter: document.getElementById('qChapter').value,
                questionText: document.getElementById('qText').value,
                fileUrl: fileUrl,
                timestamp: Date.now(),
                status: 'pending'
            });

            alert("আপনার প্রশ্নটি সফলভাবে জমা হয়েছে!");
            document.getElementById('questionForm').reset();
            loadQuestions();
        }

        window.setFilter = (type, btn) => {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderQuestions();
        }

        window.toggleBookmark = (qId) => {
            if(bookmarks.includes(qId)) {
                bookmarks = bookmarks.filter(id => id !== qId);
            } else {
                bookmarks.push(qId);
            }
            localStorage.setItem('gaivex_bookmarks', JSON.stringify(bookmarks));
            renderQuestions();
        }

        async function loadQuestions() {
            const snapshot = await get(ref(db, 'questions'));
            if(snapshot.exists()) {
                allQuestionsData = snapshot.val();
                renderQuestions();
            } else {
                document.getElementById('questionsContainer').innerHTML = '<p style="text-align: center; color: #94a3b8;">কোনো প্রশ্ন পাওয়া যায়নি।</p>';
            }
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            const sorted = Object.values(allQuestionsData).sort((a, b) => b.timestamp - a.timestamp);

            sorted.forEach(q => {
                if(currentFilter === 'my' && (!currentUser || q.uid !== currentUser.uid)) return;
                if(currentFilter === 'bookmark' && !bookmarks.includes(q.id)) return;

                const isBookmarked = bookmarks.includes(q.id);
                let mediaHTML = q.fileUrl ? `<img src="${q.fileUrl}" style="max-width:100%; border-radius:6px; margin-top:8px; border:1px solid #334155;">` : '';
                
                let replyHTML = '';
                if(q.reply) {
                    let audioReply = q.reply.audioUrl ? `<audio controls src="${q.reply.audioUrl}" style="width:100%; margin-top:8px;"></audio>` : '';
                    let teacherFile = q.reply.fileUrl ? `<img src="${q.reply.fileUrl}" style="max-width:100%; border-radius:6px; margin-top:8px;">` : '';
                    replyHTML = `
                        <div class="teacher-reply">
                            <div style="font-size: 12px; color: #10b981; font-weight: bold; margin-bottom: 4px;">👨‍🏫 শিক্ষকের উত্তর:</div>
                            <p style="font-size: 13px; color: #f8fafc;">${q.reply.text}</p>
                            ${teacherFile}
                            ${audioReply}
                        </div>
                    `;
                }

                html += `
                    <div class="question-box">
                        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 6px;">
                            <span>👤 ${q.userName} (${q.subject} > ${q.chapter})</span>
                            <span style="cursor: pointer; color: ${isBookmarked ? '#f43f5e' : '#94a3b8'}" onclick="toggleBookmark('${q.id}')">🔖 ${isBookmarked ? 'বুকমার্কড' : 'বুকমার্ক'}</span>
                        </div>
                        <p style="font-size: 14px; margin-bottom: 8px;">${q.questionText}</p>
                        ${mediaHTML}
                        ${replyHTML}
                    </div>
                `;
            });

            container.innerHTML = html || '<p style="text-align: center; color: #94a3b8;">এই ক্যাটাগরিতে কোনো প্রশ্ন নেই।</p>';
        }
    </script>
</body>
</html>

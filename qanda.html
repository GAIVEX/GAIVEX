<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Section</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --border: #E5E7EB;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { opacity: 0.9; }
        .question-card {
            border-left: 4px solid var(--primary);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-answered { background: #D1FAE5; color: #059669; }
        .answer-box {
            margin-top: 15px;
            padding: 12px;
            background: #F9FAFB;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .preview-img { max-width: 100%; height: auto; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- প্রশ্ন জমা দেওয়ার ফরম -->
    <div class="card">
        <h2>প্রশ্ন করুন</h2>
        <form id="askForm">
            <div class="form-group">
                <label>বিষয়</label>
                <input type="text" id="subject" required placeholder="যেমন: পদার্থবিজ্ঞান">
            </div>
            <div class="form-group">
                <label>পত্র/অধ্যায়</label>
                <input type="text" id="chapter" required placeholder="যেমন: ১ম পত্র - অধ্যায় ২">
            </div>
            <div class="form-group">
                <label>আপনার প্রশ্ন</label>
                <textarea id="questionText" rows="4" required placeholder="আপনার প্রশ্নটি বিস্তারিত লিখুন..."></textarea>
            </div>
            <div class="form-group">
                <label>ছবি/ফাইল সংযুক্ত করুন (ঐচ্ছিক)</label>
                <input type="file" id="fileInput" accept="image/*,application/pdf">
            </div>
            <button type="submit" id="submitBtn">প্রশ্ন পাঠান</button>
        </form>
    </div>

    <!-- প্রশ্নের তালিকা -->
    <h2>আপনার ও অন্যান্য প্রশ্নসমূহ</h2>
    <div id="questionsContainer">লিংক হচ্ছে...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
        authDomain: "gaivexexam.firebaseapp.com",
        databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
        projectId: "gaivexexam",
        storageBucket: "gaivexexam.firebasestorage.app",
        messagingSenderId: "956204530190",
        appId: "1:956204530190:web:4e5550afefa3e314c99a5f",
        measurementId: "G-2YEMS07HEQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let selectedFileData = "";
    let selectedFileType = "";

    // ফাইল রিড করা
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            selectedFileType = file.type;
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedFileData = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            loadQuestions();
        } else {
            document.getElementById('questionsContainer').innerHTML = "<p>প্রশ্ন দেখতে বা করতে লগইন করুন।</p>";
        }
    });

    // প্রশ্ন পোস্ট করা
    document.getElementById('askForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return alert("লগইন করা নেই!");

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;

        const questionData = {
            studentUid: currentUser.uid,
            studentName: currentUser.displayName || currentUser.email.split('@')[0],
            studentEmail: currentUser.email,
            subject: document.getElementById('subject').value,
            chapter: document.getElementById('chapter').value,
            questionText: document.getElementById('questionText').value,
            fileType: selectedFileType,
            fileData: selectedFileData,
            status: "pending",
            createdAt: Date.now()
        };

        try {
            await push(ref(db, "qanda/questions"), questionData);
            alert("প্রশ্ন সফলভাবে পাঠানো হয়েছে!");
            document.getElementById('askForm').reset();
            selectedFileData = "";
            selectedFileType = "";
        } catch (err) {
            alert("ত্রুটি: " + err.message);
        } finally {
            submitBtn.disabled = false;
        }
    });

    // প্রশ্ন লোড করা
    function loadQuestions() {
        const qRef = ref(db, "qanda/questions");
        onValue(qRef, (snapshot) => {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = "";
            const data = snapshot.val();

            if (!data) {
                container.innerHTML = "<p>কোনো প্রশ্ন পাওয়া যায়নি।</p>";
                return;
            }

            Object.keys(data).reverse().forEach(key => {
                const q = data[key];
                const card = document.createElement('div');
                card.className = "card question-card";
                
                let mediaHtml = "";
                if (q.fileData) {
                    if (q.fileType.startsWith("image/")) {
                        mediaHtml = `<img src="${q.fileData}" class="preview-img" />`;
                    } else if (q.fileType === "application/pdf") {
                        mediaHtml = `<p><a href="${q.fileData}" download="file.pdf">📄 PDF ফাইলটি ডাউনলোড করুন</a></p>`;
                    }
                }

                let answerHtml = "";
                if (q.status === "answered") {
                    answerHtml = `
                        <div class="answer-box">
                            <h4><i class="fa-solid fa-circle-check" style="color: green;"></i> শিক্ষকের উত্তর:</h4>
                            ${q.answerText ? `<p>${q.answerText}</p>` : ''}
                            ${q.answerVoice ? `<audio controls src="${q.answerVoice}"></audio>` : ''}
                            <small>উত্তর প্রদানের সময়: ${new Date(q.answeredAt).toLocaleString('bn-BD')}</small>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>${q.studentName}</strong>
                        <span class="status-badge ${q.status === 'answered' ? 'status-answered' : 'status-pending'}">
                            ${q.status === 'answered' ? 'উত্তর দেওয়া হয়েছে' : 'অপেক্ষমাণ'}
                        </span>
                    </div>
                    <small>${q.subject} - ${q.chapter}</small>
                    <p style="margin-top:10px;">${q.questionText}</p>
                    ${mediaHtml}
                    ${answerHtml}
                `;
                container.appendChild(card);
            });
        });
    }
</script>
</body>
</html>

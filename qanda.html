<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX - Q&A Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 4%; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .logo span { color: #f43f5e; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; width: 95%; flex: 1; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2, h3 { color: #38bdf8; margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-top: 12px; margin-bottom: 5px; font-size: 14px; }
        select, textarea, input[type="file"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 14px; outline: none; margin-bottom: 10px; }
        select:focus, textarea:focus { border-color: #38bdf8; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #38bdf8; color: #0f172a; transition: 0.3s; width: 100%; }
        .btn:hover { background: #7dd3fc; }
        .question-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .answer-box { background: #1e293b; border-left: 4px solid #10b981; padding: 12px; margin-top: 10px; border-radius: 4px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #f59e0b; color: #000; }
        .badge-solved { background: #10b981; color: #fff; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">GAIVEX<span>.</span></a>
        <a href="index.html" style="color: #cbd5e1; text-decoration: none; font-size: 14px;">🏠 হোম পেজে ফিরুন</a>
    </header>

    <div class="container">
        <!-- প্রশ্ন করার ফর্ম -->
        <div class="card">
            <h2>❓ শিক্ষককে প্রশ্ন করুন (Q&A)</h2>
            <form id="questionForm" onsubmit="submitQuestion(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label>বিষয় বাছুন:</label>
                        <select id="qSubject" onchange="updatePaperOptions()" required>
                            <option value="">বিষয় বাছুন</option>
                            <option value="physics">পদার্থবিজ্ঞান</option>
                            <option value="chemistry">রসায়ন</option>
                            <option value="biology">জীববিজ্ঞান</option>
                            <option value="math">উচ্চতর গণিত</option>
                        </select>
                    </div>
                    <div>
                        <label>পত্র বাছুন:</label>
                        <select id="qPaper" onchange="updateChapterOptions()" required>
                            <option value="">আগে বিষয় বাছুন</option>
                        </select>
                    </div>
                </div>

                <label>অধ্যায় বাছুন:</label>
                <select id="qChapter" required>
                    <option value="">আগে বিষয় ও পত্র বাছুন</option>
                </select>

                <label>আপনার প্রশ্ন বা সমস্যা লিখুন:</label>
                <textarea id="qText" rows="4" placeholder="আপনার প্রশ্নটি বিস্তারিত লিখুন..."></textarea>

                <label>ছবি বা পিডিএফ যুক্ত করুন (ঐচ্ছিক):</label>
                <input type="file" id="qFile" accept="image/*,.pdf">

                <button type="submit" class="btn" id="submitBtn">প্রশ্ন সাবমিট করুন</button>
            </form>
        </div>

        <!-- স্টুডেন্টের নিজের করা প্রশ্ন ও উত্তরের তালিকা -->
        <div class="card">
            <h3>📜 আপনার প্রশ্ন ও উত্তরের ইতিহাস</h3>
            <div id="myQuestionsList">
                <p style="color: #94a3b8; text-align: center;">লগইন করার পর আপনার প্রশ্নগুলো এখানে দেখা যাবে।</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
            authDomain: "gaivexexam.firebaseapp.com",
            databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
            projectId: "gaivexexam",
            storageBucket: "gaivexexam.firebasestorage.app",
            messagingSenderId: "956204530190",
            appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        let currentUser = null;

        const chaptersData = {
            physics: {
                paper1: ["অধ্যায় ১: ভৌতজগৎ ও পরিমাপ", "অধ্যায় ২: ভেক্টর", "অধ্যায় ৩: গতিবিদ্যা", "অধ্যায় ৪: নিউটনীয় বলবিজ্ঞান", "অধ্যায় ৫: কাজ, শক্তি ও ক্ষমতা", "অধ্যায় ৬: মহাকর্ষ ও অভিকর্ষ", "অধ্যায় ৭: পদার্থের গাঠনিক ধর্ম", "অধ্যায় ৮: পর্যায়বৃত্ত গতি", "অধ্যায় ৯: তরঙ্গ", "অধ্যায় ১০: আদর্শ গ্যাস ও গ্যাসের গতিতত্ত্ব"],
                paper2: ["অধ্যায় ১: তাপগতিবিদ্যা", "অধ্যায় ২: স্থির তড়িৎ", "অধ্যায় ৩: চল তড়িৎ", "অধ্যায় ৪: তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চৌম্বকত্ব", "অধ্যায় ৫: তাড়িতচৌম্বকীয় আবেশ ও পরিবর্তী প্রবাহ", "অধ্যায় ৬: জ্যামিতিক আলোকবিজ্ঞান", "অধ্যায় ৭: ভৌত আলোকবিজ্ঞান", "অধ্যায় ৮: আধুনিক পদার্থবিজ্ঞানের সূচনা", "অধ্যায় ৯: পরমাণুর মডেল ও নিউক্লিয়ার পদার্থবিজ্ঞান", "অধ্যায় ১০: সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", "অধ্যায় ১১: জ্যোতির্বিজ্ঞান"]
            },
            chemistry: {
                paper1: ["অধ্যায় ১: ল্যাবরেটরি নিরাপদ ব্যবহার", "অধ্যায় ২: গুণগত রসায়ন", "অধ্যায় ৩: মৌলের পর্যায়বৃত্ত ধর্ম ও রাসায়নিক বন্ধন", "অধ্যায় ৪: রাসায়নিক পরিবর্তন", "অধ্যায় ৫: কর্মমুখী রসায়ন"],
                paper2: ["অধ্যায় ১: পরিবেশ রসায়ন", "অধ্যায় ২: জৈব রসায়ন", "অধ্যায় ৩: পরিমাণগত রসায়ন", "অধ্যায় ৪: তড়িৎ রসায়ন", "অধ্যায় ৫: অর্থনৈতিক রসায়ন"]
            },
            biology: {
                paper1: ["অধ্যায় ১: কোষ ও এর গঠন", "অধ্যায় ২: কোষ বিভাজন", "অধ্যায় ৩: কোষ রসায়ন", "অধ্যায় ৪: অণুজীব", "অধ্যায় ৫: শৈবাল ও ছত্রাক", "অধ্যায় ৬: ব্রায়োফাইটা ও টেরোডোফাইটা", "অধ্যায় ৭: নগ্নবীজী ও আবৃতবীজী উদ্ভিদ", "অধ্যায় ৮: টিস্যু ও টিস্যুতন্ত্র", "অধ্যায় ৯: উদ্ভিদ শারীরতত্ত্ব", "অধ্যায় ১০: উদ্ভিদ প্রজনন", "অধ্যায় ১১: জীবপ্রযুক্তি", "অধ্যায় ১২: জীবের পরিবেশ ও বিস্তার"],
                paper2: ["অধ্যায় ১: প্রাণীর বিভিন্নতা ও শ্রেণিবিন্যাস", "অধ্যায় ২: প্রাণীর পরিচিতি", "অধ্যায় ৩: মানব শারীরতত্ত্ব: পরিপাক ও শোষণ", "অধ্যায় ৪: মানব শারীরতত্ত্ব: রক্ত ও সংবহন", "অধ্যায় ৫: মানব শারীরতত্ত্ব: শ্বসন ও শ্বাসক্রিয়া", "অধ্যায় ৬: মানব শারীরতত্ত্ব: বর্জ্য ও নিষ্কাশন", "অধ্যায় ৭: মানব শারীরতত্ত্ব: চলন ও অঙ্গচালনা", "অধ্যায় ৮: মানব শারীরতত্ত্ব: সমন্বয় ও নিয়ন্ত্রণ", "অধ্যায় ৯: মানব জীবনের ধারাবাহিকতা", "অধ্যায় ১০: মানবদেহের প্রতিরক্ষা", "অধ্যায় ১১: জিনতত্ত্ব ও বিবর্তন", "অধ্যায় ১২: প্রাণীর আচরণ"]
            },
            math: {
                paper1: ["অধ্যায় ১: ম্যাট্রিক্স ও নির্ণায়ক", "অধ্যায় ২: ভেক্টর", "অধ্যায় ৩: সরলরেখা", "অধ্যায় ৪: বৃত্ত", "অধ্যায় ৫: বিন্যাস ও সমাবেশ", "অধ্যায় ৬: ত্রিকোণমিতিক অনুপাত", "অধ্যায় ৭: সংযুক্ত কোণের ত্রিকোণমিতিক অনুপাত", "অধ্যায় ৮: ফাংশন ও ফাংশনের লেখচিত্র", "অধ্যায় ৯: অন্তরীকরণ (Differentiation)", "অধ্যায় ১০: যোগজীকরণ (Integration)"],
                paper2: ["অধ্যায় ১: বাস্তব সংখ্যা ও অসমতা", "অধ্যায় ২: রৈখিক প্রোগ্রামন", "অধ্যায় ৩: জটিল সংখ্যা", "অধ্যায় ৪: বহুপদী ও বহুপদী সমীকরণ", "অধ্যায় ৫: দ্বিপদী বিস্তৃতি", "অধ্যায় ৬: কনিক", "অধ্যায় ৭: বিপরীত ত্রিকোণমিতিক ফাংশন ও ত্রিকোণমিতিক সমীকরণ", "অধ্যায় ৮: স্থিতিবিদ্যা", "অধ্যায় ৯: সমতলে বস্তুকণার গতি", "অধ্যায় ১০: সম্ভাবনা (Probability)"]
            }
        };

        window.updatePaperOptions = function() {
            const sub = document.getElementById('qSubject').value;
            const paperSelect = document.getElementById('qPaper');
            paperSelect.innerHTML = '<option value="">পত্র বাছুন</option><option value="paper1">১ম পত্র</option><option value="paper2">২য় পত্র</option>';
            document.getElementById('qChapter').innerHTML = '<option value="">আগে পত্র বাছুন</option>';
        };

        window.updateChapterOptions = function() {
            const sub = document.getElementById('qSubject').value;
            const paper = document.getElementById('qPaper').value;
            const chapSelect = document.getElementById('qChapter');
            chapSelect.innerHTML = '<option value="">অধ্যায় বাছুন</option>';
            if(sub && paper && chaptersData[sub][paper]) {
                chaptersData[sub][paper].forEach(chap => {
                    chapSelect.innerHTML += `<option value="${chap}">${chap}</option>`;
                });
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loadUserQuestions(user.uid);
            } else {
                document.getElementById('myQuestionsList').innerHTML = '<p style="color: #f43f5e; text-align: center;">প্রশ্ন করতে বা দেখতে অনুগ্রহ করে আগে লগইন করুন।</p>';
            }
        });

        window.submitQuestion = async function(e) {
            e.preventDefault();
            if(!currentUser) { alert("আগে লগইন করুন!"); return; }

            const subject = document.getElementById('qSubject').value;
            const paper = document.getElementById('qPaper').value;
            const chapter = document.getElementById('qChapter').value;
            const text = document.getElementById('qText').value;
            const fileInput = document.getElementById('qFile').files[0];

            if(!text && !fileInput) { alert("দয়া করে প্রশ্ন লিখুন অথবা ফাইল আপলোড করুন!"); return; }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "আপলোড হচ্ছে...";
            submitBtn.disabled = true;

            try {
                let fileUrl = "";
                let fileType = "";
                if(fileInput) {
                    const fRef = storageRef(storage, `qa_files/${Date.now()}_${fileInput.name}`);
                    const snapshot = await uploadBytes(fRef, fileInput);
                    fileUrl = await getDownloadURL(snapshot.ref);
                    fileType = fileInput.type.includes('pdf') ? 'pdf' : 'image';
                }

                const newQRef = push(ref(db, 'qa_questions'));
                await set(newQRef, {
                    id: newQRef.key,
                    uid: currentUser.uid,
                    studentName: currentUser.displayName || currentUser.email,
                    subject,
                    paper,
                    chapter,
                    text,
                    fileUrl,
                    fileType,
                    status: 'pending', // pending অথবা solved
                    createdAt: Date.now()
                });

                alert("আপনার প্রশ্নটি সফলভাবে সাবমিট করা হয়েছে!");
                document.getElementById('questionForm').reset();
                loadUserQuestions(currentUser.uid);
            } catch(err) {
                alert("ত্রুটি: " + err.message);
            } finally {
                submitBtn.innerText = "প্রশ্ন সাবমিট করুন";
                submitBtn.disabled = false;
            }
        }

        function loadUserQuestions(uid) {
            const listContainer = document.getElementById('myQuestionsList');
            onValue(ref(db, 'qa_questions'), (snapshot) => {
                if(snapshot.exists()) {
                    let html = '';
                    snapshot.forEach((childSnap) => {
                        const q = childSnap.val();
                        if(q.uid === uid) {
                            let fileDisplay = '';
                            if(q.fileUrl) {
                                if(q.fileType === 'pdf') {
                                    fileDisplay = `<a href="${q.fileUrl}" target="_blank" style="color: #38bdf8; display:block; margin-top:5px;">📄 পিডিএফ ফাইল দেখুন</a>`;
                                } else {
                                    fileDisplay = `<img src="${q.fileUrl}" style="max-width:100%; max-height:150px; border-radius:6px; margin-top:5px; display:block;">`;
                                }
                            }

                            let answerDisplay = `<div style="margin-top:8px;"><span class="badge badge-pending">শিক্ষকের উত্তরের অপেক্ষায়...</span></div>`;
                            if(q.status === 'solved') {
                                let ansFileDisplay = '';
                                if(q.answerFileUrl) {
                                    ansFileDisplay = q.answerFileType === 'pdf' ? `<a href="${q.answerFileUrl}" target="_blank" style="color: #38bdf8; display:block; margin-top:5px;">📄 উত্তরপত্র (পিডিএফ)</a>` : `<img src="${q.answerFileUrl}" style="max-width:100%; max-height:150px; border-radius:6px; margin-top:5px; display:block;">`;
                                }
                                let audioDisplay = q.answerAudioUrl ? `<audio controls style="width:100%; margin-top:8px;"><source src="${q.answerAudioUrl}" type="audio/webm"></audio>` : '';
                                
                                answerDisplay = `
                                    <div class="answer-box">
                                        <div style="font-weight:bold; color:#10b981; margin-bottom:4px;">👨‍🏫 শিক্ষকের উত্তর:</div>
                                        <p style="font-size:13px; color:#f8fafc; white-space:pre-wrap;">${q.answerText || ''}</p>
                                        ${ansFileDisplay}
                                        ${audioDisplay}
                                    </div>
                                `;
                            }

                            html += `
                                <div class="question-box">
                                    <div style="font-size:12px; color:#38bdf8; margin-bottom:4px;">📚 ${q.subject.toUpperCase()} (${q.paper}) - ${q.chapter}</div>
                                    <p style="font-size:14px; margin-bottom:6px;">${q.text || ''}</p>
                                    ${fileDisplay}
                                    ${answerDisplay}
                                </div>
                            `;
                        }
                    });
                    listContainer.innerHTML = html !== '' ? html : '<p style="color: #94a3b8; text-align: center;">আপনি এখনো কোনো প্রশ্ন করেননি।</p>';
                } else {
                    listContainer.innerHTML = '<p style="color: #94a3b8; text-align: center;">কোনো প্রশ্ন পাওয়া যায়নি।</p>';
                }
            });
        }
    </script>
</body>
</html>

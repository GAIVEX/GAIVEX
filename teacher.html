<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX - Teacher / Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 4%; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .logo span { color: #f43f5e; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; width: 95%; flex: 1; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2, h3 { color: #38bdf8; margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-top: 10px; margin-bottom: 5px; font-size: 13px; }
        input, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; font-size: 14px; outline: none; margin-bottom: 10px; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #38bdf8; color: #0f172a; transition: 0.3s; width: 100%; }
        .btn:hover { background: #7dd3fc; }
        .btn-danger { background: #f43f5e; color: #fff; }
        .btn-danger:hover { background: #e11d48; }

        .question-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #f59e0b; color: #000; }
        .badge-solved { background: #10b981; color: #fff; }
        
        .answer-form { background: #1e293b; border-top: 1px dashed #475569; padding-top: 12px; margin-top: 12px; }
        .audio-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">GAIVEX <span>Admin Panel</span></a>
        <div id="adminInfo" style="display: none; font-size: 14px; color: #38bdf8;">
            👨‍🏫 অ্যাডমিন: <span id="adminNameDisplay"></span> | <button onclick="logoutAdmin()" style="background: #f43f5e; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">লগআউট</button>
        </div>
    </header>

    <div class="container">
        <!-- লগইন সেকশন -->
        <div id="loginCard" class="card" style="max-width: 400px; margin: 40px auto;">
            <h2>🔐 শিক্ষক প্যানেল লগইন</h2>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">আপনার নির্ধারিত অ্যাডমিন আইডি ও পাসওয়ার্ড দিয়ে প্রবেশ করুন।</p>
            
            <label>অ্যাডমিন আইডি (Admin No):</label>
            <input type="text" id="adminNoInput" placeholder="GAIVEX010192" value="GAIVEX010192">

            <label>পাসওয়ার্ড (Admin Pass):</label>
            <input type="password" id="adminPassInput" placeholder="GAIVEX#@2552" value="GAIVEX#@2552">

            <button class="btn" onclick="loginTeacher()" style="margin-top: 10px;">লগইন করুন</button>
        </div>

        <!-- ড্যাশবোর্ড / প্রশ্ন উত্তরের সেকশন -->
        <div id="dashboardCard" style="display: none;">
            <div class="card">
                <h2>📥 স্টুডেন্টদের প্রশ্ন তালিকা ও উত্তর প্রদান</h2>
                <div id="teacherQuestionsList">
                    <p style="color: #94a3b8; text-align: center;">প্রশ্ন লোড হচ্ছে...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
            authDomain: "gaivexexam.firebaseapp.com",
            databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
            projectId: "gaivexexam",
            storageBucket: "gaivexexam.firebasestorage.app",
            messagingSenderId: "956204530190",
            appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        const ADMIN_EMAIL = "gaiyumtamim@gmail.com";
        const ADMIN_NO = "GAIVEX010192";
        const ADMIN_PASS = "GAIVEX#@2552";

        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;

        window.loginTeacher = async function() {
            const inputNo = document.getElementById('adminNoInput').value.trim();
            const inputPass = document.getElementById('adminPassInput').value.trim();

            if(inputNo !== ADMIN_NO || inputPass !== ADMIN_PASS) {
                alert("ভুল অ্যাডমিন আইডি বা পাসওয়ার্ড!");
                return;
            }

            try {
                // ফায়ারবেস অথেন্টিকেশনের মাধ্যমে লগইন করা
                await signInWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PASS);
                alert("সফলভাবে লগইন হয়েছে!");
            } catch (err) {
                alert("লগইন ত্রুটি: " + err.message + "\n(নোট: আপনার ফায়ারবেস প্রজেক্টে এই ইমেইল ও পাসওয়ার্ড দিয়ে একটি অ্যাকাউন্ট তৈরি করা থাকতে হবে।)");
            }
        }

        window.logoutAdmin = function() {
            signOut(auth);
        }

        onAuthStateChanged(auth, (user) => {
            if(user && user.email === ADMIN_EMAIL) {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('dashboardCard').style.display = 'block';
                document.getElementById('adminInfo').style.display = 'block';
                document.getElementById('adminNameDisplay').innerText = ADMIN_NO;
                fetchTeacherQuestions();
            } else {
                document.getElementById('loginCard').style.display = 'block';
                document.getElementById('dashboardCard').style.display = 'none';
                document.getElementById('adminInfo').style.display = 'none';
            }
        });

        function fetchTeacherQuestions() {
            onValue(ref(db, 'qa_questions'), (snapshot) => {
                const container = document.getElementById('teacherQuestionsList');
                if(!snapshot.exists()) {
                    container.innerHTML = '<p style="color:#94a3b8; text-align:center;">কোনো প্রশ্ন পাওয়া যায়নি।</p>';
                    return;
                }

                const data = snapshot.val();
                let html = '';

                for(let id in data) {
                    const q = data[id];
                    let fileDisplay = q.fileUrl ? (q.fileType === 'pdf' ? `<a href="${q.fileUrl}" target="_blank" style="color:#38bdf8; display:block; margin-top:5px;">📄 স্টুডেন্টের ফাইল দেখুন</a>` : `<img src="${q.fileUrl}" style="max-width:100%; max-height:150px; border-radius:6px; margin-top:5px; display:block;">`) : '';

                    let statusBadge = q.status === 'solved' ? `<span class="badge badge-solved">মীমাংসিত (Solved)</span>` : `<span class="badge badge-pending">অপেক্ষমান (Pending)</span>`;

                    html += `
                        <div class="question-box">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                <span style="font-size:12px; color:#38bdf8; font-weight:bold;">স্টুডেন্ট: ${q.studentName || 'অজ্ঞাত'}</span>
                                ${statusBadge}
                            </div>
                            <div style="font-size:11px; color:#94a3b8; margin-bottom:6px;">📚 ${q.subject.toUpperCase()} (${q.paper}) - ${q.chapter}</div>
                            <p style="font-size:14px; margin-bottom:8px;">${q.text || ''}</p>
                            ${fileDisplay}

                            <div class="answer-form">
                                <label>উত্তর লিখুন:</label>
                                <textarea id="ansText_${q.id}" rows="3" placeholder="এখানে বিস্তারিত উত্তর লিখুন...">${q.answerText || ''}</textarea>
                                
                                <label>উত্তরপত্র ছবি/ফাইল (ঐচ্ছিক):</label>
                                <input type="file" id="ansFile_${q.id}" accept="image/*,.pdf">

                                <button class="btn" onclick="submitAnswer('${q.id}')">উত্তর সাবমিট করুন</button>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            });
        }

        window.submitAnswer = async function(qId) {
            const ansText = document.getElementById(`ansText_${qId}`).value;
            const ansFileInput = document.getElementById(`ansFile_${qId}`).files[0];

            if(!ansText && !ansFileInput) {
                alert("উত্তর বা উত্তরপত্র ফাইল দিন!");
                return;
            }

            try {
                let answerFileUrl = "", answerFileType = "";
                if(ansFileInput) {
                    const fRef = storageRef(storage, `qa_answers/${Date.now()}_${ansFileInput.name}`);
                    const snapshot = await uploadBytes(fRef, ansFileInput);
                    answerFileUrl = await getDownloadURL(snapshot.ref);
                    answerFileType = ansFileInput.type.includes('pdf') ? 'pdf' : 'image';
                }

                const qUpdateRef = ref(db, `qa_questions/${qId}`);
                await update(qUpdateRef, {
                    answerText,
                    answerFileUrl,
                    answerFileType,
                    status: 'solved',
                    answeredAt: Date.now()
                });

                alert("উত্তর সফলভাবে সাবমিট করা হয়েছে!");
            } catch(err) {
                alert("ত্রুটি: " + err.message);
            }
        }
    </script>
</body>
</html>

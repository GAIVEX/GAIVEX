<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Admin Dashboard</title>
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --pending: #ef4444;
            --answered: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Header & Filters */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        select, input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
        
        /* Stats */
        .stats { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 15px; border-radius: 8px; flex: 1; border: 1px solid var(--border); text-align: center; }
        .stat-card h3 { font-size: 24px; margin-top: 5px; }

        /* Question Cards */
        .questions-list { display: grid; gap: 15px; }
        .question-card { background: var(--card-bg); border-radius: 8px; padding: 15px; border-left: 5px solid #cbd5e1; border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .question-card.pending { border-left-color: var(--pending); }
        .question-card.answered { border-left-color: var(--answered); }
        
        .question-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .question-title { font-weight: bold; font-size: 16px; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.pending { background: #fee2e2; color: #991b1b; }
        .status.answered { background: #d1fae5; color: #065f46; }

        .meta { display: flex; gap: 10px; font-size: 12px; color: #64748b; margin: 8px 0; flex-wrap: wrap; }
        .question-text { margin: 10px 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        
        .file-preview { margin: 10px 0; }
        .file-preview img { max-width: 100%; max-height: 250px; border-radius: 6px; border: 1px solid var(--border); }
        .pdf-link { color: var(--primary); text-decoration: none; font-weight: bold; }

        .question-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border); }
        .action-btns { display: flex; gap: 8px; }
        button { cursor: pointer; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; color: white; transition: 0.2s; }
        .answer-btn { background: var(--primary); }
        .view-btn { background: #6366f1; }
        .cancel-btn { background: #ef4444; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        textarea { width: 100%; height: 100px; margin: 10px 0; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }

        .empty { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Teacher Dashboard</h2>
    </div>

    <div class="stats">
        <div class="stat-card">মোট প্রশ্ন <h3 id="statTotal">0</h3></div>
        <div class="stat-card">উত্তর অপেক্ষমাণ <h3 id="statPending" style="color:var(--pending)">0</h3></div>
        <div class="stat-card">উত্তর দেওয়া হয়েছে <h3 id="statAnswered" style="color:var(--answered)">0</h3></div>
    </div>

    <div class="filters">
        <select id="subjectSelect"><option value="">সকল বিষয়</option></select>
        <select id="paperSelect"><option value="">সকল পত্র</option><option value="paper1">১ম পত্র</option><option value="paper2">২য় পত্র</option></select>
        <select id="chapterSelect"><option value="">সকল অধ্যায়</option></select>
        <select id="filterStatus">
            <option value="">সকল স্ট্যাটাস</option>
            <option value="pending">উত্তর অপেক্ষমাণ</option>
            <option value="answered">উত্তর দেওয়া হয়েছে</option>
        </select>
        <input type="text" id="searchQuestion" placeholder="অনুসন্ধান করুন...">
    </div>

    <div class="questions-list" id="questionsContainer">
        <!-- কোড দ্বারা প্রশ্নসমূহ এখানে লোড হবে -->
    </div>
</div>

<!-- Answer Modal -->
<div class="modal" id="answerModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>উত্তর প্রদান করুন</h3>
            <button style="background:none;color:#000;" onclick="closeModal('answerModal')">✖</button>
        </div>
        <input type="hidden" id="currentQuestionId">
        <textarea id="answerInput" placeholder="এখানে আপনার উত্তর লিখুন..."></textarea>
        <div style="text-align: right;">
            <button class="answer-btn" onclick="submitAnswer()">জমা দিন</button>
        </div>
    </div>
</div>

<script>
    // ডামি ডেটা ও প্রাথমিক স্টোর
    let allQuestions = {};

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
    }

    function subjectName(key) {
        const subjects = { physics: "পদার্থবিজ্ঞান", chemistry: "রসায়ন", math: "উচ্চতর গণিত", biology: "জীববিজ্ঞান" };
        return subjects[key] || key || "সাধারণ";
    }

    function getFollowupArray(q) {
        if (!q.followups) return [];
        return Array.isArray(q.followups) ? q.followups : Object.values(q.followups);
    }

    function renderQuestions(){
        const container = document.getElementById("questionsContainer");
        const subject = document.getElementById("subjectSelect").value;
        const paper = document.getElementById("paperSelect").value;
        const chapter = document.getElementById("chapterSelect").value;
        const status = document.getElementById("filterStatus").value;
        const search = document.getElementById("searchQuestion").value.toLowerCase().trim();

        let questions = Object.entries(allQuestions);

        questions = questions.filter(([id, q]) => {
            if(subject && q.subject !== subject) return false;
            if(paper && q.paper !== paper) return false;
            if(chapter && q.chapter !== chapter) return false;

            const followups = getFollowupArray(q);
            const lastFollowup = followups.length > 0 ? followups[followups.length - 1] : null;
            
            // নতুন ফলো-আপ পেন্ডিং লজিক
            const isFollowupPending = lastFollowup && (lastFollowup.sender === "student" || lastFollowup.studentUid);

            let qStatus = "pending";
            if (q.status === "answered" && !isFollowupPending) {
                qStatus = "answered";
            }

            if(status && qStatus !== status) return false;

            if(search){
                const searchable = `${q.questionText || ""} ${q.studentName || ""} ${q.studentEmail || ""} ${q.chapter || ""}`.toLowerCase();
                if(!searchable.includes(search)) return false;
            }

            return true;
        });

        questions.sort(([aId, a], [bId, b]) => Number(b.createdAt || 0) - Number(a.createdAt || 0));

        updateStats();

        if(questions.length === 0){
            container.innerHTML = `<div class="empty">📭 কোনো প্রশ্ন পাওয়া যায়নি।</div>`;
            return;
        }

        let html = "";

        questions.forEach(([id, q]) => {
            const followups = getFollowupArray(q);
            const lastFollowup = followups.length > 0 ? followups[followups.length - 1] : null;
            
            const isFollowupPending = lastFollowup && (lastFollowup.sender === "student" || lastFollowup.studentUid);
            const isAnswered = (q.status === "answered") && !isFollowupPending;
            
            let statusClass = isAnswered ? "answered" : "pending";
            let statusText = isAnswered ? "উত্তর দেওয়া হয়েছে" : (isFollowupPending ? "নতুন ফলো-আপ এসেছে" : "উত্তর অপেক্ষমাণ");

            const date = q.createdAt ? new Date(q.createdAt).toLocaleString("bn-BD") : "";

            let questionFile = "";
            if(q.fileData){
                if(q.fileType && q.fileType.startsWith("image/")){
                    questionFile = `<div class="file-preview"><img src="${q.fileData}"></div>`;
                } else if(q.fileType === "application/pdf"){
                    questionFile = `<div class="file-preview"><a class="pdf-link" href="${q.fileData}" target="_blank">📄 প্রশ্নের PDF দেখুন</a></div>`;
                }
            }

            let followupBadge = "";
            if (followups.length > 0) {
                const badgeBg = isFollowupPending ? "#ef4444" : "#f59e0b";
                const badgeText = isFollowupPending ? `${followups.length} Follow-up (নতুন!)` : `${followups.length} Follow-up`;
                followupBadge = `<span style="background:${badgeBg};color:#fff;border-radius:10px;padding:2px 7px;font-size:10px;margin-left:5px;font-weight:bold;">${badgeText}</span>`;
            }

            html += `
            <div class="question-card ${statusClass}">
                <div class="question-top">
                    <div>
                        <div class="question-title">${escapeHtml(q.studentName || "শিক্ষার্থী")}</div>
                        <div style="color:#64748b;font-size:11px;margin-top:3px;">${escapeHtml(q.studentEmail || "")}</div>
                    </div>
                    <span class="status ${statusClass}">${statusText}</span>
                </div>

                <div class="meta">
                    <span>📚 ${subjectName(q.subject)}</span>
                    <span>📖 ${q.paper === "paper1" ? "১ম পত্র" : "২য় পত্র"}</span>
                    <span>📌 ${escapeHtml(q.chapter || "")}</span>
                    <span>🕐 ${date}</span>
                </div>

                <div class="question-text render-latex">${escapeHtml(q.questionText || "কোনো লিখিত প্রশ্ন নেই।")}</div>

                ${questionFile}

                <div class="question-footer">
                    <div style="color:#64748b;font-size:11px;">ID: ${id.substring(0,8)}</div>
                    <div class="action-btns">
                        <button class="${isAnswered ? "view-btn" : "answer-btn"}" onclick="window.openAnswerModal('${id}')">
                            ${isAnswered ? "👁️ উত্তর দেখুন / পরিবর্তন" : "✍️ উত্তর দিন"}
                        </button>
                        <button class="view-btn" style="background:${isFollowupPending ? '#ef4444' : '#8b5cf6'};" onclick="window.openFollowupModal('${id}')">
                            💬 চ্যাট / ফলো-আপ ${followupBadge}
                        </button>
                        <button class="cancel-btn" onclick="window.cancelQuestion('${id}')">
                            🗑️ Delete
                        </button>
                    </div>
                </div>
            </div>
            `;
        });

        container.innerHTML = html;
        
        if (window.renderMathInElement) {
            renderMathInElement(container, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError : false
            });
        }
    }

    function updateStats() {
        let total = Object.keys(allQuestions).length;
        let pending = 0;
        let answered = 0;

        Object.values(allQuestions).forEach(q => {
            const followups = getFollowupArray(q);
            const lastFollowup = followups.length > 0 ? followups[followups.length - 1] : null;
            const isFollowupPending = lastFollowup && (lastFollowup.sender === "student" || lastFollowup.studentUid);
            
            if (q.status === "answered" && !isFollowupPending) {
                answered++;
            } else {
                pending++;
            }
        });

        document.getElementById("statTotal").innerText = total;
        document.getElementById("statPending").innerText = pending;
        document.getElementById("statAnswered").innerText = answered;
    }

    // Modal Control & Window Scope Assignments
    window.openAnswerModal = function(id) {
        document.getElementById("currentQuestionId").value = id;
        document.getElementById("answerInput").value = allQuestions[id].answer || "";
        document.getElementById("answerModal").style.display = "flex";
    };

    window.closeModal = function(modalId) {
        document.getElementById(modalId).style.display = "none";
    };

    window.submitAnswer = function() {
        const id = document.getElementById("currentQuestionId").value;
        const answer = document.getElementById("answerInput").value;
        
        if(allQuestions[id]){
            allQuestions[id].answer = answer;
            allQuestions[id].status = "answered";
            
            // যদি ফলো-আপ থেকে থাকে, শেষ মেসেজটি টিচারের হিসেবে আপডেট
            const followups = getFollowupArray(allQuestions[id]);
            if(followups.length > 0) {
                followups.push({ sender: "teacher", text: answer, timestamp: Date.now() });
                allQuestions[id].followups = followups;
            }
        }
        
        window.closeModal("answerModal");
        renderQuestions();
    };

    window.openFollowupModal = function(id) {
        alert("ফলো-আপ চ্যাট হ্যান্ডলার যুক্ত করুন। Question ID: " + id);
    };

    window.cancelQuestion = function(id) {
        if(confirm("আপনি কি নিশ্চিত যে প্রশ্নটি মুছে ফেলতে চান?")){
            delete allQuestions[id];
            renderQuestions();
        }
    };

    // Filter event listeners
    document.getElementById("subjectSelect").addEventListener("change", renderQuestions);
    document.getElementById("paperSelect").addEventListener("change", renderQuestions);
    document.getElementById("chapterSelect").addEventListener("change", renderQuestions);
    document.getElementById("filterStatus").addEventListener("change", renderQuestions);
    document.getElementById("searchQuestion").addEventListener("input", renderQuestions);

    // Initial load
    renderQuestions();
</script>
</body>
</html>

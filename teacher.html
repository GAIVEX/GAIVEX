<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX - Teacher Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        input, textarea, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; margin-bottom: 10px; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-save { background: #10b981; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #38bdf8; margin-bottom: 20px;">👨‍🏫 GAIVEX Teacher Panel</h2>
        
        <!-- লগইন সেকশন -->
        <div id="teacherLoginCard" class="card">
            <h3>শিক্ষক লগইন</h3>
            <form onsubmit="handleTeacherLogin(event)">
                <label>Teacher ID:</label><input type="text" id="tId" required placeholder="GVX-001098">
                <label>Password:</label><input type="password" id="tPass" required placeholder="GAIVEX#@014265">
                <button type="submit" class="btn btn-save" style="width:100%;">লগইন করুন</button>
            </form>
        </div>

        <!-- প্রশ্ন লিস্ট ও উত্তর দেওয়ার সেকশন -->
        <div id="teacherDashboard" style="display: none;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h3 style="color: #10b981;">স্টুডেন্টদের প্রশ্নসমূহ</h3>
                <button class="btn" style="background:#ef4444; color:#fff;" onclick="location.reload()">লগআউট</button>
            </div>
            <div id="teacherQuestionsList"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
            authDomain: "gaivexexam.firebaseapp.com",
            databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
            projectId: "gaivexexam"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.handleTeacherLogin = (e) => {
            e.preventDefault();
            const id = document.getElementById('tId').value;
            const pass = document.getElementById('tPass').value;

            if(id === "GVX-001098" && pass === "GAIVEX#@014265") {
                document.getElementById('teacherLoginCard').style.display = 'none';
                document.getElementById('teacherDashboard').style.display = 'block';
                loadTeacherQuestions();
            } else {
                alert("ভুল আইডি বা পাসওয়ার্ড!");
            }
        }

        async function loadTeacherQuestions() {
            const snapshot = await get(ref(db, 'questions'));
            const container = document.getElementById('teacherQuestionsList');
            if(snapshot.exists()) {
                const data = snapshot.val();
                let html = '';
                Object.values(data).forEach(q => {
                    html += `
                        <div class="card">
                            <p style="font-size:12px; color:#38bdf8;">স্টুডেন্ট: ${q.userName} | বিষয়: ${q.subject} (${q.chapter})</p>
                            <p style="font-size:14px; margin: 8px 0;"><b>প্রশ্ন:</b> ${q.questionText}</p>
                            ${q.fileUrl ? `<img src="${q.fileUrl}" style="max-width:150px; border-radius:4px; margin-bottom:8px;">` : ''}
                            
                            <div style="background:#0f172a; padding:10px; border-radius:6px; margin-top:10px;">
                                <textarea id="replyText_${q.id}" placeholder="আপনার উত্তর লিখুন..."></textarea>
                                <button class="btn btn-save" onclick="sendReply('${q.id}', '${q.uid}')">উত্তর ও নোটিফিকেশন পাঠান</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = '<p>কোনো প্রশ্ন নেই।</p>';
            }
        }

        window.sendReply = async (qId, studentUid) => {
            const replyText = document.getElementById(`replyText_${qId}`).value;
            if(!replyText) { alert("উত্তর লিখুন!"); return; }

            // প্রশ্নে উত্তর আপডেট করা
            await update(ref(db, `questions/${qId}`), {
                reply: { text: replyText, timestamp: Date.now() },
                status: 'answered'
            });

            // স্টুডেন্টের নোটিফিকেশনে পাঠানো
            const notifRef = ref(db, `notifications/${studentUid}`);
            const newNotifKey = Date.now();
            await update(ref(db, `notifications/${studentUid}/${newNotifKey}`), {
                title: "আপনার প্রশ্নের উত্তর দেওয়া হয়েছে!",
                message: "শিক্ষক মহাশয় আপনার প্রশ্নের সমাধান দিয়েছেন। দেখতে ক্লিক করুন।",
                date: Date.now(),
                read: false
            });

            alert("উত্তর সফলভাবে পাঠানো হয়েছে!");
            loadTeacherQuestions();
        }
    </script>
</body>
</html>

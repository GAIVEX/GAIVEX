<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাইভ পরীক্ষা - GAIVEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 4%; background: #1e293b; border-bottom: 1px solid #334155; }
        .logo { font-size: 22px; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .logo span { color: #f43f5e; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; width: 100%; flex: 1; }
        
        .timer-header { position: sticky; top: 10px; z-index: 100; background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .timer-box { font-size: 20px; font-weight: bold; color: #f43f5e; background: #0f172a; padding: 4px 12px; border-radius: 6px; border: 1px solid #f43f5e; }

        .question-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 15px; }
        .question-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #f8fafc; line-height: 1.5; }
        
        .options-list { display: flex; flex-direction: column; gap: 8px; }
        .option-item { background: #0f172a; border: 1px solid #475569; padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .option-item:hover { border-color: #38bdf8; background: #1e293b; }
        .option-item.disabled-option { cursor: not-allowed; opacity: 0.8; }
        .option-item input[type="radio"] { accent-color: #38bdf8; transform: scale(1.2); }

        .btn-submit { background: #10b981; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; margin-bottom: 30px; transition: 0.3s; }
        .btn-submit:hover { background: #059669; }

        .explanation-box { background: #0f172a; border-left: 4px solid #38bdf8; padding: 10px; margin-top: 10px; border-radius: 0 6px 6px 0; font-size: 13px; color: #cbd5e1; }
        .correct-opt { background: #064e3b !important; border-color: #10b981 !important; color: #a7f3d0 !important; }
        .wrong-opt { background: #881337 !important; border-color: #f43f5e !important; color: #fecdd3 !important; }

        .score-board { background: #1e293b; border: 1px solid #38bdf8; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .already-submitted-msg { color: #f43f5e; font-size: 14px; margin-top: 5px; font-weight: bold; }

        .site-footer { background: #1e293b; border-top: 1px solid #334155; padding: 25px 20px 20px; margin-top: auto; text-align: center; }
        .footer-logo { font-size: 20px; font-weight: 700; color: #38bdf8; }
        .footer-logo span { color: #f43f5e; }
        .social-links { display: flex; justify-content: center; gap: 18px; margin-top: 10px; }
        .social-btn { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; background: #0f172a; border: 1px solid #334155; transition: 0.3s; }
        .social-btn:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .social-btn svg { width: 22px; height: 22px; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">GAIVEX<span>.</span></a>
        <a href="index.html" style="color: #94a3b8; text-decoration: none; font-weight: bold; font-size: 14px;">🏠 হোম</a>
    </header>

    <div class="container">
        <div class="timer-header">
            <h3 id="examTitle" style="font-size: 16px; color: #38bdf8;">পরীক্ষা লোড হচ্ছে...</h3>
            <div class="timer-box" id="timerDisplay">00:00</div>
        </div>

        <div id="resultSummary" style="display: none;"></div>

        <form id="examForm">
            <div id="questionsContainer"></div>
            <button type="submit" class="btn-submit" id="submitBtn">পরীক্ষা জমা দিন 🚀</button>
        </form>
    </div>

    <!-- Footer with Instagram and Social Links -->
    <footer class="site-footer">
        <div class="footer-logo">GAIVEX<span>.</span></div>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 5px;">বিশ্ববিদ্যালয় ভর্তি পরীক্ষার সেরা ও স্মার্ট প্রস্তুতি প্ল্যাটফর্ম।</p>
        <div class="social-links">
            <!-- Facebook Button -->
            <a href="https://www.facebook.com/share/181kbkyvQu/" target="_blank" class="social-btn" title="Facebook">
                <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </a>
            
            <!-- Instagram Button -->
            <a href="https://www.instagram.com/gaivex8?igsh=MTR3enA0NW01M3JhNA==" target="_blank" class="social-btn" title="Instagram">
                <svg viewBox="0 0 24 24" fill="#E4405F"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
            </a>

            <!-- YouTube Button -->
            <a href="https://youtube.com/@gaivex-h5p" target="_blank" class="social-btn" title="YouTube">
                <svg viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </a>
        </div>
        <div style="margin-top:15px; border-top:1px solid #334155; padding-top:10px; color:#64748b; font-size:12px;">&copy; 2026 GAIVEX. All rights reserved.</div>
    </footer>

    <!-- Firebase SDK (v10) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
        authDomain: "gaivexexam.firebaseapp.com",
        databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
        projectId: "gaivexexam",
        storageBucket: "gaivexexam.firebasestorage.app",
        messagingSenderId: "956204530190",
        appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const auth = getAuth(app);

      let currentUser = null;
      let timerInterval = null;
      let timeRemaining = 1200;
      const EXAM_KEY = "gaivex_live_exam_status";

      // ব্যাকআপ / ডিফল্ট প্রশ্নাবলী (যদি ফায়ারবেসে ডেটা না থাকে)
      const defaultExamData = {
        title: "ডেইলি মডেল টেস্ট (সাধারণ বিজ্ঞান ও জ্ঞান)",
        duration: 15,
        questions: [
          {
            question: "আলোর গতি সবচেয়ে বেশি কোন মাধ্যমে?",
            options: ["পানি", "কাচ", "শূন্যাঞ্চল", "বায়ু"],
            correct: 2,
            explanation: "শূন্যাঞ্চলে আলোর বেগ সবচেয়ে বেশি, যা প্রায় ৩ × ১০^৮ মিটার/সেকেন্ড।"
          },
          {
            question: "মানবদেহের সবচেয়ে বড় গ্রন্থি কোনটি?",
            options: ["থাইরয়েড", "যকৃৎ (Liver)", "প্যানক্রিয়াস", "পিটুইটারি"],
            correct: 1,
            explanation: "যকৃৎ বা লিভার হলো মানবদেহের সবচেয়ে বড় অভ্যন্তরীণ অঙ্গ ও গ্রন্থি।"
          },
          {
            question: "পানির রাসায়নিক সংকেত কোনটি?",
            options: ["CO2", "H2O", "NaCl", "O2"],
            correct: 1,
            explanation: "দুইটি হাইড্রোজেন পরমাণু এবং একটি অক্সিজেন পরমাণু মিলে পানির অনু (H2O) গঠন করে।"
          }
        ]
      };

      let examData = defaultExamData;

      async function checkAttemptAndLoad() {
        try {
          const snapshot = await get(ref(db, 'live_exams/live_daily_exam'));
          if (snapshot.exists() && snapshot.val().questions && snapshot.val().questions.length > 0) {
            examData = snapshot.val();
          } else {
            console.log("Firebase-এ কোনো প্রশ্ন নেই। ডিফল্ট প্রশ্ন লোড করা হচ্ছে।");
          }
        } catch(e) {
          console.log("Firebase Load Error:", e);
        }

        document.getElementById('examTitle').innerText = examData.title || "লাইভ পরীক্ষা";
        timeRemaining = (examData.duration || 15) * 60;
        
        renderQuestions();

        const savedResult = localStorage.getItem(EXAM_KEY);
        if (savedResult) {
          const resultData = JSON.parse(savedResult);
          showSubmittedResult(resultData.userAnswers, resultData.score);
        } else {
          startTimer();
        }
      }

      function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        if(!examData.questions || examData.questions.length === 0) {
          container.innerHTML = "<p style='text-align:center; padding: 20px; color: #94a3b8;'>বর্তমানে কোনো প্রশ্ন নেই!</p>";
          document.getElementById('submitBtn').style.display = 'none';
          return;
        }

        container.innerHTML = examData.questions.map((q, qIndex) => `
          <div class="question-card" id="q-box-${qIndex}">
            <div class="question-title">${qIndex + 1}. ${q.question}</div>
            <div class="options-list">
              ${(q.options || []).map((opt, oIndex) => `
                <label class="option-item" id="opt-label-${qIndex}-${oIndex}">
                  <input type="radio" name="q_${qIndex}" value="${oIndex}" onchange="window.lockOptions(${qIndex})">
                  <span>${opt}</span>
                </label>
              `).join('')}
            </div>
            <div class="explanation-box" id="exp-${qIndex}" style="display:none;">
              <b>ব্যাখ্যা:</b> ${q.explanation || 'কোনো ব্যাখ্যা দেওয়া নেই।'}
            </div>
          </div>
        `).join('');

        window.lockOptions = function(qIndex) {
          const inputs = document.querySelectorAll(`input[name="q_${qIndex}"]`);
          inputs.forEach(input => {
            input.disabled = true;
            input.parentElement.classList.add('disabled-option');
          });
        };
      }

      function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          timeRemaining--;
          updateTimerDisplay();
          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            alert("সময় শেষ! আপনার পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হচ্ছে।");
            submitExam();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${m}:${s}`;
      }

      async function submitExam(e) {
        if(e) e.preventDefault();
        clearInterval(timerInterval);

        let score = 0;
        const total = (examData.questions || []).length;
        const formData = new FormData(document.getElementById('examForm'));
        const userAnswers = {};

        (examData.questions || []).forEach((q, i) => {
          const selectedVal = formData.get(`q_${i}`);
          const selected = selectedVal !== null ? parseInt(selectedVal) : null;
          userAnswers[i] = selected;

          if (selected === q.correct) {
            score++;
          }
        });

        localStorage.setItem(EXAM_KEY, JSON.stringify({
          score: score,
          userAnswers: userAnswers
        }));

        showSubmittedResult(userAnswers, score);

        if (currentUser) {
          try {
            await set(ref(db, `exam_attempts/${currentUser.uid}/${Date.now()}`), {
              examTitle: examData.title,
              score: score,
              total: total,
              submittedAt: new Date().toISOString()
            });
          } catch(err) { console.error("Error saving score:", err); }
        }
      }

      function showSubmittedResult(userAnswers, score) {
        const total = (examData.questions || []).length;
        clearInterval(timerInterval);
        document.getElementById('timerDisplay').innerText = "00:00";

        (examData.questions || []).forEach((q, i) => {
          const selected = userAnswers[i];
          const expBox = document.getElementById(`exp-${i}`);
          if(expBox) expBox.style.display = 'block';

          (q.options || []).forEach((_, oIndex) => {
            const lbl = document.getElementById(`opt-label-${i}-${oIndex}`);
            if(lbl) {
              const input = lbl.querySelector('input');
              if(input) {
                input.disabled = true;
                if (selected === oIndex) input.checked = true;
              }

              if (oIndex === q.correct) {
                lbl.classList.add('correct-opt');
              }
              if (selected === oIndex && selected !== q.correct) {
                lbl.classList.add('wrong-opt');
              }
            }
          });
        });

        document.getElementById('submitBtn').style.display = 'none';

        const resDiv = document.getElementById('resultSummary');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `
          <div class="score-board">
            <h2>পরীক্ষার ফলাফল</h2>
            <p class="already-submitted-msg">⚠️ আপনি এই পরীক্ষাটি জমা দিয়েছেন!</p>
            <p style="font-size: 24px; color: #10b981; font-weight: bold; margin: 10px 0;">আপনার নম্বর: ${score} / ${total}</p>
            <p style="color: #94a3b8; font-size: 14px;">নিচে প্রতিটি প্রশ্নের সঠিক উত্তর ও ব্যাখ্যা দেওয়া হলো।</p>
          </div>
        `;

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.getElementById('examForm').addEventListener('submit', submitExam);

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
      });

      checkAttemptAndLoad();
    </script>
</body>
</html>

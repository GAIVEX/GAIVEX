          { question: "Amniotic fluid-এর একটি গুরুত্বপূর্ণ কাজ—", options: ["ভ্রূণকে যান্ত্রিক আঘাত থেকে রক্ষা করা", "ভ্রূণের রক্ত সরাসরি তৈরি করা", "ডিম্বাণু তৈরি করা", "শুক্রাণু তৈরি করা"], correct: 0, explanation: "Amniotic fluid একটি cushioning medium হিসেবে কাজ করে এবং ভ্রূণকে বাহ্যিক আঘাত থেকে সুরক্ষা দেয়।" },
          { question: "মানুষের গর্ভকাল সাধারণত প্রায়—", options: ["90 দিন", "180 দিন", "280 দিন", "365 দিন"], correct: 2, explanation: "শেষ মাসিকের প্রথম দিন থেকে হিসাব করলে মানব গর্ভকাল প্রায় 280 দিন বা 40 সপ্তাহ।" },
          { question: "প্রসবের সময় জরায়ুর সংকোচন বাড়াতে প্রধান ভূমিকা পালন করে—", options: ["Oxytocin", "Insulin", "Thyroxine", "Glucagon"], correct: 0, explanation: "Oxytocin জরায়ুর smooth muscle-এর contraction বৃদ্ধি করে এবং প্রসব প্রক্রিয়ায় গুরুত্বপূর্ণ ভূমিকা রাখে।" },
          { question: "দুধ উৎপাদনের জন্য প্রধান হরমোন—", options: ["Oxytocin", "Prolactin", "hCG", "LH"], correct: 1, explanation: "Prolactin mammary gland-এ দুধ উৎপাদনকে উদ্দীপিত করে। Oxytocin মূলত দুধ নিঃসরণ বা milk ejection-এ সাহায্য করে।" },
          { question: "নিচের কোন ক্রমটি মানব ভ্রূণের প্রাথমিক বিকাশের সঠিক ক্রম?", options: ["Zygote → Blastocyst → Morula → Implantation", "Zygote → Morula → Blastocyst → Implantation", "Morula → Zygote → Blastocyst → Implantation", "Blastocyst → Zygote → Morula → Implantation"], correct: 1, explanation: "নিষেকের পর zygote বারবার cleavage-এর মাধ্যমে morula তৈরি করে। এরপর blastocyst তৈরি হয় এবং পরে তা জরায়ুর endometrium-এ implantation করে।" }
        ]
      };

      let examData = defaultExamData;

      async function checkAttemptAndLoad() {
        try {
          const snapshot = await get(ref(db, 'live_exams/live_daily_exam'));
          if (snapshot.exists() && snapshot.val().questions && snapshot.val().questions.length > 0) {
            examData = snapshot.val();
          } else {
            examData = defaultExamData;
          }
        } catch(e) {
          console.log("Database fetch fallback: Loading default questions.");
          examData = defaultExamData;
        }

        document.getElementById('examTitle').innerText = examData.title || "লাইভ পরীক্ষা";
        
        const cleanId = (examData.id || "exam_v1").replace(/[^a-zA-Z0-9]/g, "_");
        activeExamKey = "gaivex_submitted_" + cleanId;
        examTimerKey = "gaivex_timer_" + cleanId;

        const totalSeconds = (examData.duration || 30) * 60;
        const savedTimer = localStorage.getItem(examTimerKey);
        timeRemaining = savedTimer !== null ? parseInt(savedTimer, 10) : totalSeconds;

        renderQuestions();
        renderPalette();

        const savedResult = localStorage.getItem(activeExamKey);
        if (savedResult) {
          const resultData = JSON.parse(savedResult);
          isSubmitted = true;
          showSubmittedResult(resultData.userAnswers, resultData.score);
        } else {
          startTimer();
        }
      }

      function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        const prefixes = ["ক)", "খ)", "গ)", "ঘ)"];

        container.innerHTML = examData.questions.map((q, qIndex) => `
          <div class="question-card" id="q-box-${qIndex}">
            <div class="question-header-row">
              <div class="question-title">${qIndex + 1}. ${q.question}</div>
              <button type="button" class="bookmark-btn" id="bookmark-${qIndex}" onclick="window.toggleBookmark(${qIndex})" title="বুকমার্ক করুন">★</button>
            </div>
            <div class="options-list" id="options-list-${qIndex}">
              ${(q.options || []).map((opt, oIndex) => `
                <label class="option-item" id="opt-label-${qIndex}-${oIndex}">
                  <input type="radio" name="q_${qIndex}" value="${oIndex}" onchange="window.selectOption(${qIndex}, ${oIndex})">
                  <span><b>${prefixes[oIndex] || ''}</b> ${opt}</span>
                </label>
              `).join('')}
            </div>
            <div class="explanation-box" id="exp-${qIndex}" style="display:none;">
              <b>ব্যাখ্যা:</b> ${q.explanation || 'কোনো ব্যাখ্যা দেওয়া নেই।'}
            </div>
          </div>
        `).join('');

        window.selectOption = function(qIndex, oIndex) {
          if (isSubmitted || userSelections[qIndex] !== undefined) return;
          
          userSelections[qIndex] = oIndex;
          
          const allLabels = document.querySelectorAll(`[id^="opt-label-${qIndex}-"]`);
          allLabels.forEach((lbl, idx) => {
            const input = lbl.querySelector('input');
            if(input) input.disabled = true;
            lbl.classList.add('locked-option');
            if(idx === oIndex) {
              lbl.classList.add('selected-option');
            }
          });

          updatePalette();
        };

        window.toggleBookmark = function(qIndex) {
          bookmarkedQuestions[qIndex] = !bookmarkedQuestions[qIndex];
          const btn = document.getElementById(`bookmark-${qIndex}`);
          if(bookmarkedQuestions[qIndex]) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
          updatePalette();
        };
      }

      function renderPalette() {
        const grid = document.getElementById('paletteGrid');
        grid.innerHTML = examData.questions.map((_, i) => `
          <button type="button" class="palette-btn" id="palette-btn-${i}" onclick="scrollToQuestion(${i})">${i + 1}</button>
        `).join('');
        updatePalette();
      }

      function updatePalette() {
        let answeredCount = 0;
        examData.questions.forEach((_, i) => {
          const btn = document.getElementById(`palette-btn-${i}`);
          if (!btn) return;

          btn.className = "palette-btn";
          if (userSelections[i] !== undefined) {
            answeredCount++;
            btn.classList.add('answered');
          }
          if (bookmarkedQuestions[i]) {
            btn.classList.add('bookmarked');
          }
        });

        const totalQ = examData.questions.length;
        document.getElementById('answeredCount').innerText = `${answeredCount}/${totalQ}`;
      }

      window.scrollToQuestion = function(index) {
        const box = document.getElementById(`q-box-${index}`);
        if(box) {
          box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };

      function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          timeRemaining--;
          localStorage.setItem(examTimerKey, timeRemaining);
          updateTimerDisplay();
          
          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            localStorage.removeItem(examTimerKey);
            alert("সময় শেষ! আপনার পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হচ্ছে।");
            submitExamAction();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${m}:${s}`;
      }

      window.openConfirmModal = function() {
        if (isSubmitted) return;
        const total = examData.questions.length;
        const answered = Object.keys(userSelections).length;
        const unanswered = total - answered;

        document.getElementById('modalStatsText').innerHTML = `
          Total Questions: <b>${total}</b><br>
          Answered: <span style="color: #10b981; font-weight: bold;">${answered}</span><br>
          Unanswered: <span style="color: #f43f5e; font-weight: bold;">${unanswered}</span>
        `;
        document.getElementById('confirmModal').style.display = 'flex';
      };

      window.closeConfirmModal = function() {
        document.getElementById('confirmModal').style.display = 'none';
      };

      window.confirmAndSubmit = function() {
        closeConfirmModal();
        submitExamAction();
      };

      async function submitExamAction() {
        if (isSubmitted) return;

        clearInterval(timerInterval);
        localStorage.removeItem(examTimerKey);
        isSubmitted = true;

        let correctCount = 0;
        let wrongCount = 0;
        const total = (examData.questions || []).length;

        (examData.questions || []).forEach((q, i) => {
          const selected = userSelections[i];
          const correctVal = parseInt(q.correct, 10);
          if (selected !== undefined) {
            if (selected === correctVal) {
              correctCount++;
            } else {
              wrongCount++;
            }
          }
        });

        let finalScore = correctCount - (wrongCount * 0.25);
        if (finalScore < 0) finalScore = 0;

        localStorage.setItem(activeExamKey, JSON.stringify({
          score: finalScore,
          userAnswers: userSelections
        }));

        showSubmittedResult(userSelections, finalScore);

        if (currentUser) {
          try {
            await set(ref(db, `exam_attempts/${currentUser.uid}/${Date.now()}`), {
              examTitle: examData.title || "লাইভ পরীক্ষা",
              score: finalScore,
              total: total,
              submittedAt: new Date().toISOString(),
              questions: examData.questions,
              userAnswers: userSelections
            });
          } catch(err) { console.error("Error saving score:", err); }
        }
      }

      function showSubmittedResult(userAnswers, score) {
        const total = (examData.questions || []).length;
        clearInterval(timerInterval);
        document.getElementById('timerDisplay').innerText = "00:00";
        document.getElementById('filterBar').style.display = 'flex';

        (examData.questions || []).forEach((q, i) => {
          const selected = userAnswers !== undefined ? userAnswers[i] : undefined;
          const correctVal = parseInt(q.correct, 10);
          const expBox = document.getElementById(`exp-${i}`);
          if(expBox) expBox.style.display = 'block';

          (q.options || []).forEach((_, oIndex) => {
            const lbl = document.getElementById(`opt-label-${i}-${oIndex}`);
            if(lbl) {
              lbl.classList.remove('selected-option', 'locked-option');
              const input = lbl.querySelector('input');
              if(input) {
                input.disabled = true;
                if (selected === oIndex) input.checked = true;
              }

              if (oIndex === correctVal) lbl.classList.add('correct-opt');
              if (selected === oIndex && selected !== correctVal) lbl.classList.add('wrong-opt');
            }
          });
        });

        const topSubmitBtn = document.getElementById('topSubmitBtn');
        if(topSubmitBtn) topSubmitBtn.style.display = 'none';

        const resDiv = document.getElementById('resultSummary');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `
          <div class="score-board">
            <h2>পরীক্ষার ফলাফল</h2>
            <p class="already-submitted-msg">⚠️You have provided this test?</p>
            <p style="font-size: 24px; color: #10b981; font-weight: bold; margin: 10px 0;">আপনার প্রাপ্ত নম্বর: ${score} / ${total} (প্রতি ভুল উত্তরে ০.২৫ কাটা হয়েছে)</p>
            <p style="color: #94a3b8; font-size: 14px;">নিচে প্রতিটি প্রশ্নের সঠিক উত্তর ও ব্যাখ্যা ফিল্টার করে দেখতে পারেন।</p>
          </div>
        `;

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.filterQuestions = function(type) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        examData.questions.forEach((q, i) => {
          const card = document.getElementById(`q-box-${i}`);
          const selected = userSelections[i];
          const correctVal = parseInt(q.correct, 10);
          
          let show = false;
          if (type === 'all') {
            show = true;
          } else if (type === 'correct' && selected === correctVal) {
            show = true;
          } else if (type === 'wrong' && selected !== undefined && selected !== correctVal) {
            show = true;
          } else if (type === 'skipped' && selected === undefined) {
            show = true;
          } else if (type === 'bookmarked' && bookmarkedQuestions[i]) {
            show = true;
          }

          card.style.display = show ? 'block' : 'none';
        });
      };

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
      });

      checkAttemptAndLoad();
    </script>
</body>
</html>

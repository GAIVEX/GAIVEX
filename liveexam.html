          { question: "কোনটি দ্বিস্তরীয় (diploblastic) প্রাণী?", options: ["কেঁচো", "তেলাপোকা", "Hydra", "মানুষ"], correct: 2, explanation: "হাইড্রার ভ্রূণে দুটি জার্ম স্তর থাকে—এক্টোডার্ম ও এন্ডোডার্ম। তাই এটি diploblastic প্রাণী।" },

          { question: "Coelom বলতে কী বোঝায়?", options: ["অন্ত্রের গহ্বর", "দেহপ্রাচীর ও পরিপাকনালির মধ্যবর্তী মেসোডার্ম-আবৃত গহ্বর", "রক্তনালির গহ্বর", "শ্বাসনালির গহ্বর"], correct: 1, explanation: "প্রকৃত সিলোম হলো এমন একটি দেহগহ্বর যা মেসোডার্ম দ্বারা সম্পূর্ণ আবৃত থাকে।" },
          { question: "কোন প্রাণী Acoelomate?", options: ["Earthworm", "Cockroach", "Planaria", "Human"], correct: 2, explanation: "Platyhelminthes পর্বের প্রাণী, যেমন Planaria, acoelomate। এদের দেহে প্রকৃত সিলোম থাকে না।" },
          { question: "Pseudocoelom দেখা যায় কোন পর্বে?", options: ["Platyhelminthes", "Nematoda", "Annelida", "Mollusca"], correct: 1, explanation: "Nematoda পর্বের প্রাণীদের দেহগহ্বরকে pseudocoel বা ছদ্মসিলোম বলা হয়।" },
          { question: "প্রকৃত সিলোম প্রথম সুস্পষ্টভাবে কোন পর্বে দেখা যায়?", options: ["Porifera", "Cnidaria", "Platyhelminthes", "Annelida"], correct: 3, explanation: "Annelida বা বলয়কৃমি প্রকৃত সিলোমযুক্ত প্রাণীর গুরুত্বপূর্ণ উদাহরণ।" },
          { question: "প্রাণীদেহের খণ্ডায়নকে কী বলা হয়?", options: ["Cephalization", "Segmentation", "Metamerism", "Regeneration"], correct: 2, explanation: "দেহের অনুদৈর্ঘ্য অক্ষ বরাবর ধারাবাহিক অনুরূপ খণ্ডে বিভক্ত হওয়াকে metamerism বলে।" },
          { question: "কেঁচোর দেহের খণ্ডায়ন কোন ধরনের?", options: ["Radial", "Metameric", "Asymmetrical", "Irregular"], correct: 1, explanation: "কেঁচোর দেহ বহু অনুরূপ খণ্ডে বিভক্ত। প্রতিটি খণ্ডকে metamer বলা হয়।" },
          { question: "Cephalization বলতে বোঝায়—", options: ["দেহের খণ্ডায়ন", "মাথায় সংবেদী অঙ্গ ও স্নায়ুকেন্দ্রের ঘনীভবন", "দেহের অরীয় বিভাজন", "দেহের বৃদ্ধি"], correct: 1, explanation: "দ্বিপার্শ্বীয় প্রতিসাম্যযুক্ত প্রাণীদের বিবর্তনে দেহের সম্মুখ প্রান্তে মস্তিষ্ক ও সংবেদী অঙ্গের ঘনীভবনকে cephalization বলে।" },
          { question: "নিচের কোন পর্বের প্রাণী জলনালিতন্ত্রের জন্য বিশেষভাবে পরিচিত?", options: ["Porifera", "Annelida", "Arthropoda", "Mollusca"], correct: 0, explanation: "Porifera বা স্পঞ্জের দেহে বিশেষ canal system বা জলনালিতন্ত্র থাকে।" },
          { question: "Cnidaria পর্বের প্রাণীদের বিশেষ বৈশিষ্ট্য কোনটি?", options: ["Nephridia", "Cnidoblast", "Malpighian tubule", "Flame cell"], correct: 1, explanation: "Cnidaria পর্বের প্রাণীদের দেহে cnidoblast/cnidocyte থাকে। এতে nematocyst নামের বিশেষ গঠন থাকে।" },
          { question: "Platyhelminthes-এর প্রধান বৈশিষ্ট্য কোনটি?", options: ["দেহ খণ্ডিত", "দেহ চ্যাপ্টা", "দেহে jointed appendage আছে", "জলনালিতন্ত্র আছে"], correct: 1, explanation: "Platyhelminthes-এর দেহ dorsoventrally অর্থাৎ উপর-নিচে চ্যাপ্টা। এরা triploblastic ও acoelomate প্রাণী।" },
          { question: "Arthropoda পর্বের প্রধান বৈশিষ্ট্য কোনটি?", options: ["অখণ্ডিত দেহ", "সন্ধিযুক্ত উপাঙ্গ", "জলনালিতন্ত্র", "নেফ্রিডিয়া"], correct: 1, explanation: "Arthropoda-এর অর্থই হলো সন্ধিযুক্ত পা/উপাঙ্গ। এদের দেহ সাধারণত খণ্ডিত এবং কাইটিনযুক্ত বহিঃকঙ্কাল থাকে।" },
          { question: "প্রাণীজগতের সবচেয়ে বড় পর্ব কোনটি?", options: ["Mollusca", "Annelida", "Arthropoda", "Chordata"], correct: 2, explanation: "প্রজাতির সংখ্যার দিক থেকে Arthropoda প্রাণীজগতের সবচেয়ে বৃহৎ পর্ব।" },
          { question: "Mollusca পর্বের সাধারণ বৈশিষ্ট্য কোনটি?", options: ["সাধারণত নরম দেহ", "সন্ধিযুক্ত পা", "দেহে নেমাটোসিস্ট", "দেহ সবসময় খণ্ডিত"], correct: 0, explanation: "Mollusca-এর প্রাণীদের দেহ সাধারণত নরম ও অখণ্ডিত।" },
          { question: "Echinodermata-এর একান্ত বৈশিষ্ট্য কোনটি?", options: ["জলসংবহন তন্ত্র", "জলনালিকা তন্ত্র বা water vascular system", "সন্ধিযুক্ত পা", "নেফ্রিডিয়া"], correct: 1, explanation: "Echinodermata-এর অন্যতম স্বাতন্ত্র্যসূচক বৈশিষ্ট্য হলো water vascular system।" },
          { question: "Chordata পর্বের প্রধান শনাক্তকারী বৈশিষ্ট্য কোনটি?", options: ["Cnidoblast", "Notochord", "Flame cell", "Water vascular system"], correct: 1, explanation: "Chordata-এর গুরুত্বপূর্ণ বৈশিষ্ট্য হলো notochord।" },
          { question: "নিচের কোনটি অমেরুদণ্ডী প্রাণী?", options: ["মাছ", "ব্যাঙ", "কেঁচো", "পাখি"], correct: 2, explanation: "কেঁচোর দেহে কোনো মেরুদণ্ড বা vertebral column নেই। তাই এটি অমেরুদণ্ডী প্রাণী।" }
        ]
      };

      async function checkAttemptAndLoad() {
        try {
          const snapshot = await get(ref(db, 'live_exams/live_daily_exam'));
          if (snapshot.exists() && snapshot.val().questions && snapshot.val().questions.length > 0) {
            examData = snapshot.val();
          }
        } catch(e) {
          console.log("Firebase Load Error, using local default questions.");
        }

        document.getElementById('examTitle').innerText = examData.title || "লাইভ পরীক্ষা";
        timeRemaining = (examData.duration || 20) * 60;
        
        activeExamKey = "gaivex_submitted_" + (examData.id || examData.title || "exam_v1").replace(/[^a-zA-Z0-9]/g, "_");

        renderQuestions();

        const savedResult = localStorage.getItem(activeExamKey);
        if (savedResult) {
          const resultData = JSON.parse(savedResult);
          showSubmittedResult(resultData.userAnswers, resultData.score);
        } else {
          startTimer();
        }
      }

      function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        if(!examData.questions || examData.questions.length === 0) {
          container.innerHTML = "<p style='text-align:center; padding: 20px; color: #94a3b8;'>বর্তমানে কোনো পরীক্ষা চালু নেই!</p>";
          document.getElementById('submitBtn').style.display = 'none';
          return;
        }

        const prefixes = ["ক)", "খ)", "গ)", "ঘ)"];

        container.innerHTML = examData.questions.map((q, qIndex) => `
          <div class="question-card" id="q-box-${qIndex}">
            <div class="question-title">${qIndex + 1}. ${q.question}</div>
            <div class="options-list">
              ${(q.options || []).map((opt, oIndex) => `
                <label class="option-item" id="opt-label-${qIndex}-${oIndex}">
                  <input type="radio" name="q_${qIndex}" value="${oIndex}" onchange="window.selectOption(${qIndex}, ${oIndex})">
                  <span><b>${prefixes[oIndex] || ''}</b> ${opt}</span>
                </label>
              `).join('')}
            </div>
            <div class="explanation-box" id="exp-${qIndex}" style="display:none;">
              <b>ব্যাখ্যা:</b> ${q.explanation || 'কোনো ব্যাখ্যা দেওয়া নেই।'}
            </div>
          </div>
        `).join('');

        window.selectOption = function(qIndex, oIndex) {
          const allLabels = document.querySelectorAll(`[id^="opt-label-${qIndex}-"]`);
          allLabels.forEach(lbl => lbl.classList.remove('selected-option'));
          
          const selectedLbl = document.getElementById(`opt-label-${qIndex}-${oIndex}`);
          if(selectedLbl) {
            selectedLbl.classList.add('selected-option');
          }
        };
      }

      function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          timeRemaining--;
          updateTimerDisplay();
          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            alert("সময় শেষ! আপনার পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হচ্ছে।");
            submitExam();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${m}:${s}`;
      }

      async function submitExam(e) {
        if(e) e.preventDefault();
        clearInterval(timerInterval);

        let score = 0;
        const total = (examData.questions || []).length;
        const formData = new FormData(document.getElementById('examForm'));
        const userAnswers = {};

        (examData.questions || []).forEach((q, i) => {
          const selectedVal = formData.get(`q_${i}`);
          const selected = selectedVal !== null ? parseInt(selectedVal, 10) : null;
          const correctVal = parseInt(q.correct, 10);
          
          userAnswers[i] = selected;

          if (selected === correctVal) {
            score++;
          }
        });

        localStorage.setItem(activeExamKey, JSON.stringify({
          score: score,
          userAnswers: userAnswers
        }));

        showSubmittedResult(userAnswers, score);

        if (currentUser) {
          try {
            await set(ref(db, `exam_attempts/${currentUser.uid}/${Date.now()}`), {
              examTitle: examData.title,
              score: score,
              total: total,
              submittedAt: new Date().toISOString()
            });
          } catch(err) { console.error("Error saving score:", err); }
        }
      }

      function showSubmittedResult(userAnswers, score) {
        const total = (examData.questions || []).length;
        clearInterval(timerInterval);
        document.getElementById('timerDisplay').innerText = "00:00";

        (examData.questions || []).forEach((q, i) => {
          const selected = userAnswers[i];
          const correctVal = parseInt(q.correct, 10);
          const expBox = document.getElementById(`exp-${i}`);
          if(expBox) expBox.style.display = 'block';

          (q.options || []).forEach((_, oIndex) => {
            const lbl = document.getElementById(`opt-label-${i}-${oIndex}`);
            if(lbl) {
              lbl.classList.remove('selected-option');
              const input = lbl.querySelector('input');
              if(input) {
                input.disabled = true;
                if (selected === oIndex) input.checked = true;
              }

              if (oIndex === correctVal) {
                lbl.classList.add('correct-opt');
              }
              if (selected === oIndex && selected !== correctVal) {
                lbl.classList.add('wrong-opt');
              }
              if (selected !== oIndex && oIndex !== correctVal) {
                lbl.classList.add('disabled-option');
              }
            }
          });
        });

        document.getElementById('submitBtn').style.display = 'none';

        const resDiv = document.getElementById('resultSummary');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `
          <div class="score-board">
            <h2>পরীক্ষার ফলাফল</h2>
            <p class="already-submitted-msg">⚠️ আপনি এই বিষয়টির পরীক্ষা ইতোমধ্যে জমা দিয়েছেন!</p>
            <p style="font-size: 24px; color: #10b981; font-weight: bold; margin: 10px 0;">আপনার নম্বর: ${score} / ${total}</p>
            <p style="color: #94a3b8; font-size: 14px;">নিচে প্রতিটি প্রশ্নের সঠিক উত্তর ও ব্যাখ্যা দেওয়া হলো।</p>
          </div>
        `;

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.getElementById('examForm').addEventListener('submit', submitExam);

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
      });

      checkAttemptAndLoad();
    </script>
</body>
</html>

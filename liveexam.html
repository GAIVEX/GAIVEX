        .question-title { font-size: 16px; font-weight: 600; color: #f8fafc; line-height: 1.5; flex: 1; }
        .bookmark-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: #64748b; transition: 0.2s; padding: 0 5px; }
        .bookmark-btn.active { color: #facc15; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-item { background: #0f172a; border: 1.5px solid #475569; padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; font-size: 15px; display: flex; align-items: center; gap: 12px; color: #f8fafc; }
        .option-item:hover { border-color: #38bdf8; background: #1e293b; }
        .option-item input[type="radio"] { accent-color: #38bdf8; transform: scale(1.3); cursor: pointer; }

        .option-item.selected-option { background: #1e3a8a !important; border-color: #38bdf8 !important; color: #ffffff !important; font-weight: 600; }
        .option-item.locked-option { cursor: not-allowed; opacity: 0.8; }
        .correct-opt { background: #065f46 !important; border-color: #10b981 !important; color: #ffffff !important; font-weight: bold; }
        .wrong-opt { background: #9f1239 !important; border-color: #f43f5e !important; color: #ffffff !important; }

        /* Bottom Palette Section */
        .palette-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-top: 30px; margin-bottom: 30px; }
        .palette-title { font-size: 16px; font-weight: bold; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; max-height: 200px; overflow-y: auto; padding: 4px; }
        .palette-btn { width: 100%; aspect-ratio: 1; background: #0f172a; border: 1px solid #475569; color: #f8fafc; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .palette-btn.answered { background: #1e3a8a; border-color: #38bdf8; color: #fff; }
        .palette-btn.bookmarked { background: #ca8a04; border-color: #facc15; color: #fff; }

        .palette-legend { display: flex; gap: 15px; font-size: 12px; color: #94a3b8; border-top: 1px solid #334155; padding-top: 12px; margin-top: 15px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 12px; height: 12px; border-radius: 3px; }

        .filter-bar { display: none; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-btn { background: #1e293b; border: 1px solid #475569; color: #cbd5e1; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .filter-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        .explanation-box { background: #0f172a; border-left: 4px solid #38bdf8; padding: 12px; margin-top: 12px; border-radius: 0 6px 6px 0; font-size: 14px; color: #cbd5e1; line-height: 1.5; }
        .score-board { background: #1e293b; border: 1px solid #38bdf8; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .already-submitted-msg { color: #f43f5e; font-size: 14px; margin-top: 5px; font-weight: bold; }

        /* Custom Modal for Confirmation */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-box { background: #1e293b; border: 1px solid #38bdf8; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        .modal-btn { padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
        .btn-confirm { background: #10b981; color: white; }
        .btn-cancel { background: #475569; color: white; }

        .footer-logo { font-size: 20px; font-weight: 700; color: #38bdf8; }

          { question: "কোনটি দ্বিস্তরীয় (diploblastic) প্রাণী?", options: ["কেঁচো", "তেলাপোকা", "Hydra", "মানুষ"], correct: 2, explanation: "হাইড্রার ভ্রূণে দুটি জার্ম স্তর থাকে।" },
          { question: "কোনটি ত্রিস্তরীয় প্রাণী?", options: ["Hydra", "Jellyfish", "Earthworm", "Sponge"], correct: 2, explanation: "কেঁচো একটি triploblastic প্রাণী।" },
          { question: "Coelom বলতে কী বোঝায়?", options: ["অন্ত্রের গহ্বর", "দেহপ্রাচীর ও পরিপাকনালির মধ্যবর্তী মেসোডার্ম-আবৃত গহ্বর", "রক্তনালির গহ্বর", "শ্বাসনালির গহ্বর"], correct: 1, explanation: "মেসোডার্ম দ্বারা সম্পূর্ণ আবৃত দেহগহ্বর।" },
          { question: "কোন প্রাণী Acoelomate?", options: ["Earthworm", "Cockroach", "Planaria", "Human"], correct: 2, explanation: "Planaria হলো acoelomate।" },
          { question: "Pseudocoelom দেখা যায় কোন পর্বে?", options: ["Platyhelminthes", "Nematoda", "Annelida", "Mollusca"], correct: 1, explanation: "Nematoda পর্বে ছদ্মসিলোম থাকে।" },
          { question: "প্রকৃত সিলোম প্রথম সুস্পষ্টভাবে কোন পর্বে দেখা যায়?", options: ["Porifera", "Cnidaria", "Platyhelminthes", "Annelida"], correct: 3, explanation: "Annelida পর্বে প্রকৃত সিলোম থাকে।" },
          { question: "প্রাণীদেহের খণ্ডায়নকে কী বলা হয়?", options: ["Cephalization", "Segmentation", "Metamerism", "Regeneration"], correct: 2, explanation: "অনুদৈর্ঘ্য খণ্ডায়নকে metamerism বলে।" },
          { question: "কেঁচোর দেহের খণ্ডায়ন কোন ধরনের?", options: ["Radial", "Metameric", "Asymmetrical", "Irregular"], correct: 1, explanation: "কেঁচোর দেহে Metameric খণ্ডায়ন থাকে।" },
          { question: "Cephalization বলতে বোঝায়—", options: ["দেহের খণ্ডায়ন", "মাথায় সংবেদী অঙ্গ ও স্নায়ুকেন্দ্রের ঘনীভবন", "দেহের অরীয় বিভাজন", "দেহের বৃদ্ধি"], correct: 1, explanation: "মাথায় স্নায়ুকেন্দ্রের ঘনীভবন।" },
          { question: "নিচের কোন পর্বের প্রাণী জলনালিতন্ত্রের জন্য বিশেষভাবে পরিচিত?", options: ["Porifera", "Annelida", "Arthropoda", "Mollusca"], correct: 0, explanation: "Porifera পর্বে canal system থাকে।" },
          { question: "Cnidaria পর্বের প্রাণীদের বিশেষ বৈশিষ্ট্য কোনটি?", options: ["Nephridia", "Cnidoblast", "Malpighian tubule", "Flame cell"], correct: 1, explanation: "Cnidaria পর্বের বৈশিষ্ট্য Cnidoblast।" },
          { question: "Platyhelminthes-এর প্রধান বৈশিষ্ট্য কোনটি?", options: ["দেহ খণ্ডিত", "দেহ চ্যাপ্টা", "দেহে jointed appendage আছে", "জলনালিতন্ত্র আছে"], correct: 1, explanation: "এদের দেহ চ্যাপ্টা প্রকৃতির।" },
          { question: "Arthropoda পর্বের প্রধান বৈশিষ্ট্য কোনটি?", options: ["অখণ্ডিত দেহ", "সন্ধিযুক্ত উপাঙ্গ", "জলনালিতন্ত্র", "নেফ্রিডিয়া"], correct: 1, explanation: "এদের সন্ধিযুক্ত পা/উপাঙ্গ থাকে।" },
          { question: "প্রাণীজগতের সবচেয়ে বড় পর্ব কোনটি?", options: ["Mollusca", "Annelida", "Arthropoda", "Chordata"], correct: 2, explanation: "Arthropoda হলো বৃহত্তম পর্ব।" },
          { question: "Mollusca পর্বের সাধারণ বৈশিষ্ট্য কোনটি?", options: ["সাধারণত নরম দেহ", "সন্ধিযুক্ত পা", "দেহে নেমাটোসিস্ট", "দেহ সবসময় খণ্ডিত"], correct: 0, explanation: "মলাস্ক পর্বের প্রাণী নরম দেহযুক্ত।" },
          { question: "Echinodermata-এর একান্ত বৈশিষ্ট্য কোনটি?", options: ["জলসংবহন তন্ত্র", "জলনালিকা তন্ত্র বা water vascular system", "সন্ধিযুক্ত পা", "নেফ্রিডিয়া"], correct: 1, explanation: "এদের water vascular system থাকে।" },
          { question: "Chordata পর্বের প্রধান শনাক্তকারী বৈশিষ্ট্য কোনটি?", options: ["Cnidoblast", "Notochord", "Flame cell", "Water vascular system"], correct: 1, explanation: "Chordata-এর মূল বৈশিষ্ট্য Notochord।" },
          { question: "নিচের কোনটি অমেরুদণ্ডী প্রাণী?", options: ["মাছ", "ব্যাঙ", "কেঁচো", "পাখি"], correct: 2, explanation: "কেঁচো অমেরুদণ্ডী প্রাণী।" }
        ]
      };

      let examData = defaultExamData;

      async function checkAttemptAndLoad() {
        try {
          const snapshot = await get(ref(db, 'live_exams/live_daily_exam'));
          if (snapshot.exists() && snapshot.val().questions && snapshot.val().questions.length > 0) {
            examData = snapshot.val();
          } else {
            examData = defaultExamData;
          }
        } catch(e) {
          console.log("Database fetch fallback: Loading default questions.");
          examData = defaultExamData;
        }

        document.getElementById('examTitle').innerText = examData.title || "লাইভ পরীক্ষা";
        
        const cleanId = (examData.id || "exam_v1").replace(/[^a-zA-Z0-9]/g, "_");
        activeExamKey = "gaivex_submitted_" + cleanId;
        examTimerKey = "gaivex_timer_" + cleanId;

        const totalSeconds = (examData.duration || 20) * 60;
        const savedTimer = localStorage.getItem(examTimerKey);
        timeRemaining = savedTimer !== null ? parseInt(savedTimer, 10) : totalSeconds;

        renderQuestions();
        renderPalette();

        const savedResult = localStorage.getItem(activeExamKey);
        if (savedResult) {
          const resultData = JSON.parse(savedResult);
          isSubmitted = true;
          showSubmittedResult(resultData.userAnswers, resultData.score);
        } else {
          startTimer();
        }
      }

      function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        const prefixes = ["ক)", "খ)", "গ)", "ঘ)"];

        container.innerHTML = examData.questions.map((q, qIndex) => `
          <div class="question-card" id="q-box-${qIndex}">
            <div class="question-header-row">
              <div class="question-title">${qIndex + 1}. ${q.question}</div>
              <button type="button" class="bookmark-btn" id="bookmark-${qIndex}" onclick="window.toggleBookmark(${qIndex})" title="বুকমার্ক করুন">★</button>
            </div>
            <div class="options-list" id="options-list-${qIndex}">
              ${(q.options || []).map((opt, oIndex) => `
                <label class="option-item" id="opt-label-${qIndex}-${oIndex}">
                  <input type="radio" name="q_${qIndex}" value="${oIndex}" onchange="window.selectOption(${qIndex}, ${oIndex})">
                  <span><b>${prefixes[oIndex] || ''}</b> ${opt}</span>
                </label>
              `).join('')}
            </div>
            <div class="explanation-box" id="exp-${qIndex}" style="display:none;">
              <b>ব্যাখ্যা:</b> ${q.explanation || 'কোনো ব্যাখ্যা দেওয়া নেই।'}
            </div>
          </div>
        `).join('');

        window.selectOption = function(qIndex, oIndex) {
          if (isSubmitted || userSelections[qIndex] !== undefined) return;
          
          userSelections[qIndex] = oIndex;
          
          // অপশন লক করে দেওয়া
          const allLabels = document.querySelectorAll(`[id^="opt-label-${qIndex}-"]`);
          allLabels.forEach((lbl, idx) => {
            const input = lbl.querySelector('input');
            if(input) input.disabled = true;
            lbl.classList.add('locked-option');
            if(idx === oIndex) {
              lbl.classList.add('selected-option');
            }
          });

          updatePalette();
        };

        window.toggleBookmark = function(qIndex) {
          bookmarkedQuestions[qIndex] = !bookmarkedQuestions[qIndex];
          const btn = document.getElementById(`bookmark-${qIndex}`);
          if(bookmarkedQuestions[qIndex]) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
          updatePalette();
        };
      }

      function renderPalette() {
        const grid = document.getElementById('paletteGrid');
        grid.innerHTML = examData.questions.map((_, i) => `
          <button type="button" class="palette-btn" id="palette-btn-${i}" onclick="scrollToQuestion(${i})">${i + 1}</button>
        `).join('');
        updatePalette();
      }

      function updatePalette() {
        let answeredCount = 0;
        examData.questions.forEach((_, i) => {
          const btn = document.getElementById(`palette-btn-${i}`);
          if (!btn) return;

          btn.className = "palette-btn";
          if (userSelections[i] !== undefined) {
            answeredCount++;
            btn.classList.add('answered');
          }
          if (bookmarkedQuestions[i]) {
            btn.classList.add('bookmarked');
          }
        });

        const totalQ = examData.questions.length;
        document.getElementById('answeredCount').innerText = `${answeredCount}/${totalQ}`;
      }

      window.scrollToQuestion = function(index) {
        const box = document.getElementById(`q-box-${index}`);
        if(box) {
          box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };

      function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          timeRemaining--;
          localStorage.setItem(examTimerKey, timeRemaining);
          updateTimerDisplay();
          
          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            localStorage.removeItem(examTimerKey);
            alert("সময় শেষ! আপনার পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হচ্ছে।");
            submitExamAction();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${m}:${s}`;
      }

      window.openConfirmModal = function() {
        if (isSubmitted) return;
        const total = examData.questions.length;
        const answered = Object.keys(userSelections).length;
        const unanswered = total - answered;

        document.getElementById('modalStatsText').innerHTML = `
          মোট প্রশ্ন রয়েছে: <b>${total}টি</b><br>
          আপনি দাগিয়েছেন: <span style="color: #10b981; font-weight: bold;">${answered}টি</span><br>
          বাকি আছে: <span style="color: #f43f5e; font-weight: bold;">${unanswered}টি</span>
        `;
        document.getElementById('confirmModal').style.display = 'flex';
      };

      window.closeConfirmModal = function() {
        document.getElementById('confirmModal').style.display = 'none';
      };

      window.confirmAndSubmit = function() {
        closeConfirmModal();
        submitExamAction();
      };

      async function submitExamAction() {
        if (isSubmitted) return;

        clearInterval(timerInterval);
        localStorage.removeItem(examTimerKey);
        isSubmitted = true;

        let score = 0;
        const total = (examData.questions || []).length;

        (examData.questions || []).forEach((q, i) => {
          const selected = userSelections[i];
          const correctVal = parseInt(q.correct, 10);
          if (selected === correctVal) score++;
        });

        localStorage.setItem(activeExamKey, JSON.stringify({
          score: score,
          userAnswers: userSelections
        }));

        showSubmittedResult(userSelections, score);

        if (currentUser) {
          try {
            await set(ref(db, `exam_attempts/${currentUser.uid}/${Date.now()}`), {
              examTitle: examData.title,
              score: score,
              total: total,
              submittedAt: new Date().toISOString()
            });
          } catch(err) { console.error("Error saving score:", err); }
        }
      }

      function showSubmittedResult(userAnswers, score) {
        const total = (examData.questions || []).length;
        clearInterval(timerInterval);
        document.getElementById('timerDisplay').innerText = "00:00";
        document.getElementById('filterBar').style.display = 'flex';

        (examData.questions || []).forEach((q, i) => {
          const selected = userAnswers !== undefined ? userAnswers[i] : undefined;
          const correctVal = parseInt(q.correct, 10);
          const expBox = document.getElementById(`exp-${i}`);
          if(expBox) expBox.style.display = 'block';

          (q.options || []).forEach((_, oIndex) => {
            const lbl = document.getElementById(`opt-label-${i}-${oIndex}`);
            if(lbl) {
              lbl.classList.remove('selected-option', 'locked-option');
              const input = lbl.querySelector('input');
              if(input) {
                input.disabled = true;
                if (selected === oIndex) input.checked = true;
              }

              if (oIndex === correctVal) lbl.classList.add('correct-opt');
              if (selected === oIndex && selected !== correctVal) lbl.classList.add('wrong-opt');
              if (selected !== oIndex && oIndex !== correctVal) lbl.classList.add('disabled-option');
            }
          });
        });

        const topSubmitBtn = document.getElementById('topSubmitBtn');
        if(topSubmitBtn) topSubmitBtn.style.display = 'none';

        const resDiv = document.getElementById('resultSummary');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `
          <div class="score-board">
            <h2>পরীক্ষার ফলাফল</h2>
            <p class="already-submitted-msg">⚠️ আপনি এই বিষয়টির পরীক্ষা ইতোমধ্যে জমা দিয়েছেন!</p>
            <p style="font-size: 24px; color: #10b981; font-weight: bold; margin: 10px 0;">আপনার নম্বর: ${score} / ${total}</p>
            <p style="color: #94a3b8; font-size: 14px;">নিচে প্রতিটি প্রশ্নের সঠিক উত্তর ও ব্যাখ্যা ফিল্টার করে দেখতে পারেন।</p>
          </div>
        `;

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.filterQuestions = function(type) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        examData.questions.questions?.forEach ? null : null; // Safe check
        examData.questions.forEach((q, i) => {
          const card = document.getElementById(`q-box-${i}`);
          const selected = userSelections[i];
          const correctVal = parseInt(q.correct, 10);
          
          let show = false;
          if (type === 'all') {
            show = true;
          } else if (type === 'correct' && selected === correctVal) {
            show = true;
          } else if (type === 'wrong' && selected !== undefined && selected !== correctVal) {
            show = true;
          } else if (type === 'skipped' && selected === undefined) {
            show = true;
          } else if (type === 'bookmarked' && bookmarkedQuestions[i]) {
            show = true;
          }

          card.style.display = show ? 'block' : 'none';
        });
      };

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
      });

      checkAttemptAndLoad();
    </script>
</body>
</html>

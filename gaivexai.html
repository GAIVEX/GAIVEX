<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#06111f">

<meta
    name="description"
    content="GAIVEX AI — Smart Admission & Student Assistant"
>

<title>GAIVEX AI — Smart Student Assistant</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --bg:#040b14;
    --bg2:#071321;
    --panel:#0a1929;
    --panel2:#0d2135;
    --panel3:#102b43;

    --border:rgba(91,151,190,.20);
    --border2:rgba(0,191,255,.35);

    --primary:#00c8ff;
    --primary2:#0077ff;

    --cyan:#00d9ff;
    --blue:#3b82f6;

    --success:#10b981;
    --danger:#ef4444;
    --warning:#f59e0b;

    --text:#f3faff;
    --text2:#c5d8e6;
    --muted:#7f9aaf;

    --user1:#009fe3;
    --user2:#006fbe;

    --shadow:
        0 25px 70px rgba(0,0,0,.35);

    --radius:18px;

}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    width:100%;
    min-height:100%;
    scroll-behavior:smooth;
}

body{

    width:100%;
    min-height:100vh;

    background:
        radial-gradient(
            900px 500px at -10% -10%,
            rgba(0,200,255,.14),
            transparent 60%
        ),
        radial-gradient(
            800px 500px at 110% 90%,
            rgba(0,94,255,.12),
            transparent 60%
        ),
        linear-gradient(
            145deg,
            #030912,
            #061321 50%,
            #030a12
        );

    color:var(--text);

    font-family:
        "Hind Siliguri",
        "Inter",
        sans-serif;

    overflow-x:hidden;

}

button,
textarea,
input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

a{
    color:inherit;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:6px;
    height:6px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#173b54;
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#205a7d;
}

/* =========================================================
   APP SHELL
========================================================= */

.app-shell{

    min-height:100vh;

    display:flex;
    flex-direction:column;

}

/* =========================================================
   HEADER
========================================================= */

.header{

    height:72px;

    position:sticky;
    top:0;

    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        0 max(
            15px,
            calc((100vw - 1180px)/2 + 15px)
        );

    background:
        rgba(3,12,22,.82);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-bottom:
        1px solid var(--border);

}

.brand{

    display:flex;
    align-items:center;

    gap:11px;

    min-width:0;

}

.brand-logo{

    width:42px;
    height:42px;

    flex-shrink:0;

    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #0075ff
        );

    color:#001522;

    font-size:22px;
    font-weight:800;

    box-shadow:
        0 0 35px
        rgba(0,200,255,.25);

}

.brand-logo::after{

    content:"";

    position:absolute;

    inset:1px;

    border-radius:12px;

    border:1px solid
        rgba(255,255,255,.25);

}

.brand-info{
    min-width:0;
}

.brand-title{

    font-family:"Inter",sans-serif;

    font-size:19px;

    font-weight:800;

    letter-spacing:-.5px;

    white-space:nowrap;

}

.brand-title .blue{
    color:var(--primary);
}

.brand-title .red{
    color:#ff4864;
}

.brand-subtitle{

    color:var(--muted);

    font-size:10px;

    margin-top:-2px;

    white-space:nowrap;

}

.header-actions{

    display:flex;
    align-items:center;
    gap:7px;

}

.icon-btn{

    width:41px;
    height:41px;

    border-radius:12px;

    border:1px solid var(--border);

    background:
        rgba(13,37,57,.75);

    color:#d8edf7;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;

}

.icon-btn:hover{

    transform:translateY(-2px);

    border-color:var(--border2);

    background:
        rgba(15,48,72,.95);

}

.icon-btn:active{
    transform:scale(.94);
}

/* =========================================================
   MAIN
========================================================= */

.main{

    width:100%;
    max-width:1180px;

    margin:auto;

    flex:1;

    display:grid;

    grid-template-columns:
        280px minmax(0,1fr);

    gap:15px;

    padding:15px;

}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    position:sticky;
    top:87px;

    height:
        calc(100vh - 102px);

    overflow-y:auto;

    padding:15px;

    border:
        1px solid var(--border);

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(12,35,54,.90),
            rgba(7,23,39,.90)
        );

    box-shadow:var(--shadow);

}

.side-profile{

    padding:14px;

    border:
        1px solid var(--border);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(17,48,72,.65),
            rgba(8,27,44,.65)
        );

    margin-bottom:15px;

}

.side-profile-top{

    display:flex;
    align-items:center;

    gap:10px;

}

.side-avatar{

    width:45px;
    height:45px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #00c8ff,
            #006eff
        );

    color:#001523;

}

.side-name{

    font-size:14px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

}

.side-status{

    display:flex;
    align-items:center;
    gap:5px;

    color:var(--muted);

    font-size:10px;

}

.online-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--success);

    box-shadow:
        0 0 10px
        rgba(16,185,129,.8);

}

.side-title{

    color:#6e8ba0;

    font-size:10px;

    font-weight:700;

    letter-spacing:1px;

    margin:
        16px 5px 8px;

}

.side-btn{

    width:100%;

    display:flex;
    align-items:center;

    gap:10px;

    padding:10px 11px;

    border:1px solid transparent;

    border-radius:11px;

    background:transparent;

    color:#c9dce7;

    cursor:pointer;

    text-align:left;

    transition:.2s;

    margin-bottom:4px;

    font-size:13px;

}

.side-btn:hover{

    background:
        rgba(0,200,255,.07);

    border-color:
        rgba(0,200,255,.15);

    color:#fff;

}

.side-btn.active{

    background:
        linear-gradient(
            135deg,
            rgba(0,200,255,.15),
            rgba(0,112,255,.10)
        );

    border-color:
        rgba(0,200,255,.25);

    color:var(--primary);

}

.side-icon{

    width:26px;
    height:26px;

    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.045);

}

/* =========================================================
   CHAT PANEL
========================================================= */

.chat-panel{

    min-width:0;

    min-height:
        calc(100vh - 102px);

    border:
        1px solid var(--border);

    border-radius:20px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(7,22,37,.94),
            rgba(4,15,27,.94)
        );

    box-shadow:var(--shadow);

    display:flex;
    flex-direction:column;

}

/* =========================================================
   AI TOP
========================================================= */

.ai-top{

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 16px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(10,29,47,.65);

}

.ai-identity{

    display:flex;
    align-items:center;
    gap:11px;

}

.ai-avatar{

    width:48px;
    height:48px;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;

    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #0070ff
        );

    color:#001523;

    box-shadow:
        0 0 28px
        rgba(0,200,255,.18);

}

.ai-name{

    font-size:18px;

    font-weight:800;

}

.ai-name span{
    color:var(--primary);
}

.ai-meta{

    display:flex;
    align-items:center;
    gap:6px;

    color:var(--muted);

    font-size:11px;

}

.status-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--success);

    box-shadow:
        0 0 8px
        rgba(16,185,129,.7);

}

.connection-badge{

    padding:6px 9px;

    border-radius:20px;

    background:
        rgba(16,185,129,.08);

    border:
        1px solid
        rgba(16,185,129,.20);

    color:#6ee7b7;

    font-size:10px;

}

/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-area{

    display:flex;

    gap:7px;

    overflow-x:auto;

    padding:10px 12px;

    border-bottom:
        1px solid var(--border);

    scrollbar-width:none;

}

.quick-area::-webkit-scrollbar{
    display:none;
}

.quick-btn{

    flex-shrink:0;

    display:flex;
    align-items:center;

    gap:6px;

    padding:8px 11px;

    border-radius:20px;

    border:
        1px solid var(--border);

    background:
        rgba(11,35,54,.8);

    color:#c9dce7;

    cursor:pointer;

    font-size:11px;

    transition:.2s;

}

.quick-btn:hover{

    color:#fff;

    border-color:
        rgba(0,200,255,.35);

    background:
        rgba(0,120,170,.13);

}

/* =========================================================
   CHAT
========================================================= */

.chat{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        18px 16px 130px;

    scroll-behavior:smooth;

}

.message{

    display:flex;

    margin-bottom:16px;

    animation:
        messageIn .25s ease;

}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.message.ai{
    justify-content:flex-start;
}

.message.user{
    justify-content:flex-end;
}

.message-holder{
    max-width:min(88%,760px);
}

.bubble{

    padding:13px 15px;

    border-radius:17px;

    font-size:14px;

    line-height:1.75;

    word-break:break-word;

    position:relative;

}

.ai .bubble{

    background:
        linear-gradient(
            145deg,
            rgba(16,45,69,.96),
            rgba(10,31,49,.96)
        );

    border:
        1px solid var(--border);

    border-bottom-left-radius:5px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.12);

}

.user .bubble{

    background:
        linear-gradient(
            135deg,
            var(--user1),
            var(--user2)
        );

    color:#fff;

    border-bottom-right-radius:5px;

    box-shadow:
        0 10px 28px
        rgba(0,130,210,.18);

}

.message-time{

    color:#5d788c;

    font-size:9px;

    margin-top:4px;

}

.user .message-time{
    text-align:right;
}

/* =========================================================
   MESSAGE ACTIONS
========================================================= */

.message-actions{

    display:flex;

    gap:5px;

    margin-top:6px;

    opacity:0;

    transition:.2s;

}

.message:hover .message-actions{
    opacity:1;
}

.msg-action{

    border:
        1px solid var(--border);

    background:
        rgba(10,29,45,.8);

    color:#8da8ba;

    padding:4px 7px;

    border-radius:7px;

    cursor:pointer;

    font-size:10px;

}

.msg-action:hover{
    color:var(--primary);
}

/* =========================================================
   LINKS
========================================================= */

.source-btn{

    display:inline-flex;

    align-items:center;

    gap:6px;

    margin-top:10px;

    padding:8px 11px;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #008fd0,
            #0067a4
        );

    color:#fff;

    text-decoration:none;

    font-size:11px;

    font-weight:700;

}

.source-btn:hover{

    background:
        linear-gradient(
            135deg,
            #00a9ef,
            #007cb9
        );

}

/* =========================================================
   TYPING
========================================================= */

.typing-wrap{

    display:none;

    padding:
        0 16px 12px;

}

.typing-wrap.show{
    display:block;
}

.typing{

    width:max-content;

    display:flex;
    align-items:center;
    gap:5px;

    padding:9px 12px;

    border-radius:13px;

    background:#0d263d;

    border:
        1px solid var(--border);

}

.typing span{

    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--primary);

    animation:
        typing 1s infinite;

}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-3px);
    }

}

/* =========================================================
   INPUT
========================================================= */

.input-area{

    position:relative;

    padding:
        10px 14px 13px;

    border-top:
        1px solid var(--border);

    background:
        linear-gradient(
            to top,
            rgba(4,15,27,1),
            rgba(5,17,29,.94)
        );

}

.input-row{

    display:flex;
    align-items:flex-end;

    gap:8px;

}

.voice-btn,
.send-btn{

    width:47px;
    height:47px;

    flex-shrink:0;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s;

}

.voice-btn{

    border:
        1px solid var(--border);

    background:#0d263d;

    color:#c9e5f3;

}

.voice-btn:hover{

    border-color:
        rgba(0,200,255,.35);

}

.voice-btn.listening{

    background:
        rgba(220,38,38,.20);

    border-color:
        #ef4444;

    color:#ff6b6b;

    animation:
        voicePulse 1.1s infinite;

}

@keyframes voicePulse{

    50%{
        box-shadow:
            0 0 0 7px
            rgba(239,68,68,.08);
    }

}

.send-btn{

    border:0;

    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #0078ff
        );

    color:#001523;

    font-weight:900;

    box-shadow:
        0 8px 25px
        rgba(0,153,255,.20);

}

.send-btn:hover{

    transform:
        translateY(-2px);

}

.message-input{

    width:100%;

    min-height:47px;
    max-height:135px;

    resize:none;

    outline:none;

    border:
        1px solid #214b65;

    border-radius:14px;

    padding:11px 13px;

    background:
        #030c17;

    color:#fff;

    font-size:14px;

    line-height:1.5;

    transition:.2s;

}

.message-input:focus{

    border-color:
        rgba(0,200,255,.55);

    box-shadow:
        0 0 0 3px
        rgba(0,200,255,.06);

}

.message-input::placeholder{
    color:#5f7788;
}

.input-hint{

    text-align:center;

    margin-top:6px;

    color:#536e81;

    font-size:9px;

}

/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    z-index:5000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

    background:
        rgba(0,4,10,.78);

    backdrop-filter:blur(10px);

}

.modal.show{
    display:flex;
}

.modal-card{

    width:min(96vw,760px);

    max-height:90vh;

    overflow:hidden;

    display:flex;
    flex-direction:column;

    border:
        1px solid var(--border2);

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #0b2136,
            #061524
        );

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.65);

    animation:
        modalIn .22s ease;

}

@keyframes modalIn{

    from{
        opacity:0;
        transform:translateY(15px) scale(.98);
    }

    to{
        opacity:1;
        transform:none;
    }

}

.modal-head{

    min-height:60px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 15px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(11,35,55,.7);

}

.modal-title{

    font-size:17px;
    font-weight:800;

}

.modal-title span{
    color:var(--primary);
}

.close-btn{

    width:35px;
    height:35px;

    border-radius:10px;

    border:
        1px solid var(--border);

    background:
        rgba(255,255,255,.04);

    color:#a9bdca;

    cursor:pointer;

    font-size:20px;

}

.close-btn:hover{

    color:#fff;

    border-color:
        rgba(239,68,68,.35);

}

.modal-body{

    padding:15px;

    overflow-y:auto;

}

/* =========================================================
   DASHBOARD STATS
========================================================= */

.stats-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

}

.stat{

    padding:13px 8px;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:
        rgba(4,19,32,.75);

    text-align:center;

}

.stat-value{

    font-family:"Inter",sans-serif;

    font-size:19px;

    font-weight:800;

    color:var(--primary);

}

.stat-label{

    margin-top:3px;

    color:var(--muted);

    font-size:10px;

}

/* =========================================================
   PROGRESS
========================================================= */

.progress-box{

    margin-top:12px;

    padding:13px;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:
        rgba(4,18,31,.75);

}

.progress-head{

    display:flex;
    justify-content:space-between;

    color:#cfe0ea;

    font-size:11px;

    margin-bottom:7px;

}

.progress{

    height:7px;

    border-radius:20px;

    overflow:hidden;

    background:#071421;

}

.progress-fill{

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #00c8ff,
            #0075ff
        );

}

/* =========================================================
   LIST
========================================================= */

.list-box{
    margin-top:12px;
}

.list-item{

    padding:12px;

    margin-bottom:8px;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:
        rgba(4,19,32,.72);

    transition:.2s;

}

.list-item.clickable{
    cursor:pointer;
}

.list-item:hover{

    border-color:
        rgba(0,200,255,.30);

    background:
        rgba(8,30,47,.9);

}

.list-title{

    color:#dff5ff;

    font-size:13px;

    font-weight:700;

}

.list-meta{

    color:#668397;

    font-size:10px;

    margin-top:3px;

}

.list-text{

    color:#abc1cf;

    font-size:12px;

    line-height:1.65;

    margin-top:7px;

}

/* =========================================================
   PROFILE
========================================================= */

.profile-card{

    display:flex;
    align-items:center;

    gap:12px;

    padding:13px;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:
        rgba(4,19,32,.75);

    margin-bottom:12px;

}

.profile-avatar{

    width:50px;
    height:50px;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #00c8ff,
            #006fff
        );

    color:#001522;

    font-weight:900;

}

.profile-name{

    font-size:15px;
    font-weight:800;

}

.profile-email{

    color:var(--muted);
    font-size:10px;

}

/* =========================================================
   QUESTION
========================================================= */

.question-card{

    padding:13px;

    margin-bottom:9px;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:
        rgba(4,19,32,.72);

}

.question-title{

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SAFE URL
========================================================= */

function safeURL(value){

    try{

        const url =
            new URL(
                String(value),
                window.location.href
            );

        if(
            url.protocol === "http:" ||
            url.protocol === "https:"
        ){

            return url.href;

        }

    }
    catch{}

    return "";

}


/* =========================================================
   TIME
========================================================= */

function getTime(){

    return new Date()
        .toLocaleTimeString(
            "bn-BD",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value)
        return "তারিখ নেই";

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "তারিখ নেই";

    }

    return date.toLocaleDateString(
        "bn-BD",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            () =>
                toast.classList.remove("show"),
            2500

}

onAuthStateChanged(

/* =========================================================

        ? "Firebase Student"

/* =========================================================
   LOAD FIREBASE
========================================================= */

async function loadFirebaseData(){

    try{

        if(currentUser){

            const snapshot =
                await get(
                    ref(
                        db,
                        `exam_attempts/${currentUser.uid}`
                    )
                );

            examData =
                snapshot.exists()
                ? snapshot.val()
                : {};

        }

        await loadPublicData();

        showToast(
            "Firebase data আপডেট হয়েছে ✓"
        );

    }
    catch(error){

        console.error(
            "Firebase Load:",
            error
        );

        showToast(
            "Firebase data লোড করা যায়নি"
        );

    }

}


/* =========================================================
   PUBLIC DATA
========================================================= */

async function loadPublicData(){

    try{

        const [
            noticeSnap,
            noteSnap
        ] =
        await Promise.all([

            get(
                ref(db,"notices")
            ),

            get(
                ref(db,"notes")
            )

        ]);


        notices =
            noticeSnap.exists()
            ? noticeSnap.val()
            : {};


        notes =
            noteSnap.exists()
            ? noteSnap.val()
            : {};

    }
    catch(error){

        console.error(
            "Public data:",
            error
        );

    }

}

function addMessageRaw(
    role,
    html,
    time=getTime(),
    save=true
){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${role}`;


    const holder =
        document.createElement("div");

    holder.className =
        "message-holder";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerHTML =
        html;


    const timeEl =
        document.createElement("div");

    timeEl.className =
        "message-time";

    timeEl.textContent =
        time;


    holder.appendChild(
        bubble
    );

    holder.appendChild(
        timeEl
    );


    if(role === "ai"){

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.className =
            "msg-action";

        copy.textContent =
            "Copy";


        copy.addEventListener(
            "click",
            () => {

                const text =
                    bubble.innerText;

                navigator
                    .clipboard
                    ?.writeText(text);

                showToast(
                    "উত্তর Copy হয়েছে ✓"
                );

            }
        );


        const speak =
            document.createElement("button");

        speak.className =
            "msg-action";

        speak.textContent =
            "🔊 Speak";


        speak.addEventListener(
            "click",
            () => {

                speakAI(
                    bubble.innerText
                );

            }
        );


        actions.appendChild(copy);

        actions.appendChild(speak);

        holder.appendChild(actions);

    }


    wrapper.appendChild(
        holder
    );


    chat.appendChild(
        wrapper
    );


    scrollChat();


    if(save){

        saveChat();

    }

}


function addAIMessage(html){

/* =========================================================
   PERFORMANCE ENGINE
========================================================= */

function getPerformance(){

    const exams =
        Object.values(
            examData || {}
        );


    let score = 0;

    let total = 0;

    let bestPercent = -1;

    let worstPercent = 101;

    let bestExam = "";

    let worstExam = "";

    const subjects = {};


    exams.forEach(exam => {

        const s =
            Number(exam.score) || 0;

        const t =
            Number(exam.total) || 0;


        score += s;

        total += t;


        const percent =
            t > 0
            ? s / t * 100
            : 0;


        if(percent > bestPercent){

            bestPercent =
                percent;

            bestExam =
                exam.examTitle ||
                "পরীক্ষা";

        }


        if(percent < worstPercent){

            worstPercent =
                percent;

            worstExam =
                exam.examTitle ||
                "পরীক্ষা";

        }


        const subject =
            exam.subject ||
            exam.subjectName ||
            "অন্যান্য";


        if(!subjects[subject]){

            subjects[subject] = {

                score:0,

                total:0,

                exams:0

            };

        }


        subjects[subject].score +=
            s;

        subjects[subject].total +=
            t;

        subjects[subject].exams++;

    });


    const accuracy =
        total
        ? score / total * 100
        : 0;


    return {

        exams:exams.length,

        score,

        total,

        accuracy,

        bestPercent:
            Math.max(
                0,
                bestPercent
            ),

        worstPercent:
            Math.min(
                100,
                worstPercent
            ),

        bestExam,

        worstExam,

        subjects

    };

}

/* =========================================================
   NOTES SEARCH
========================================================= */

function searchNotes(keyword=""){

    const query =
        String(keyword)
            .toLowerCase()
            .trim();


    const results =
        Object.entries(
            notes || {}
        )
        .filter(
            ([id,note]) => {

                const searchable = [

                    note?.title,

                    note?.subject,

                    note?.paper,

                    note?.chapter,

                    note?.textContent,

                    note?.description

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return (
                    !query ||
                    searchable.includes(query)
                );

            }
        );

/* =========================================================
   INTENT
========================================================= */

function detectIntent(text){

    const q =
        String(text)
            .toLowerCase()
            .trim();


    if(
        /performance|পারফরম্যান্স|accuracy|এক্যুরেসি|analysis|বিশ্লেষণ|আমার অবস্থা/
        .test(q)
    ){

        return "performance";

    }


    if(
        /history|হিস্টোরি|আগের পরীক্ষা|পুরনো পরীক্ষা|previous exam|my exams|exam history/
        .test(q)
    ){

        return "history";

    }


    if(
        /notice|নোটিশ|ঘোষণা|announcement|update|আপডেট/
        .test(q)
    ){

        return "notice";

    }


    if(
        /weakness|দুর্বল|দুর্বলতা|weak subject/
        .test(q)
    ){

        return "weakness";

    }


    if(
        /strength|শক্তিশালী|ভালো বিষয়|strong subject/
        .test(q)
    ){

        return "strength";

    }


    if(
        /notes|note|নোট|নোটস|chapter note|পড়ার নোট/
        .test(q)
    ){

        return "notes";

    }


    if(
        /hello|hi|hey|হ্যালো|আসসালামু|সালাম|কেমন আছো/
        .test(q)
    ){

        return "greeting";

    }


    return "general";

}


/* =========================================================
   LANGUAGE
========================================================= */

function detectLanguage(text){

    if(
        /[\u0980-\u09FF]/.test(text)
    ){

        return "bn";

    }


    if(
        /[\u0900-\u097F]/.test(text)
    ){

        return "hi";

    }


    if(
        /[\u0600-\u06FF]/.test(text)
    ){

        return "ur";

    }


    if(
        /[a-zA-Z]/.test(text)
    ){

        return "en";

    }


    return "unknown";

}

function extractNoteKeyword(text){

}

async function askAIBackend(question){

    if(!AI_API_URL){

        return null;

    }


    try{

        const response =
            await fetch(
                AI_API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                question,

                            question,

                            language:
                                detectLanguage(
                                    question
                                ),

                            context:
                                buildAIContext()

                        })

                }
            );


        if(!response.ok){

            throw new Error(
                `AI HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        return (
            data.answer ||
            data.response ||
            data.text ||
            data.message ||
            null
        );

    }
    catch(error){

        console.error(
            "AI Backend:",
            error
        );

        return null;

    }

}


/* =========================================================
   WIKIPEDIA
========================================================= */

async function askWikipedia(question){

    const language =
        detectLanguage(
            question
        );


    const primary =
        language === "bn"
        ? "bn"
        : "en";


    const first =
        await fetchWikipedia(
            question,
            primary
        );


    if(first){

        return first;

    }


    if(primary === "bn"){

        return await fetchWikipedia(
            question,
            "en"
        );

    }


    return null;

}


/* =========================================================
   WIKIPEDIA FETCH
========================================================= */

async function fetchWikipedia(
    question,
    language
){

    try{

        const api =
            `https://${language}.wikipedia.org/w/api.php`;


        const searchURL =
            api +
            "?action=query" +
            "&list=search" +
            "&srsearch=" +
            encodeURIComponent(question) +
            "&srlimit=3" +
            "&utf8=1" +
            "&format=json" +
            "&origin=*";


        const searchResponse =
            await fetch(
                searchURL
            );


        if(!searchResponse.ok){

            return null;

        }


        const searchData =
            await searchResponse.json();


        const results =
            searchData?.query?.search ||
            [];


        if(!results.length){

            return null;

        }


        const title =
            results[0].title;


        const extractURL =
            api +
            "?action=query" +
            "&prop=extracts" +
            "&exintro=1" +
            "&explaintext=1" +
            "&exchars=2200" +
            "&redirects=1" +
            "&titles=" +
            encodeURIComponent(title) +
            "&format=json" +
            "&origin=*";


        const extractResponse =
            await fetch(
                extractURL
            );


        if(!extractResponse.ok){

            return null;

        }


        const extractData =
            await extractResponse.json();


        const pages =
            extractData?.query?.pages ||
            {};


        const page =
            Object.values(
                pages
            )[0];


        const extract =
            page?.extract?.trim();


        if(
            !extract ||
            extract.length < 30
        ){

            return null;

        }


        const url =
            `https://${language}.wikipedia.org/wiki/` +
            encodeURIComponent(
                title.replace(
                    / /g,
                    "_"
                )
            );


        return {

            source:"Wikipedia",

            title,

            answer:extract,

            url

        };

    }
    catch(error){

        console.warn(
            "Wikipedia:",
            error
        );

        return null;

    }

}


/* =========================================================
   DUCKDUCKGO
========================================================= */

async function askDuckDuckGo(question){

    try{

        const url =
            "https://api.duckduckgo.com/" +
            "?q=" +
            encodeURIComponent(
                question
            ) +
            "&format=json" +
            "&no_html=1" +
            "&skip_disambig=1";


        const response =
            await fetch(
                url
            );


        if(!response.ok){

            return null;

        }


        const data =
            await response.json();


        let answer =
            data?.AbstractText ||
            data?.Answer ||
            data?.Definition ||
            "";


        let title =
            data?.Heading ||
            "DuckDuckGo Result";


        let sourceURL =
            data?.AbstractURL ||
            "";


        if(!answer){

            const topics =
                data?.RelatedTopics ||
                [];


            for(
                const topic of topics
            ){

                if(
                    topic?.Text
                ){

                    answer =
                        topic.Text;

                    sourceURL =
                        topic.FirstURL ||
                        "";

                    title =
                        topic.Text
                            .split(" - ")[0]
                            .slice(
                                0,
                                120
                            );

                    break;

                }

            }

        }


        if(
            !answer ||
            answer.trim().length < 30
        ){

            return null;

        }


        return {

            source:"DuckDuckGo",

            title,

            answer:
                answer.trim(),

            url:
                sourceURL

        };

    }
    catch(error){

        console.warn(
            "DuckDuckGo:",
            error
        );

        return null;

    }

}

/* =========================================================
   AI FORMAT
========================================================= */

function formatAIResponse(text){

    let safe =
        escapeHTML(
            text
        );


    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<b>$1</b>"
        );


    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );


    return safe;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(isSending){

        return;

    }


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    input.value =
        "";

    input.style.height =
        "47px";


    addUserMessage(
        text
    );


    setTyping(true);

    isSending = true;


    try{

        /* =================================================
           STEP 1 — LOCAL GAIVEX
        ================================================= */

        const local =
            localAI(
                text
            );


        if(
            local &&
            detectIntent(text) !==
            "general"
        ){

            await delay(
                220
            );


            addAIMessage(
                local.html
            );


            return;

        }


        /* =================================================
           STEP 2 — SECURE AI BACKEND
        ================================================= */

        const ai =
            await askAIBackend(
                text
            );


        if(ai){

            addAIMessage(
                formatAIResponse(
                    ai
                )
            );

            return;

        }


        /* =================================================
           STEP 3 — WIKIPEDIA
        ================================================= */

        const wikipedia =
            await askWikipedia(
                text
            );


        if(wikipedia){

            addAIMessage(
                formatPublicAnswer(
                    wikipedia
                )
            );

            return;

        }


        /* =================================================
           STEP 4 — DUCKDUCKGO
        ================================================= */

        const duck =
            await askDuckDuckGo(
                text
            );


        if(duck){

            addAIMessage(
                formatPublicAnswer(
                    duck
                )
            );

            return;

        }


        /* =================================================
           STEP 5 — GOOGLE
        ================================================= */

        addAIMessage(`

            <b>🔎 সরাসরি উত্তর পাওয়া যায়নি।</b>

            <br><br>

            GAIVEX database, AI backend,
            Wikipedia এবং DuckDuckGo—
            কোনো জায়গা থেকে নির্ভরযোগ্য
            সরাসরি উত্তর পাওয়া যায়নি।

            <br><br>

            আরও বিস্তারিত খুঁজতে:

            <br>

            ${googleSearch(text)}

        `);

    }
    catch(error){

        console.error(
            "Send:",
            error
        );


        addAIMessage(`

            ⚠️ <b>উত্তর সংগ্রহ করতে সমস্যা হয়েছে।</b>

            <br><br>

            আপনি চাইলে Google Search ব্যবহার করতে পারেন।

            <br>

            ${googleSearch(text)}

        `);

    }
    finally{

        isSending = false;

        setTyping(false);

    }

}

/* =========================================================
   VOICE INPUT
========================================================= */

function toggleVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        showToast(
            "এই Browser-এ Voice Input support নেই"
        );

        return;

    }


    if(isListening){

        recognition?.stop();

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "bn-BD";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
        () => {

            isListening =
                true;


            document
                .getElementById(
                    "voiceBtn"
                )
                .classList.add(
                    "listening"
                );


            showToast(
                "🎤 কথা বলুন..."
            );

        };


    recognition.onresult =
        event => {

            let transcript =
                "";


            for(
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ){

                transcript +=
                    event.results[i][0]
                        .transcript;

            }


            input.value =
                transcript;


            input.dispatchEvent(
                new Event(
                    "input"
                )
            );

        };


    recognition.onerror =
        error => {

            console.warn(
                "Voice:",
                error
            );


            showToast(
                "Voice Input-এ সমস্যা হয়েছে"
            );

        };


    recognition.onend =
        () => {

            isListening =
                false;


            document
                .getElementById(
                    "voiceBtn"
                )
                .classList.remove(
                    "listening"
                );

        };


    try{

        recognition.start();

    }
    catch(error){

        console.warn(
            error
        );

    }

}


document
    .getElementById(
        "voiceBtn"
    )
    .addEventListener(
        "click",
        toggleVoice
    );


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speakAI(text){

    if(
        !("speechSynthesis" in window)
    ){

        showToast(
            "এই Browser-এ Voice Output নেই"
        );

        return;

    }


    speechSynthesis.cancel();


    const clean =
        String(text)
            .replace(
                /<[^>]*>/g,
                ""
            )
            .slice(
                0,
                5000
            );


    const utter =
        new SpeechSynthesisUtterance(
            clean
        );


    const lang =
        detectLanguage(
            clean
        );


    if(lang === "bn"){

        utter.lang =
            "bn-BD";

    }
    else if(lang === "hi"){

        utter.lang =
            "hi-IN";

    }
    else if(lang === "ur"){

        utter.lang =
            "ur-PK";

    }
    else{

        utter.lang =
            "en-US";

    }


    utter.rate =
        .95;

    utter.pitch =
        1;


    speechSynthesis.speak(
        utter
    );

}

   KEYBOARD ESC
========================================================= */

document.addEventListener(

    event => {

        if(

);


/* =========================================================
   DELAY
========================================================= */

function delay(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}

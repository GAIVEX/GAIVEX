<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-chat: #090d16;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --user-msg: #312e81;
            --bot-msg: #1e293b;
            --border: #334155;
            --danger: #ef4444;
        }

        .light-mode {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-chat: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --user-msg: #e0e7ff;
            --bot-msg: #ffffff;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            background-color: var(--bg-chat);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        @media (min-width: 768px) {
            .chat-container {
                height: 90vh;
                border-radius: 24px;
                border: 1px solid var(--border);
                overflow: hidden;
            }
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: color-mix(in srgb, var(--bg-secondary) 95%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .brand i {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            position: relative;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .icon-btn:hover {
            background-color: var(--border);
            color: var(--text-primary);
        }

        /* Dropdown Menu */
        .dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            width: 180px;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 20;
        }

        .dropdown.show {
            display: flex;
        }

        .dropdown-item {
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background-color: var(--border);
        }

        /* Chat Messages Area */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .user .avatar {
            background-color: var(--accent);
            color: white;
        }

        .message-content {
            background-color: var(--bot-msg);
            padding: 14px 18px;
            border-radius: 20px;
            border-top-left-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .user .message-content {
            background-color: var(--user-msg);
            border-radius: 20px;
            border-top-right-radius: 4px;
        }

        /* Input Area */
        .input-container {
            padding: 16px 24px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border);
            position: relative;
        }

        .input-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 16px;
            gap: 12px;
        }

        .input-box:focus-within {
            border-color: var(--accent);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: none;
            height: 24px;
            max-height: 120px;
            outline: none;
        }

        .send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Attachment Menu */
        .attach-menu {
            position: absolute;
            bottom: 80px;
            left: 24px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            display: none;
            gap: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .attach-menu.show {
            display: flex;
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 8px 12px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Navbar -->
        <div class="navbar">
            <div class="brand">
                <i class="fa-solid fa-robot"></i>
                <span>Nexus AI</span>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" id="themeToggle" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="icon-btn menu-btn" onclick="toggleDropdown()" title="Menu">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>

                <!-- Dropdown Menu -->
                <div class="dropdown" id="dropdownMenu">
                    <button class="dropdown-item" onclick="clearChat()">
                        <i class="fa-solid fa-trash"></i> Clear Chat
                    </button>
                    <button class="dropdown-item" onclick="exportChat()">
                        <i class="fa-solid fa-download"></i> Export Chat
                    </button>
                </div>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-content">
                    Hello! How can I help you today?
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <!-- Attachment Options -->
            <div class="attach-menu" id="attachMenu">
                <button class="icon-btn" title="Upload Image"><i class="fa-solid fa-image"></i></button>
                <button class="icon-btn" title="Upload Document"><i class="fa-solid fa-file"></i></button>
            </div>

            <div class="input-box">
                <button class="icon-btn" id="attachBtn" onclick="toggleAttachMenu()" title="Attach">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <textarea id="userInput" placeholder="Type a message..." rows="1" oninput="autoResize(this)"></textarea>
                <button class="send-btn" onclick="sendMessage()" title="Send">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Toggle Dark/Light Theme
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const icon = themeToggle.querySelector('i');
            if (document.body.classList.contains('light-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        });

        // Toggle Dropdown Menu
        function toggleDropdown() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        // Toggle Attachment Menu
        function toggleAttachMenu() {
            document.getElementById('attachMenu').classList.toggle('show');
        }

        // Auto-resize Textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Send Message
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (message !== '') {
                // Add User Message
                appendMessage(message, 'user');
                input.value = '';
                input.style.height = 'auto';

                // Show Typing Indicator
                showTypingIndicator();

                // Simulate AI Response
                setTimeout(() => {
                    removeTypingIndicator();
                    appendMessage("This is a simulated response from Nexus AI.", 'bot');
                }, 1500);
            }
        }

        // Append Message to UI
        function appendMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const avatar = document.createElement('div');
            avatar.classList.add('avatar');
            avatar.innerHTML = sender === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const content = document.createElement('div');
            content.classList.add('message-content');
            content.innerText = text;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatMessages.appendChild(messageDiv);

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Show Typing Indicator
        function showTypingIndicator() {
            const chatMessages = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('message', 'bot');
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="message-content typing">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Remove Typing Indicator
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Clear Chat
        function clearChat() {
            document.getElementById('chatMessages').innerHTML = '';
            toggleDropdown();
        }

        // Export Chat
        function exportChat() {
            alert('Exporting chat history...');
            toggleDropdown();
        }

        // Send message on Enter key (Shift+Enter for new line)
        document.getElementById('userInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Close dropdown/attach menu when clicking elsewhere
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('dropdownMenu');
            const menuBtn = e.target.closest('.menu-btn');
            if (menu && menu.classList.contains('show') && !menu.contains(e.target) && !menuBtn) {
                menu.classList.remove('show');
            }

            const attachMenu = document.getElementById('attachMenu');
            const attachBtn = document.getElementById('attachBtn');
            if (attachMenu && attachMenu.classList.contains('show') && !attachMenu.contains(e.target) && (!attachBtn || !attachBtn.contains(e.target))) {
                attachMenu.classList.remove('show');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#061426">

<title>GAIVEX AI — Ultimate Smart Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
    --bg:#061426;
    --card:#0d243b;
    --border:#214561;
    --primary:#00bfff;
    --text:#eef8ff;
    --muted:#8fa8bc;
}
html,body{width:100%;min-height:100%;}
body{background:var(--bg);color:var(--text);font-family:"Hind Siliguri","Inter",sans-serif;overflow-x:hidden;}
.header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:rgba(5,19,35,.94);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1000;backdrop-filter:blur(14px);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-logo{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#00bfff,#006ca5);font-size:22px;}
.brand-title{font-size:21px;font-weight:700;color:var(--primary);}
.brand-title span{color:#ff3b57;}
.header-actions{display:flex;align-items:center;gap:7px;}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:rgba(15,43,68,.9);color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;}
.app{width:100%;max-width:1000px;margin:auto;min-height:calc(100vh - 68px);display:flex;flex-direction:column;}
.ai-profile{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid var(--border);background:rgba(8,27,48,.72);}
.ai-avatar{width:55px;height:55px;border-radius:50%;background:linear-gradient(135deg,#00bfff,#0074aa);display:flex;align-items:center;justify-content:center;font-size:29px;}
.ai-name{font-size:20px;color:var(--primary);font-weight:700;}
.ai-status{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#10b981;}
.quick-area{padding:10px 12px;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
.quick-area::-webkit-scrollbar{display:none;}
.quick-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;margin-right:6px;border-radius:20px;border:1px solid var(--border);background:#0c2238;color:#d8edf8;font-family:inherit;cursor:pointer;font-size:12px;}
.chat{flex:1;padding:15px 12px 130px;overflow-y:auto;scroll-behavior:smooth;}
.message{display:flex;margin-bottom:16px;}
.message.user{justify-content:flex-end;}
.message.ai{justify-content:flex-start;}
.bubble{max-width:min(88%,760px);padding:13px 15px;border-radius:16px;line-height:1.7;font-size:15px;word-wrap:break-word;}
.user .bubble{background:linear-gradient(135deg,#009fe3,#007db5);border-bottom-right-radius:4px;color:white;}
.ai .bubble{background:linear-gradient(145deg,#102c46,#0d243b);border:1px solid var(--border);border-bottom-left-radius:4px;}
.message-time{font-size:10px;color:#718ca0;margin-top:4px;}
.typing{display:none;align-items:center;gap:5px;margin:0 0 15px 4px;}
.typing.show{display:flex;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:typing 1s infinite;}
@keyframes typing{0%,100%{opacity:.25;transform:translateY(0);}50%{opacity:1;transform:translateY(-4px);}}
.search-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 13px;background:#008fd0;color:white;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;}
.input-area{position:fixed;left:0;right:0;bottom:0;z-index:900;background:linear-gradient(to top,#061426 75%,rgba(6,20,38,.93));padding:10px max(12px, calc((100vw - 1000px)/2 + 12px)) 15px;border-top:1px solid var(--border);}
.input-row{display:flex;align-items:flex-end;gap:8px;}
.send-btn{width:48px;height:48px;flex-shrink:0;border-radius:14px;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#00c7ff,#008dcc);color:#001827;font-weight:bold;}
.message-input{flex:1;min-height:48px;max-height:130px;resize:none;border-radius:15px;border:1px solid #24617d;background:#020d1c;color:white;padding:12px 14px;outline:none;font-family:inherit;font-size:15px;}
.input-hint{text-align:center;color:#617d92;font-size:11px;margin-top:5px;}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%) translateY(20px);background:#102c46;border:1px solid var(--border);color:white;padding:9px 15px;border-radius:10px;opacity:0;transition:.25s;z-index:10000;font-size:13px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
code{background:rgba(0,191,255,0.15);padding:2px 6px;border-radius:4px;color:#00e5ff;font-family:monospace;}
</style>
</head>
<body>

<header class="header">
    <div class="brand">
        <div class="brand-logo">🤖</div>
        <div class="brand-title">GAIVEX<span>.</span>AI</div>
    </div>
    <div class="header-actions">
        <button class="icon-btn" onclick="refreshFirebaseData()" title="Refresh">🔄</button>
        <button class="icon-btn" onclick="clearChat()" title="Clear chat">🗑️</button>
    </div>
</header>

<div class="app">
    <section class="ai-profile">
        <div class="ai-avatar">🤖</div>
        <div>
            <div class="ai-name">GAIVEX AI (Smart Assistant)</div>
            <div class="ai-status">
                <span class="status-dot"></span>
                <span id="aiStatus">সিস্টেম প্রস্তুত...</span>
            </div>
        </div>
    </section>

    <div class="quick-area">
        <button class="quick-btn" onclick="quickAsk('আমার Performance কেমন?')">📊 Performance</button>
        <button class="quick-btn" onclick="quickAsk('সর্বশেষ Notice কী?')">📢 Notices</button>
        <button class="quick-btn" onclick="quickAsk('বাংলাদেশের মুদ্রার নাম কি')">💱 মুদ্রা</button>
        <button class="quick-btn" onclick="quickAsk('রংপুর সম্পর্কে বলো')">🏙️ রংপুর</button>
    </div>

    <main id="chat" class="chat"></main>

    <div id="typing" class="typing">
        <span></span><span></span><span></span>
    </div>
</div>

<div class="input-area">
    <div class="input-row">
        <textarea id="messageInput" class="message-input" rows="1" placeholder="আপনার প্রশ্ন বা সমস্যা এখানে লিখুন..." autocomplete="off"></textarea>
        <button class="send-btn" onclick="sendMessage()" title="Send">➤</button>
    </div>
    <div class="input-hint">Enter = পাঠান • Shift + Enter = নতুন লাইন</div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
    authDomain: "gaivexexam.firebaseapp.com",
    databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
    projectId: "gaivexexam",
    storageBucket: "gaivexexam.firebasestorage.app",
    messagingSenderId: "956204530190",
    appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let currentUser = null;
let examData = {};
let notices = {};
let notes = {};

function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function getTime(){
    return new Date().toLocaleTimeString("bn-BD", { hour:"2-digit", minute:"2-digit" });
}

window.showToast = function(message){
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
};

onAuthStateChanged(auth, async user => {
    currentUser = user;
    if(user){
        document.getElementById("aiStatus").textContent = `${user.displayName || "Student"} • Connected`;
        await loadFirebaseData();
    } else {
        document.getElementById("aiStatus").textContent = "Guest Mode";
        await loadPublicData();
    }
});

async function loadFirebaseData(){
    try{
        if(currentUser){
            const examSnap = await get(ref(db, `exam_attempts/${currentUser.uid}`));
            examData = examSnap.exists() ? examSnap.val() : {};
        }
        await loadPublicData();
    }catch(error){ console.error(error); }
}

async function loadPublicData(){
    try{
        const noticeSnap = await get(ref(db, "notices"));
        notices = noticeSnap.exists() ? noticeSnap.val() : {};
        const noteSnap = await get(ref(db, "notes"));
        notes = noteSnap.exists() ? noteSnap.val() : {};
    }catch(error){ console.error(error); }
}

window.refreshFirebaseData = async function(){
    await loadFirebaseData();
    showToast("ডাটা সিঙ্ক সফল হয়েছে");
};

const CHAT_KEY = "GAIVEX_AI_ULTRA_V7";

function saveChat(){
    const messages = [...document.querySelectorAll(".message")].map(el => ({
        role: el.classList.contains("user") ? "user" : "ai",
        html: el.querySelector(".bubble")?.innerHTML || "",
        time: el.querySelector(".message-time")?.textContent || ""
    }));
    localStorage.setItem(CHAT_KEY, JSON.stringify(messages.slice(-100)));
}

function loadChat(){
    const saved = localStorage.getItem(CHAT_KEY);
    if(!saved){
        addAIMessage(`👋 <b>আসসালামু আলাইকুম!</b><br><br>আমি <b>GAIVEX AI</b>। আপনার পোর্টালে থাকা তথ্যসহ যেকোনো শিক্ষামূলক এবং সাধারণ বিজ্ঞানের প্রশ্নের নির্ভুল উত্তর দিতে আমি প্রস্তুত। বলুন কীভাবে সাহায্য করতে পারি?`);
        return;
    }
    try{
        JSON.parse(saved).forEach(m => addMessageRaw(m.role, m.html, m.time, false));
    }catch{ localStorage.removeItem(CHAT_KEY); }
}

function addMessageRaw(role, html, time, save=true){
    const chat = document.getElementById("chat");
    const wrapper = document.createElement("div");
    wrapper.className = `message ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = html;
    const timeEl = document.createElement("div");
    timeEl.className = "message-time";
    timeEl.textContent = time || getTime();
    const holder = document.createElement("div");
    holder.appendChild(bubble);
    holder.appendChild(timeEl);
    wrapper.appendChild(holder);
    chat.appendChild(wrapper);
    chat.scrollTop = chat.scrollHeight;
    if(save) saveChat();
}

window.addAIMessage = function(html){ addMessageRaw("ai", html); };
function addUserMessage(text){ addMessageRaw("user", escapeHTML(text)); }

window.clearChat = function(){
    if(!confirm("চ্যাট হিস্টোরি মুছে ফেলতে চান?")) return;
    localStorage.removeItem(CHAT_KEY);
    document.getElementById("chat").innerHTML="";
    addAIMessage("🧹 নতুন চ্যাট সেশন শুরু হয়েছে।");
};

function setTyping(show){
    document.getElementById("typing").classList.toggle("show", show);
}

function getPerformance(){
    const exams = Object.values(examData || {});
    let score=0, total=0;
    const subjects={};
    exams.forEach(exam=>{
        const s = Number(exam.score)||0;
        const t = Number(exam.total)||0;
        score += s; total += t;
        const subject = exam.subject || exam.subjectName || "অন্যান্য";
        if(!subjects[subject]) subjects[subject]={ score:0, total:0, exams:0 };
        subjects[subject].score += s;
        subjects[subject].total += t;
        subjects[subject].exams++;
    });
    return { exams:exams.length, score, total, accuracy: total ? (score/total*100) : 0, subjects };
}

function searchDatabaseNotes(query){
    const q = query.toLowerCase();
    const list = Object.entries(notes || {});
    const matches = list.filter(([id, note])=>{
        const text = [note.title, note.subject, note.chapter, note.textContent].filter(Boolean).join(" ").toLowerCase();
        return text.includes(q);
    });
    if(!matches.length) return null;
    let html = "<b>📚 পোর্টালে প্রাপ্ত সম্পর্কিত নোটস:</b><br><br>";
    matches.slice(0, 3).forEach(([id, note]) => {
        html += `📌 <b>${escapeHTML(note.title || "নোট")}</b><br>${escapeHTML(note.textContent || "").slice(0, 250)}...<br><br>`;
    });
    return html;
}

function formatMarkdown(text) {
    if(!text) return "";
    return text
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.*?)\*/g, '<i>$1</i>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^\s*[\-\*]\s+(.*)$/gim, '• $1')
        .replace(/\n/g, '<br>');
}

// DuckDuckGo Instant Answer API
async function fetchDuckDuckGoAnswer(query) {
    try {
        const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.AbstractText) {
            return `<b>🦆 DuckDuckGo থেকে সংগৃহীত:</b><br><br>${escapeHTML(data.AbstractText)}`;
        }
    } catch (e) {
        console.error("DuckDuckGo Error:", e);
    }
    return null;
}

// মূল উত্তর নির্ধারণকারী পাইপলাইন
async function generateSmartAnswer(query){
    const q = query.toLowerCase().trim();

    // ==========================================
    // ১ম ধাপ: Firebase Database (পারফরম্যান্স, নোটিশ ও নোটস)
    // ==========================================
    if(q.includes("performance") || q.includes("পারফরম্যান্স") || q.includes("রেজাল্ট") || q.includes("স্কোর")){
        if(!currentUser) return "🔐 আপনার পারফরম্যান্স দেখতে প্রথমে পোর্টালে লগইন করুন।";
        const p = getPerformance();
        if(!p.exams) return "📊 আপনার কোনো পরীক্ষার ডেটা এই মুহূর্তে ডাটাবেসে পাওয়া যায়নি।";
        return `<b>📊 আপনার পারফরম্যান্স সারাংশ:</b><br><br>📝 মোট পরীক্ষা: <b>${p.exams}</b> টি<br>🎯 প্রাপ্ত মোট নম্বর: <b>${p.score}/${p.total}</b><br>📈 সঠিকতার হার: <b>${p.accuracy.toFixed(1)}%</b>`;
    }

    if(q.includes("notice") || q.includes("নোটিশ")){
        const list = Object.values(notices || {});
        if(!list.length) return "📢 বর্তমানে কোনো নতুন নোটিশ নেই।";
        let html = "<b>📢 সর্বশেষ নোটিশসমূহ:</b><br><br>";
        list.slice(0, 5).forEach(n => {
            html += `📌 <b>${escapeHTML(n.title||"নোটিশ")}</b><br>${escapeHTML(n.description||"")}<br><br>`;
        });
        return html;
    }

    const noteResult = searchDatabaseNotes(q);
    if(noteResult) return noteResult;

    // ==========================================
    // ২য় ধাপ: Cloudflare Worker (Gemini AI API)
    // ==========================================
    try {
        const response = await fetch("https://bold-sunset-8965.gaiyumtamim.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: query })
        });
        
        if (response.ok) {
            const data = await response.json();
            if (data.success && data.text) {
                return formatMarkdown(data.text);
            }
        }
    } catch (error) {
        console.error("Gemini Worker Error:", error);
    }

    // ==========================================
    // ৩য় ধাপ: Wikipedia API Search
    // ==========================================
    try {
        const wikiUrl = `https://bn.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        const res = await fetch(wikiUrl);
        const data = await res.json();
        if(data?.query?.search?.length > 0){
            const item = data.query.search[0];
            let cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
            return `<b>📖 উইকিপিডিয়া থেকে সংগৃহীত তথ্য (${item.title}):</b><br><br>${cleanSnippet}…`;
        }
    } catch(e) {
        console.error("Wiki Fetch Error:", e);
    }

    // ==========================================
    // ৪র্থ ধাপ: DuckDuckGo Search API
    // ==========================================
    const ddgAnswer = await fetchDuckDuckGoAnswer(query);
    if (ddgAnswer) return ddgAnswer;

    // ==========================================
    // ৫ম ধাপ: Google Search Link (ব্যাকআপ)
    // ==========================================
    const googleUrl = "https://www.google.com/search?q=" + encodeURIComponent(query);
    return `আপনার প্রশ্নটির সরাসরি উত্তর কোথাও পাওয়া যায়নি। বিস্তারিত জানতে নিচের লিঙ্কে ক্লিক করুন:<br><br><a href="${googleUrl}" target="_blank" rel="noopener noreferrer" class="search-link">🔎 গুগলে সার্চ করুন</a>`;
}

window.sendMessage = async function(){
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if(!text) return;
    input.value="";
    input.style.height="48px";
    addUserMessage(text);
    setTyping(true);

    let answer = await generateSmartAnswer(text);

    setTyping(false);
    addAIMessage(answer);
};

window.quickAsk = function(text){
    document.getElementById("messageInput").value = text;
    sendMessage();
};

document.getElementById("messageInput").addEventListener("keydown", function(event){
    if(event.key==="Enter" && !event.shiftKey){
        event.preventDefault();
        sendMessage();
    }
});

document.getElementById("messageInput").addEventListener("input", function(){
    this.style.height = "48px";
    this.style.height = Math.min(this.scrollHeight, 130) + "px";
});

loadChat();
</script>

</body>
</html>

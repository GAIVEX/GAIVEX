<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIVEX AI - Intelligent Assistant</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 10px;
        }

        /* Header Design */
        .chat-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bot-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .bot-info h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .bot-info p {
            font-size: 12px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bot-info p::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #38bdf8;
        }

        /* Chat Body / Messages Box */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar {
            width: 5px;
        }
        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: rgba(255, 255, 255, 0.08);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        /* Typing Indicator Animation */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: #a855f7;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Footer / Input Box */
        .chat-footer {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-footer input {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 18px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .chat-footer input:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .chat-footer button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .chat-footer button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.6);
        }

        .chat-footer button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="bot-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="bot-info">
                <h2>GAIVEX AI</h2>
                <p>Online & Ready</p>
            </div>
        </div>

        <!-- Chat Body -->
        <div class="chat-body" id="chatBody">
            <div class="message bot">হ্যালো! আমি GAIVEX AI। আজ আপনাকে কীভাবে সাহায্য করতে পারি?</div>
        </div>

        <!-- Typing Animation -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Footer Input -->
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="আপনার বার্তা এখানে লিখুন..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // আপনার দেওয়া এপিআই কি এখানে সেট করা হলো
        const API_KEY = "AQ.Ab8RN6KNvdknY-mTN7VwVkp0ASpXBZH5-U4Derak3-gByoTnQA";
        
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatBody = document.getElementById("chatBody");
            const typingIndicator = document.getElementById("typingIndicator");
            
            const userText = inputField.value.trim();
            if (!userText) return;

            // ইউজারের মেসেজ স্ক্রিনে যোগ করা
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user";
            userMsgDiv.innerText = userText;
            chatBody.appendChild(userMsgDiv);

            inputField.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            // টাইপিং অ্যানিমেশন দেখানো
            typingIndicator.style.display = "block";
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                // জেমিনি এপিআই কল (gemini-1.5-flash মডেল ব্যবহার করা হয়েছে)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: userText }]
                        }]
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = "none";

                let botReply = "দুঃখিত, কোনো সমস্যা হয়েছে। আবার চেষ্টা করুন।";
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    botReply = data.candidates[0].content.parts[0].text;
                }

                // বটের রিপ্লাই স্ক্রিনে যোগ করা
                const botMsgDiv = document.createElement("div");
                botMsgDiv.className = "message bot";
                botMsgDiv.innerText = botReply;
                chatBody.appendChild(botMsgDiv);
                
            } catch (error) {
                typingIndicator.style.display = "none";
                const errorMsgDiv = document.createElement("div");
                errorMsgDiv.className = "message bot";
                errorMsgDiv.innerText = "সংযোগ স্থাপন করতে সমস্যা হচ্ছে। ইন্টারনেট কানেকশন চেক করুন।";
                chatBody.appendChild(errorMsgDiv);
            }

            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GAIVEX.AI — AI Student Assistant</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#031426;
    --bg2:#061a2d;
    --panel:#0b2035;
    --panel2:#112b43;
    --border:#29445c;
    --blue:#00bfff;
    --blue2:#008fd1;
    --cyan:#16d9ff;
    --white:#f4f8ff;
    --text:#d8e4ef;
    --muted:#91a6b9;
    --user:#00a8e8;
    --green:#16e0b0;
    --danger:#ff5874;
}

html,body{
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:
        "Noto Sans Bengali",
        "Noto Sans",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
}

body{
    overflow:hidden;
}

/* ================= HEADER ================= */

.header{
    height:76px;
    background:#07182b;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
}

.logo{
    font-size:32px;
    font-weight:900;
    letter-spacing:-1px;
    color:var(--blue);
}

.logo span{
    color:#ff315c;
}

.header-right{
    display:flex;
    gap:10px;
}

.icon-btn{
    width:48px;
    height:48px;
    border-radius:15px;
    border:1px solid var(--border);
    background:#13283d;
    color:white;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon-btn:active{
    transform:scale(.94);
}

/* ================= APP ================= */

.app{
    position:fixed;
    top:76px;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    flex-direction:column;
}

/* ================= AI BAR ================= */

.ai-bar{
    min-height:116px;
    background:#061a2d;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:18px;
    padding:18px 28px;
}

.robot{
    width:78px;
    height:78px;
    min-width:78px;
    border-radius:50%;
    background:#05aee8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:46px;
    box-shadow:0 0 28px rgba(0,191,255,.25);
}

.ai-info h1{
    color:var(--blue);
    font-size:28px;
    font-weight:900;
}

.ai-info p{
    color:var(--muted);
    margin-top:5px;
    font-size:16px;
}

/* ================= QUICK MENU ================= */

.quick-wrap{
    background:#06192b;
    border-bottom:1px solid var(--border);
    padding:10px 18px;
    overflow-x:auto;
    scrollbar-width:none;
}

.quick-wrap::-webkit-scrollbar{
    display:none;
}

.quick-menu{
    display:flex;
    gap:10px;
    width:max-content;
}

.quick-btn{
    border:1px solid #314b61;
    background:#132a40;
    color:#d8e4ef;
    border-radius:25px;
    padding:10px 18px;
    font-size:15px;
    white-space:nowrap;
    cursor:pointer;
}

.quick-btn:hover{
    border-color:var(--blue);
    color:var(--blue);
}

.quick-btn:active{
    transform:scale(.97);
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    overflow-y:auto;
    padding:24px 28px 130px;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#28475e;
    border-radius:10px;
}

.welcome{
    text-align:center;
    padding:35px 10px;
    color:var(--muted);
}

.welcome .big{
    font-size:48px;
    margin-bottom:10px;
}

.welcome h2{
    color:var(--blue);
    font-size:25px;
    margin-bottom:7px;
}

.message-row{
    display:flex;
    margin-bottom:18px;
    width:100%;
}

.message-row.user{
    justify-content:flex-end;
}

.message-row.ai{
    justify-content:flex-start;
}

.message{
    max-width:min(760px,88%);
    padding:17px 20px;
    border-radius:22px;
    line-height:1.7;
    font-size:17px;
    word-wrap:break-word;
    overflow-wrap:anywhere;
}

.user .message{
    background:linear-gradient(135deg,#009fe0,#00b8ed);
    color:white;
    border-bottom-right-radius:5px;
    box-shadow:0 7px 20px rgba(0,174,239,.15);
}

.ai .message{
    background:#112b43;
    border:1px solid #29475e;
    color:#e0eaf3;
    border-bottom-left-radius:5px;
}

.ai-title{
    color:var(--blue);
    font-weight:900;
    margin-bottom:8px;
    font-size:18px;
}

/* ================= SEARCH CARD ================= */

.search-card{
    margin-top:12px;
    background:#0c243a;
    border:1px solid #24506d;
    border-radius:17px;
    padding:13px;
}

.search-label{
    color:#a8bbca;
    font-size:14px;
    margin-bottom:9px;
}

.search-btn{
    width:100%;
    min-height:48px;
    border:1px solid var(--blue);
    border-radius:13px;
    background:#06243a;
    color:var(--blue);
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.search-btn:active{
    transform:scale(.98);
    background:#0a324c;
}

/* ================= TYPING ================= */

.typing{
    display:flex;
    gap:6px;
    align-items:center;
    padding:5px 0;
}

.dot{
    width:8px;
    height:8px;
    background:#00bfff;
    border-radius:50%;
    animation:bounce 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{transform:translateY(0);opacity:.5}
    30%{transform:translateY(-5px);opacity:1}
}

/* ================= INPUT ================= */

.input-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    background:#06192b;
    border-top:1px solid var(--border);
    padding:12px 18px 16px;
    z-index:50;
}

.input-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.voice-btn{
    width:62px;
    height:62px;
    min-width:62px;
    border-radius:17px;
    border:1px solid #38546a;
    background:#142d43;
    color:#dce8f1;
    font-size:28px;
    cursor:pointer;
}

.voice-btn.recording{
    background:#8b1d38;
    border-color:#ff5577;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        box-shadow:0 0 0 7px rgba(255,80,110,.12);
    }
}

.input-box{
    flex:1;
    min-width:0;
}

textarea{
    width:100%;
    height:62px;
    resize:none;
    border-radius:17px;
    border:2px solid #29445c;
    background:#020c19;
    color:white;
    padding:17px 16px;
    font-size:17px;
    outline:none;
    font-family:inherit;
}

textarea:focus{
    border-color:var(--blue);
    box-shadow:0 0 15px rgba(0,191,255,.1);
}

textarea::placeholder{
    color:#71869a;
}

.send-btn{
    width:62px;
    height:62px;
    min-width:62px;
    border:none;
    border-radius:17px;
    background:linear-gradient(135deg,#00aee9,#08c9ee);
    color:#00253a;
    font-size:30px;
    font-weight:900;
    cursor:pointer;
}

.send-btn:active{
    transform:scale(.94);
}

.hint{
    color:#71869a;
    font-size:12px;
    margin-top:7px;
    padding-left:8px;
}

/* ================= SETTINGS ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:500;
}

.overlay.show{
    display:flex;
}

.settings{
    width:min(600px,100%);
    background:#0b2035;
    border:1px solid #35536b;
    border-bottom:none;
    border-radius:25px 25px 0 0;
    padding:22px;
}

.settings-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.settings h2{
    color:var(--blue);
}

.close{
    background:#152e44;
    border:1px solid var(--border);
    color:white;
    width:42px;
    height:42px;
    border-radius:12px;
    font-size:20px;
}

.setting{
    margin-bottom:17px;
}

.setting label{
    display:block;
    color:#b8c9d7;
    margin-bottom:8px;
}

select{
    width:100%;
    height:50px;
    border-radius:13px;
    border:1px solid var(--border);
    background:#06192b;
    color:white;
    padding:0 12px;
    font-size:15px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        height:76px;
        padding:0 18px;
    }

    .logo{
        font-size:29px;
    }

    .header-right{
        display:none;
    }

    .ai-bar{
        min-height:100px;
        padding:15px 20px;
    }

    .robot{
        width:65px;
        height:65px;
        min-width:65px;
        font-size:38px;
    }

    .ai-info h1{
        font-size:25px;
    }

    .ai-info p{
        font-size:14px;
    }

    .chat{
        padding:18px 18px 130px;
    }

    .message{
        max-width:91%;
        font-size:16px;
        padding:15px 17px;
    }

    .input-area{
        padding:10px 12px 13px;
    }

    .voice-btn,
    .send-btn{
        width:58px;
        min-width:58px;
        height:58px;
    }

    textarea{
        height:58px;
        font-size:16px;
        padding:15px 12px;
    }

    .hint{
        font-size:11px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">
    <div class="logo">
        GAIVEX<span>.</span>AI
    </div>

    <div class="header-right">
        <button class="icon-btn" onclick="openPortal()">🎓</button>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
</header>


<!-- ================= APP ================= -->

<main class="app">

    <!-- AI HEADER -->

    <section class="ai-bar">

        <div class="robot">🤖</div>

        <div class="ai-info">
            <h1>GAIVEX AI</h1>
            <p id="statusText">আপনার প্রশ্নের অপেক্ষায়...</p>
        </div>

    </section>


    <!-- QUICK MENU -->

    <div class="quick-wrap">

        <div class="quick-menu">

            <button class="quick-btn" onclick="quickAsk('আমার Performance দেখাও')">
                📊 Performance
            </button>

            <button class="quick-btn" onclick="quickAsk('আমার Exam History দেখাও')">
                📜 Exam History
            </button>

            <button class="quick-btn" onclick="quickAsk('নতুন Notices দেখাও')">
                📢 Notices
            </button>

            <button class="quick-btn" onclick="quickAsk('আমার Notes দেখাও')">
                📚 Notes
            </button>

            <button class="quick-btn" onclick="quickAsk('Admission পরীক্ষার গুরুত্বপূর্ণ তথ্য দাও')">
                🎓 Admission
            </button>

            <button class="quick-btn" onclick="quickAsk('GAIVEX সম্পর্কে বলো')">
                🤖 GAIVEX AI
            </button>

        </div>

    </div>


    <!-- CHAT -->

    <section class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="big">🤖</div>

            <h2>GAIVEX AI Assistant</h2>

            <p>
                বাংলা, English এবং আরও অনেক ভাষায় প্রশ্ন করুন।
            </p>

        </div>

    </section>


    <!-- INPUT -->

    <section class="input-area">

        <div class="input-row">

            <button
                id="voiceBtn"
                class="voice-btn"
                onclick="startVoice()"
                title="Voice Input">
                🎤
            </button>

            <div class="input-box">

                <textarea
                    id="question"
                    placeholder="আপনার প্রশ্ন লিখুন..."
                    autocomplete="off"
                    spellcheck="true"></textarea>

            </div>

            <button
                class="send-btn"
                onclick="sendMessage()"
                title="Send">
                ➤
            </button>

        </div>

        <div class="hint">
            Enter চাপলে প্রশ্ন পাঠানো যাবে • 🎤 Voice Input supported
        </div>

    </section>

</main>


<!-- ================= SETTINGS ================= -->

<div class="overlay" id="settingsOverlay">

    <div class="settings">

        <div class="settings-head">

            <h2>⚙️ Settings</h2>

            <button
                class="close"
                onclick="closeSettings()">
                ✕
            </button>

        </div>


        <div class="setting">

            <label>
                🎤 Voice Recognition Language
            </label>

            <select id="voiceLanguage">

                <option value="auto">
                    🌐 Auto / বাংলা
                </option>

                <option value="bn-BD">
                    🇧🇩 বাংলা
                </option>

                <option value="en-US">
                    🇺🇸 English
                </option>

                <option value="hi-IN">
                    🇮🇳 हिन्दी
                </option>

                <option value="ur-PK">
                    🇵🇰 اردو
                </option>

                <option value="ar-SA">
                    🇸🇦 العربية
                </option>

                <option value="es-ES">
                    🇪🇸 Español
                </option>

                <option value="fr-FR">
                    🇫🇷 Français
                </option>

                <option value="de-DE">
                    🇩🇪 Deutsch
                </option>

                <option value="pt-BR">
                    🇧🇷 Português
                </option>

                <option value="zh-CN">
                    🇨🇳 中文
                </option>

                <option value="ja-JP">
                    🇯🇵 日本語
                </option>

                <option value="ko-KR">
                    🇰🇷 한국어
                </option>

                <option value="tr-TR">
                    🇹🇷 Türkçe
                </option>

                <option value="ms-MY">
                    🇲🇾 Melayu
                </option>

            </select>

        </div>


        <div class="setting">

            <label>
                🧹 Chat History
            </label>

            <button
                class="quick-btn"
                style="width:100%"
                onclick="clearChat()">

                🗑️ Clear Chat

            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   GAIVEX AI CONFIGURATION
   =========================================================

   তোমার Cloudflare Worker যদি এই URL-এ থাকে,
   তাহলে এটা সরাসরি ব্যবহার করবে।

   Worker অন্য URL হলে শুধু নিচের URL পরিবর্তন করবে।
========================================================= */

const CONFIG = {

    API_URL:
        "https://ai.gaiyumtamim.workers.dev/",

    PORTAL_URL:
        "#",

    MAX_HISTORY:
        30

};


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
    document.getElementById("chat");

const questionInput =
    document.getElementById("question");

const statusText =
    document.getElementById("statusText");

const voiceBtn =
    document.getElementById("voiceBtn");

const welcome =
    document.getElementById("welcome");


/* =========================================================
   CHAT HISTORY
========================================================= */

let chatHistory =
    JSON.parse(
        localStorage.getItem("gaivex_chat_history") || "[]"
    );


/* =========================================================
   LANGUAGE DETECTION
========================================================= */

function detectLanguage(text){

    if(!text) return "bn";

    if(/[অ-৿]/.test(text))
        return "bn";

    if(/[ऀ-ॿ]/.test(text))
        return "hi";

    if(/[؀-ۿ]/.test(text))
        return "ur";

    if(/[؀-ۿ]/.test(text))
        return "ar";

    if(/[一-龯]/.test(text))
        return "zh";

    if(/[ぁ-ゟァ-ヿ]/.test(text))
        return "ja";

    if(/[가-힣]/.test(text))
        return "ko";

    return "en";
}


/* =========================================================
   SAVE CHAT
========================================================= */

function saveHistory(){

    if(chatHistory.length > CONFIG.MAX_HISTORY){

        chatHistory =
            chatHistory.slice(
                -CONFIG.MAX_HISTORY
            );

    }

    localStorage.setItem(
        "gaivex_chat_history",
        JSON.stringify(chatHistory)
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   FORMAT AI RESPONSE
========================================================= */

function formatAnswer(text){

    if(!text)
        return "";

    let safe =
        escapeHTML(text);

    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );

    return safe;
}


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(text){

    welcome.style.display = "none";

    const row =
        document.createElement("div");

    row.className =
        "message-row user";

    const msg =
        document.createElement("div");

    msg.className =
        "message";

    msg.innerHTML =
        escapeHTML(text);

    row.appendChild(msg);

    chat.appendChild(row);

    scrollBottom();
}


/* =========================================================
   ADD AI MESSAGE
========================================================= */

function addAIMessage(text, searchQuery=null){

    welcome.style.display = "none";

    const row =
        document.createElement("div");

    row.className =
        "message-row ai";

    const msg =
        document.createElement("div");

    msg.className =
        "message";

    msg.innerHTML =
        `<div class="ai-title">🤖 GAIVEX AI</div>
         ${formatAnswer(text)}`;

    if(searchQuery){

        const card =
            document.createElement("div");

        card.className =
            "search-card";

        card.innerHTML = `

            <div class="search-label">
                🔎 এই তথ্যটি Google-এ খুঁজুন
            </div>

            <button class="search-btn">
                🔎 Search Google
            </button>

        `;

        card.querySelector(".search-btn")
            .onclick = function(){

                const url =
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(searchQuery);

                window.open(
                    url,
                    "_blank"
                );

            };

        msg.appendChild(card);

    }

    row.appendChild(msg);

    chat.appendChild(row);

    scrollBottom();
}


/* =========================================================
   TYPING
========================================================= */

function showTyping(){

    const row =
        document.createElement("div");

    row.className =
        "message-row ai";

    row.id =
        "typingRow";

    row.innerHTML = `

        <div class="message">

            <div class="ai-title">
                🤖 GAIVEX AI
            </div>

            <div class="typing">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    `;

    chat.appendChild(row);

    scrollBottom();
}


function removeTyping(){

    const el =
        document.getElementById("typingRow");

    if(el)
        el.remove();
}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

    setTimeout(()=>{

        chat.scrollTop =
            chat.scrollHeight;

    },50);

}


/* =========================================================
   GOOGLE FALLBACK DETECTION
========================================================= */

function shouldSearch(question){

    const q =
        question.toLowerCase().trim();

    const keywords = [

        "latest",
        "today",
        "আজ",
        "বর্তমান",
        "সর্বশেষ",
        "খবর",
        "news",
        "who is",
        "কে",
        "কত",
        "price",
        "দাম",
        "result",
        "ফলাফল",
        "সময়",
        "time",
        "weather",
        "আবহাওয়া",
        "near me",
        "কোথায়",
        "কখন",
        "when",
        "where",
        "how much",
        "কত টাকা"

    ];

    return keywords.some(
        k => q.includes(k)
    );
}


/* =========================================================
   LOCAL ANSWERS
========================================================= */

function localAnswer(question){

    const q =
        question.toLowerCase().trim();


    /* CAPITAL */

    if(
        q.includes("রাজধানী") ||
        q.includes("capital of bangladesh") ||
        q.includes("bangladesh capital")
    ){

        return {
            answer:
                "বাংলাদেশের রাজধানী হলো ঢাকা। 🇧🇩",
            search:null
        };

    }


    /* GAIVEX */

    if(
        q.includes("gaivex") &&
        (
            q.includes("কি") ||
            q.includes("what") ||
            q.includes("about")
        )
    ){

        return {
            answer:

/* =========================================================
   API CALL
========================================================= */

async function askAI(question){

    try{

        const response =
            await fetch(
                CONFIG.API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:
                            question,

                        prompt:
                            question,

                        language:
                            detectLanguage(question),

                        history:
                            chatHistory.slice(-12)

                    })
                }
            );


        if(!response.ok)
            throw new Error(
                "API Error " +
                response.status
            );


        const data =
            await response.json();


        /*
         Worker বিভিন্ন নামে answer পাঠাতে পারে।
        তাই একাধিক property support করা হয়েছে।
        */

        const answer =
            data.answer ||
            data.response ||
            data.text ||
            data.message ||
            data.result ||
            data.output;


        if(answer){

            return {
                answer:String(answer),
                search:null
            };

        }


        return null;

    }catch(error){

        console.error(
            "GAIVEX API:",
            error
        );

        return null;

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const question =
        questionInput.value.trim();

    if(!question)
        return;


    questionInput.value = "";

    addUserMessage(question);


    chatHistory.push({
        role:"user",
        content:question
    });

    saveHistory();


    statusText.innerText =
        "GAIVEX AI উত্তর তৈরি করছে...";


    showTyping();


    /* LOCAL RESPONSE */

    const local =
        localAnswer(question);


    if(local){

        setTimeout(()=>{

            removeTyping();

            addAIMessage(
                local.answer,
                local.search
            );

            chatHistory.push({
                role:"assistant",
                content:local.answer
            });

            saveHistory();

            statusText.innerText =
                "আপনার প্রশ্নের অপেক্ষায়...";

        },350);

        return;

    }


    /* API */

    const result =
        await askAI(question);


    removeTyping();


    if(result){

        addAIMessage(
            result.answer,
            result.search
        );

        chatHistory.push({
            role:"assistant",
            content:result.answer
        });

        saveHistory();

        statusText.innerText =
            "আপনার প্রশ্নের অপেক্ষায়...";

        return;

    }


    /* GOOGLE FALLBACK */

    const lang =
        detectLanguage(question);


    let fallbackText =
        "এই প্রশ্নের নির্দিষ্ট তথ্য GAIVEX Knowledge Base-এ পাওয়া যায়নি। নিচের Search বাটনে চাপলে Google-এ সরাসরি ফলাফল দেখতে পারবেন।";


    if(lang === "en"){
        fallbackText =
            "I couldn't find a specific answer in the GAIVEX Knowledge Base. Use the Search button below to search Google.";
    }

    if(lang === "hi"){
        fallbackText =
            "यह जानकारी GAIVEX Knowledge Base में नहीं मिली। नीचे Search बटन से Google पर खोजें।";
    }

    if(lang === "ur"){
        fallbackText =
            "یہ معلومات GAIVEX Knowledge Base میں نہیں ملی۔ نیچے Search بٹن سے Google پر تلاش کریں۔";
    }

    addAIMessage(
        fallbackText,
        question
    );


    chatHistory.push({
        role:"assistant",
        content:fallbackText
    });

    saveHistory();


    statusText.innerText =
        "আপনার প্রশ্নের অপেক্ষায়...";

}

/* =========================================================
   VOICE RECOGNITION
========================================================= */

let recognition =
    null;

let isRecording =
    false;


function getVoiceLanguage(){

    const selected =
        document.getElementById(
            "voiceLanguage"
        ).value;

    if(selected !== "auto")
        return selected;


    /*
       Auto mode-এ browser language ব্যবহার করা হবে।
       সাধারণত বাংলাদেশের ফোনে bn-BD পাওয়া যাবে।
    */

    const browserLang =
        navigator.language ||
        "bn-BD";

    if(
        browserLang.startsWith("bn")
    )
        return "bn-BD";

    if(
        browserLang.startsWith("hi")
    )
        return "hi-IN";

    if(
        browserLang.startsWith("ur")
    )
        return "ur-PK";

    if(
        browserLang.startsWith("ar")
    )
        return "ar-SA";

    return "en-US";
}


function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "আপনার browser Voice Recognition support করে না। Chrome ব্যবহার করে চেষ্টা করুন।"
        );

        return;

    }


    if(isRecording){

        if(recognition)
            recognition.stop();

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        getVoiceLanguage();


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        3;


    isRecording =
        true;


    voiceBtn.classList.add(
        "recording"
    );


    voiceBtn.innerText =
        "⏹️";


    statusText.innerText =
        "🎤 শুনছি...";


    recognition.onresult =
        function(event){

            let transcript =
                "";


            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0]
                        .transcript;

            }


            questionInput.value =
                transcript;

        };


    recognition.onerror =
        function(event){

            console.error(
                "Voice error:",
                event.error
            );

            stopVoice();

            if(
                event.error ===
                "not-allowed"
            ){

                alert(
                    "Microphone permission দিন, তারপর আবার চেষ্টা করুন।"
                );

            }

        };


    recognition.onend =
        function(){

            stopVoice();

        };


    recognition.start();

}


function stopVoice(){

    isRecording =
        false;

    voiceBtn.classList.remove(
        "recording"
    );

    voiceBtn.innerText =
        "🎤";

    statusText.innerText =
        "আপনার প্রশ্নের অপেক্ষায়...";

}

}


function closeSettings(){

        .getElementById(

        )

/* =========================================================
   CLEAR CHAT
========================================================= */

function clearChat(){

    if(
        !confirm(
            "সব Chat History মুছে ফেলবেন?"
        )
    )
        return;


    chatHistory = [];

    localStorage.removeItem(
        "gaivex_chat_history"
    );


    chat.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="big">🤖</div>

            <h2>GAIVEX AI Assistant</h2>

            <p>
                বাংলা, English এবং আরও অনেক ভাষায় প্রশ্ন করুন।
            </p>

        </div>

    `;

    closeSettings();

}


/* =========================================================
   LOAD OLD CHAT
========================================================= */

function loadHistory(){

    if(!chatHistory.length)
        return;


    welcome.style.display =
        "none";


    chatHistory.forEach(item=>{

        if(
            item.role === "user"
        ){

            addUserMessage(
                item.content
            );

        }else{

            addAIMessage(
                item.content
            );

        }

    });

}


/* =========================================================
   CLOSE SETTINGS BY OUTSIDE CLICK
========================================================= */

document
    .getElementById(
        "settingsOverlay"
    )
    .addEventListener(
        "click",
        function(e){

            if(
                e.target === this
            ){

                closeSettings();

            }

        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

loadHistory();

</script>

<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAIVEX AI - Smart Admission Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root[data-theme="dark"] { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --accent:#38bdf8; --border:#334155; }
        :root[data-theme="light"] { --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --accent:#0284c7; --border:#cbd5e1; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); color: var(--text); }

       .app-container { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }
       .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 999; backdrop-filter: blur(2px); }
       .sidebar-overlay.active { display: block; }
       .sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 1000; }
       .sidebar-header { padding: 12px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
       .new-chat-btn { flex: 1; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-size: 14px; }
       .history-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
       .history-item { padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; }
       .history-item.active { border-color: var(--accent); color: var(--accent); }
       .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; width: 100%; }
       .navbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: var(--card); border-bottom: 1px solid var(--border); height: 60px; z-index: 100; }
       .nav-left { display: flex; align-items: center; gap: 10px; }
       .toggle-sidebar-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 6px; cursor: pointer; }
       .logo { font-size: 18px; font-weight: 700; color: var(--accent); text-decoration: none; }
       .logo span { color: #f43f5e; }
       .nav-right-group { display: flex; align-items: center; gap: 8px; }
       .btn-auth { background: var(--accent); color: #fff; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
       .theme-toggle { background: var(--bg); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 6px; cursor: pointer; }
       .chat-section { flex: 1; display: flex; flex-direction: column; height: calc(100vh - 60px); background: var(--bg); }
       .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
       .message { display: flex; gap: 10px; max-width: 88%; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
       .message.user { align-self: flex-end; flex-direction: row-reverse; }
       .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; background: var(--accent); color:#fff; }
       .msg-content { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; background: var(--card); border: 1px solid var(--border); }
       .message.user.msg-content { background: var(--accent); color: #fff; }

        /* New: Message Actions */
       .msg-actions { display: flex; gap: 8px; margin-top: 6px; opacity: 0; transition: 0.2s; }
       .message:hover.msg-actions { opacity: 1; }
       .action-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; }

       .chat-input-area { padding: 10px 12px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
       .chat-input-area input { flex: 1; padding: 10px 15px; background: var(--bg); border: 1px solid var(--border); border-radius: 25px; color: var(--text); font-size: 14px; }
       .send-btn { background: var(--accent); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
       .send-btn.stop { background: #f43f5e; }
       .typing-indicator { font-size: 13px; color: #94a3b8; display: none; padding: 6px 15px; }

        /* New: Subject Selector */
       .subject-bar { display: flex; gap: 6px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; }
       .subject-btn { padding: 4px 10px; border: 1px solid var(--border); background: var(--bg); border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
       .subject-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

       .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; }
       .modal-content { background:var(--card); color:var(--text); padding:20px; border-radius:12px; width:92%; max-width:400px; border:1px solid var(--border); }
        @media (max-width: 768px) {.sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); }.sidebar.open { transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">➕ নতুন চ্যাট</button>
                <button class="close-sidebar-btn" onclick="closeSidebar()">✕</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </aside>

        <div class="main-content">
            <header class="navbar">
                <div class="nav-left">
                    <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
                    <a href="index.html" class="logo">GAIVEX<span>.</span> AI</a>
                </div>
                <div class="nav-right-group">
                    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
                    <div id="authNavContainer"><button class="btn-auth" onclick="toggleAuthModal(true)">লগইন</button></div>
                </div>
            </header>

            <!-- New: Subject Mode Bar -->
            <div class="subject-bar" id="subjectBar">
                <button class="subject-btn active" data-subject="general">🤖 General</button>
                <button class="subject-btn" data-subject="physics">⚛️ Physics</button>
                <button class="subject-btn" data-subject="chemistry">🧪 Chemistry</button>
                <button class="subject-btn" data-subject="biology">🧬 Biology</button>
                <button class="subject-btn" data-subject="math">🧮 Math</button>
                <button class="subject-btn" data-subject="admission">🎓 Admission</button>
            </div>

            <main class="chat-section">
                <div class="chat-box" id="chatBox">
                    <div class="message ai">
                        <div class="msg-avatar">🤖</div>
                        <div class="msg-content">Hi! I am <strong>GAIVEX AI.</strong> কীভাবে সাহায্য করতে পারি?</div>
                    </div>
                </div>

                <div class="typing-indicator" id="typingIndicator">🤖 GAIVEX AI লিখছে...</div>

                <form class="chat-input-area" onsubmit="sendChatMessage(event)">
                    <input type="file" id="fileInput" accept="image/*,.pdf" style="display:none" onchange="handleFileUpload(event)">
                    <button type="button" class="send-btn" onclick="document.getElementById('fileInput').click()" title="Image/PDF Upload">📎</button>
                    <button type="button" class="send-btn" onclick="startVoiceInput()" title="Voice Input">🎤</button>
                    <input type="text" id="userInput" placeholder="প্রশ্ন লিখুন..." autocomplete="off" required>
                    <button type="submit" class="send-btn" id="sendBtn">➤</button>
                </form>
            </main>
        </div>
    </div>

    <!-- Auth Modal Same as before -->
    <div id="authModal" class="modal">...same code... </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ", authDomain: "gaivexexam.firebaseapp.com", projectId: "gaivexexam"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let currentUser = null;
let activeChatId = Date.now().toString();
let chatSessions = {};
let currentMessages = [];
let activeSubject = "general";
let isGenerating = false;
let abortController = null;

const WORKER_URL = "https://small-hall-d192.gaiyumplayz.workers.dev/";
const SYSTEM_INSTRUCTION = `You are "GAIVEX AI", a dedicated AI assistant for GAIVEX Scholars. Always speak politely in Bengali. Owner: MAMUN ABDUL GAIYUM TAMIM. Current Subject Mode: ${activeSubject}`;

onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if(user){ loadHistoryList(); document.getElementById('userInput').disabled=false; }
});

// THEME TOGGLE
window.toggleTheme = () => {
    const html = document.documentElement;
    const newTheme = html.getAttribute('data-theme') === 'dark'? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('gaivex_theme', newTheme);
}

// SUBJECT SELECTOR
document.querySelectorAll('.subject-btn').forEach(btn=>{
    btn.onclick = () => {
        document.querySelectorAll('.subject-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        activeSubject = btn.dataset.subject;
        createNewChat();
    }
})

// STREAMING + STOP + REGENERATE
window.sendChatMessage = async function(e) {
    e.preventDefault();
    if(!currentUser) return toggleAuthModal(true);
    if(isGenerating) return stopGeneration();

    const inputEl = document.getElementById('userInput');
    const prompt = inputEl.value.trim(); if (!prompt) return;
    appendMessage('user', 'U', prompt);
    currentMessages.push({ role: 'user', content: prompt });
    inputEl.value = '';

    document.getElementById('typingIndicator').style.display = 'flex';
    document.getElementById('sendBtn').classList.add('stop');
    document.getElementById('sendBtn').innerText = '⏹';
    isGenerating = true;
    abortController = new AbortController();

    let aiMsgDiv = appendMessage('ai', '🤖', '');
    let fullText = '';

    try {
        const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Worker-Auth': 'GAIVEX_SECRET_2026' },
            body: JSON.stringify({ system_instruction: SYSTEM_INSTRUCTION + ` Subject: ${activeSubject}`, history: currentMessages.slice(-6), prompt }),
            signal: abortController.signal
        });
        const data = await res.json();
        fullText = data.reply || "উত্তর পাওয়া যায়নি";

        // Typing Animation
        for(let i=0; i<fullText.length; i++){
            if(!isGenerating) break;
            aiMsgDiv.querySelector('.msg-content').innerHTML = marked.parse(fullText.slice(0,i+1));
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            await new Promise(r=>setTimeout(r,10));
        }

        addMessageActions(aiMsgDiv, fullText);
        currentMessages.push({ role: 'model', content: fullText });
        saveCurrentChat();

    } catch(error){ if(error.name!== 'AbortError') appendMessage('ai', '🤖', '⚠️ সার্ভার এরর'); }

    document.getElementById('typingIndicator').style.display = 'none';
    document.getElementById('sendBtn').classList.remove('stop');
    document.getElementById('sendBtn').innerText = '➤';
    isGenerating = false;
}

window.stopGeneration = () => { abortController?.abort(); isGenerating=false; }

// MESSAGE ACTIONS: Copy, Like, Regenerate
function addMessageActions(msgDiv, text){
    const actions = `<div class="msg-actions">
        <button class="action-btn" onclick="copyText('${btoa(text)}')">📋 Copy</button>
        <button class="action-btn" onclick="this.innerText='👍 Saved'">👍</button>
        <button class="action-btn" onclick="regenerate()">🔄 Regenerate</button>
        <button class="action-btn" onclick="speakText('${btoa(text)}')">🔊</button>
    </div>`;
    msgDiv.querySelector('.msg-content').insertAdjacentHTML('beforeend', actions);
}
window.copyText = (b64) => navigator.clipboard.writeText(atob(b64));
window.regenerate = () => { currentMessages.pop(); sendChatMessage(new Event('submit')); }

// VOICE INPUT + OUTPUT
window.startVoiceInput = () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition) return alert("Voice not supported");
    const rec = new SpeechRecognition(); rec.lang = 'bn-BD'; rec.start();
    rec.onresult = (e) => document.getElementById('userInput').value = e.results[0][0].transcript;
}
window.speakText = (b64) => {
    const text = atob(b64);
    const utter = new SpeechSynthesisUtterance(text); utter.lang = 'bn-BD';
    speechSynthesis.speak(utter);
}

// IMAGE/PDF UPLOAD
window.handleFileUpload = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        appendMessage('user', 'U', `📎 ${file.name} আপলোড হয়েছে`);
        currentMessages.push({role:'user', content:`Analyze this image: ${reader.result}`});
    }
    reader.readAsDataURL(file);
}

// REST OF FUNCTIONS: saveCurrentChat, loadHistoryList, createNewChat, toggleSidebar etc. Same as your code

function appendMessage(role, avatar, text){
    const chatBox = document.getElementById('chatBox');
    const msg = document.createElement('div');
    msg.className = `message ${role}`;
    msg.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="msg-content">${marked.parse(text)}</div>`;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    if(window.MathJax) MathJax.typesetPromise();
    return msg;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAIVEX AI - Smart Admission Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Rendering Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #0f172a; color: #f8fafc; }
        
        /* App Structure Layout */
        .app-container { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }

        /* Overlay for Mobile Sidebar Background Blur */
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 999; backdrop-filter: blur(2px); }
        .sidebar-overlay.active { display: block; }

        /* Sidebar for Chat History */
        .sidebar { width: 280px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 1000; }
        .sidebar-header { padding: 12px 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        
        .new-chat-btn { flex: 1; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-size: 14px; }
        .new-chat-btn:hover { background: #0369a1; }
        
        .close-sidebar-btn { background: #0f172a; border: 1px solid #475569; color: #f43f5e; width: 38px; height: 38px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .close-sidebar-btn:hover { background: #f43f5e; color: #fff; }

        .history-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .history-item { padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; cursor: pointer; font-size: 13px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
        .history-item:hover, .history-item.active { background: #334155; color: #38bdf8; border-color: #38bdf8; }

        /* Main Content View */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; width: 100%; }

        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: rgba(30, 41, 59, 0.95); border-bottom: 1px solid #334155; height: 60px; z-index: 100; gap: 10px; }
        .nav-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .toggle-sidebar-btn { background: #0f172a; border: 1px solid #475569; color: #fff; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .logo { font-size: 18px; font-weight: 700; color: #38bdf8; text-decoration: none; white-space: nowrap; }
        .logo span { color: #f43f5e; }

        .nav-right-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        #authNavContainer { display: flex; gap: 8px; align-items: center; }
        .btn-auth { background: #38bdf8; color: #0f172a; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 13px; }
        .btn-auth:hover { background: #7dd3fc; }

        /* User Profile Button in Navbar */
        .user-profile-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; background: #334155; padding: 3px 10px 3px 4px; border-radius: 20px; border: 1px solid #475569; height: 36px; max-width: 140px; overflow: hidden; }
        .user-avatar { width: 28px; height: 28px; min-width: 28px; border-radius: 50%; background: #38bdf8; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0f172a; font-size: 12px; overflow: hidden; flex-shrink: 0; }
        .user-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
        .user-name-text { font-size: 12px; font-weight: bold; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .menu-container { position: relative; }
        .menu-btn { background: #0f172a; border: 1px solid #475569; color: #fff; width: 36px; height: 36px; border-radius: 6px; font-size: 18px; cursor: pointer; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 45px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; width: 170px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; overflow: hidden; }
        .dropdown-menu button, .dropdown-menu a { display: block; width: 100%; text-align: left; padding: 10px 15px; color: #f8fafc; text-decoration: none; font-size: 14px; border-bottom: 1px solid #334155; background: none; border: none; cursor: pointer; }
        .dropdown-menu.show { display: block; }

        /* Fixed Chat Area */
        .chat-section { flex: 1; display: flex; flex-direction: column; height: calc(100vh - 60px); background: #0f172a; position: relative; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }

        .message { display: flex; gap: 10px; max-width: 88%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }

        /* Strict Size Fix for Chat Avatar */
        .msg-avatar { width: 32px !important; height: 32px !important; min-width: 32px !important; max-width: 32px !important; min-height: 32px !important; max-height: 32px !important; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; font-weight: bold; overflow: hidden; }
        .msg-avatar img { width: 100% !important; height: 100% !important; border-radius: 50%; object-fit: cover; display: block; }

        .message.user .msg-avatar { background: #38bdf8; color: #0f172a; }
        .message.ai .msg-avatar { background: #0284c7; color: #fff; }

        .msg-content { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .message.user .msg-content { background: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
        .message.ai .msg-content { background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-bottom-left-radius: 2px; }

        .msg-content p { margin-bottom: 6px; }
        .msg-content p:last-child { margin-bottom: 0; }
        .msg-content strong { color: #38bdf8; }

        /* Fixed Bottom Chat Input Bar */
        .chat-input-area { padding: 10px 12px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; position: sticky; bottom: 0; width: 100%; }
        .chat-input-area input { flex: 1; padding: 10px 15px; background: #0f172a; border: 1px solid #475569; border-radius: 25px; color: #fff; font-size: 14px; outline: none; min-width: 0; }
        .chat-input-area input:disabled { background: #1e293b; cursor: not-allowed; opacity: 0.6; }
        .chat-input-area input:focus { border-color: #38bdf8; }
        .send-btn { background: #38bdf8; color: #0f172a; border: none; width: 40px; height: 40px; min-width: 40px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn:disabled { background: #475569; cursor: not-allowed; }

        .typing-indicator { font-size: 13px; color: #94a3b8; display: none; align-items: center; gap: 6px; padding: 6px 15px; background: #0f172a; }

        /* Auth Locked Notice */
        .auth-locked-notice { background: #f43f5e22; border: 1px solid #f43f5e; color: #f43f5e; padding: 8px 12px; border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold; margin: 0 10px 8px 10px; display: none; }

        /* Modals */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; }
        .modal-content { background:#1e293b; color:#f8fafc; padding:20px; border-radius:12px; width:92%; max-width:400px; border:1px solid #334155; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .modal-header h3 { color: #38bdf8; font-size: 18px; }
        .modal-close-x { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }

        .modal-content label { font-weight:600; display:block; margin-top:10px; margin-bottom:4px; font-size:13px; }
        .modal-content input { width:100%; padding:10px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff; font-size:14px; margin-bottom:8px; }
        .btn-group { display:flex; gap:10px; margin-top:15px; }
        .btn { padding:10px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; flex:1; text-align: center; font-size: 14px; }
        .btn-save { background:#10b981; color:white; }
        .btn-close { background:#ef4444; color:white; }
        .btn-google { background:#ea4335; color:white; width:100%; margin-top:10px; padding: 10px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; }
        
        .tab-menu { display:flex; border-bottom: 1px solid #334155; margin-bottom: 15px; }
        .tab-btn { flex:1; padding: 8px; background: none; border: none; color: #94a3b8; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .user-name-text { display: none; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- সাইডবার ওভারলে -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <!-- চ্যাট হিস্টোরি সাইডবার -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">➕ নতুন চ্যাট</button>
                <button class="close-sidebar-btn" onclick="closeSidebar()" title="হিস্টোরি বন্ধ করুন">✕</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </aside>

        <!-- মেইন কনটেন্ট এরিয়া -->
        <div class="main-content">
            <header class="navbar">
                <div class="nav-left">
                    <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="হিস্টোরি খুলুন">☰</button>
                    <a href="index.html" class="logo">GAIVEX<span>.</span> AI</a>
                </div>
                
                <div class="nav-right-group">
                    <div id="authNavContainer">
                        <button class="btn-auth" onclick="toggleAuthModal(true)">লগইন</button>
                    </div>
                    <div class="menu-container">
                        <button class="menu-btn" onclick="toggleMenu()">⋮</button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="index.html">🏠 হোম</a>
                            <button onclick="openModal('noticeModal')">📢 নোটিশ বোর্ড</button>
                            <div id="dropdownAuthAction"></div>
                        </div>
                    </div>
                </div>
            </header>

            <main class="chat-section">
                <div class="chat-box" id="chatBox">
                    <div class="message ai">
                        <div class="msg-avatar">🤖</div>
                        <div class="msg-content">হ্যালো! আমি <strong>GAIVEX AI</strong>। আপনার সাধারণ জ্ঞান ও এডমিশন টেস্টের প্রশ্নের মাঝারি সাইজের সঠিক উত্তর দিতে প্রস্তুত। চ্যাট করতে দয়া করে লগইন করুন!</div>
                    </div>
                </div>

                <div class="typing-indicator" id="typingIndicator">
                    <span>🤖 GAIVEX AI উত্তর তৈরি করছে...</span>
                </div>

                <div class="auth-locked-notice" id="authLockedNotice">
                    🔒 AI এর সাথে কথা বলতে এবং চ্যাট করতে প্রথমে লগইন করুন!
                </div>

                <!-- চ্যাট ইনপুট বার -->
                <form class="chat-input-area" onsubmit="sendChatMessage(event)">
                    <input type="text" id="userInput" placeholder="লগইন করার পর এখানে প্রশ্ন লিখুন..." autocomplete="off" required disabled>
                    <button type="submit" class="send-btn" id="sendBtn" disabled>➤</button>
                </form>
            </main>
        </div>
    </div>

    <!-- অথেন্টিকেশন মোডাল -->
    <div id="authModal" class="modal">
      <div class="modal-content">
        <div class="tab-menu">
            <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">লগইন</button>
            <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">রেজিস্ট্রেশন</button>
        </div>
        <form id="loginForm" onsubmit="handleEmailLogin(event)">
            <label>ইমেইল:</label><input type="email" id="loginEmail" required placeholder="example@mail.com">
            <label>পাসওয়ার্ড:</label><input type="password" id="loginPassword" required placeholder="******">
            <button type="submit" class="btn btn-save" style="width:100%; margin-top:10px;">লগইন করুন</button>
        </form>
        <form id="registerForm" onsubmit="handleEmailRegister(event)" style="display:none;">
            <label>পূর্ণ নাম:</label><input type="text" id="regName" required placeholder="আপনার নাম">
            <label>ইমেইল:</label><input type="email" id="regEmail" required placeholder="example@mail.com">
            <label>পাসওয়ার্ড:</label><input type="password" id="regPassword" required placeholder="******">
            <button type="submit" class="btn btn-save" style="width:100%; margin-top:10px;">অ্যাকাউন্ট তৈরি করুন</button>
        </form>
        <button type="button" class="btn-google" onclick="handleGoogleSignIn()">🌐 Google দিয়ে লগইন করুন</button>
        <div class="btn-group"><button type="button" class="btn btn-close" onclick="toggleAuthModal(false)">বন্ধ করুন</button></div>
      </div>
    </div>

    <!-- নোটিশ বোর্ড মোডাল -->
    <div id="noticeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📢 গুরুত্বপূর্ণ নোটিশ</h3>
                <button class="modal-close-x" onclick="closeModal('noticeModal')">&times;</button>
            </div>
            <p style="color:#94a3b8; font-size:14px;">বর্তমানে কোনো নতুন নোটিশ নেই।</p>
        </div>
    </div>

    <!-- Firebase ও AI লজিক Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAoQInHVL3h3R58OF8SZbmsFtX4Kx6xckQ",
            authDomain: "gaivexexam.firebaseapp.com",
            databaseURL: "https://gaivexexam-default-rtdb.firebaseio.com",
            projectId: "gaivexexam",
            storageBucket: "gaivexexam.firebasestorage.app",
            messagingSenderId: "956204530190",
            appId: "1:956204530190:web:4e5550afefa3e314c99a5f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        let currentUser = null;

        const WORKER_URL = "https://small-hall-d192.gaiyumplayz.workers.dev/";

        let activeChatId = Date.now().toString();
        let chatSessions = {};
        let currentMessages = [];

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const c = document.getElementById('authNavContainer');
            const dropdownAuth = document.getElementById('dropdownAuthAction');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const authNotice = document.getElementById('authLockedNotice');

            if (user) {
                const photoHtml = user.photoURL 
                    ? `<img src="${user.photoURL}" alt="Profile">` 
                    : (user.displayName ? user.displayName.charAt(0).toUpperCase() : 'U');

                const nameDisplay = (user.displayName || user.email).split(' ')[0];

                c.innerHTML = `
                    <div class="user-profile-btn">
                        <div class="user-avatar">${photoHtml}</div>
                        <span class="user-name-text">${nameDisplay}</span>
                    </div>`;
                
                dropdownAuth.innerHTML = `<button onclick="handleLogout()" style="color: #f43f5e;">🚪 লগআউট</button>`;
                
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.placeholder = "এখানে আপনার প্রশ্ন লিখুন...";
                authNotice.style.display = 'none';

                loadHistoryList();
            } else {
                c.innerHTML = `<button class="btn-auth" onclick="toggleAuthModal(true)">লগইন</button>`;
                dropdownAuth.innerHTML = `<button onclick="toggleAuthModal(true); toggleMenu();">🔑 লগইন</button>`;
                
                userInput.disabled = true;
                sendBtn.disabled = true;
                userInput.placeholder = "লগইন করার পর প্রশ্ন টাইপ করতে পারবেন...";
                authNotice.style.display = 'block';
            }
        });

        // সিস্টেম ইন্সট্রাকশন: বাংলা বাধ্যবাধকতা + মাঝারি সাইজ
        const SYSTEM_INSTRUCTION = `You are "GAIVEX AI", an expert assistant for Admission Tests and General Knowledge. 
RULES:
1. You MUST ALWAYS respond ONLY in BENGALI language, even if user types in English or Banglish.
2. Never call yourself Gemini or Google.
3. Keep responses strictly concise, medium-length, to-the-point, accurate, and easy to read.`;

        window.sendChatMessage = async function(e) {
            e.preventDefault();
            if(!currentUser) {
                toggleAuthModal(true);
                return;
            }

            const inputEl = document.getElementById('userInput');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            const chatBox = document.getElementById('chatBox');
            const typingIndicator = document.getElementById('typingIndicator');

            const userAvatar = currentUser.photoURL 
                ? `<img src="${currentUser.photoURL}" alt="User">` 
                : (currentUser.displayName ? currentUser.displayName.charAt(0).toUpperCase() : 'U');

            appendMessage('user', userAvatar, prompt);
            
            currentMessages.push({ role: 'user', content: prompt });
            inputEl.value = '';

            typingIndicator.style.display = 'flex';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        system_instruction: SYSTEM_INSTRUCTION,
                        history: currentMessages,
                        prompt: prompt 
                    })
                });

                const data = await res.json();
                typingIndicator.style.display = 'none';

                // বিভিন্ন টাইপের API Response ফ্যালব্যাক চেকিং
                let replyText = "";
                if (typeof data === 'string') {
                    replyText = data;
                } else {
                    replyText = data.reply || data.response || data.text || (data.candidates && data.candidates[0]?.content?.parts[0]?.text) || "";
                }

                if (!replyText || replyText.trim() === "") {
                    replyText = "দুঃখিত, এই বিষয়টি নিয়ে তথ্য পাওয়া যায়নি। দয়া করে প্রশ্নটি আবার একটু স্পষ্ট করে লিখুন।";
                } else {
                    replyText = replyText.replace(/Gemini/g, "GAIVEX AI").replace(/Google/g, "GAIVEX");
                }

                appendMessage('ai', '🤖', replyText, true);

                currentMessages.push({ role: 'assistant', content: replyText });
                saveCurrentChat();

            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('ai', '🤖', '⚠️ সার্ভারের সাথে সংযোগ বিচ্ছিন্ন হয়েছে। আবার চেষ্টা করুন।');
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        };

        function appendMessage(role, avatar, text, isMarkdown = false) {
            const chatBox = document.getElementById('chatBox');
            const parsedText = isMarkdown ? marked.parse(text) : text.replace(/\n/g, '<br>');
            
            const msgHTML = `
                <div class="message ${role}">
                    <div class="msg-avatar">${avatar}</div>
                    <div class="msg-content">${parsedText}</div>
                </div>
            `;
            chatBox.innerHTML += msgHTML;
        }

        function saveCurrentChat() {
            if (currentMessages.length === 0 || !currentUser) return;
            const title = currentMessages[0].content.substring(0, 22) + '...';
            chatSessions[activeChatId] = { title, messages: currentMessages };
            localStorage.setItem('gaivex_chats_' + currentUser.uid, JSON.stringify(chatSessions));
            loadHistoryList();
        }

        function loadHistoryList() {
            if(!currentUser) return;
            chatSessions = JSON.parse(localStorage.getItem('gaivex_chats_' + currentUser.uid) || '{}');
            const listEl = document.getElementById('historyList');
            listEl.innerHTML = '';
            Object.keys(chatSessions).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `history-item ${id === activeChatId ? 'active' : ''}`;
                item.innerText = chatSessions[id].title;
                item.onclick = () => {
                    switchChat(id);
                    closeSidebar();
                };
                listEl.appendChild(item);
            });
        }

        window.switchChat = function(id) {
            activeChatId = id;
            currentMessages = chatSessions[id].messages || [];
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            currentMessages.forEach(msg => {
                const avatar = msg.role === 'user' 
                    ? (currentUser.photoURL ? `<img src="${currentUser.photoURL}">` : (currentUser?.displayName ? currentUser.displayName.charAt(0).toUpperCase() : 'U'))
                    : '🤖';
                appendMessage(msg.role === 'user' ? 'user' : 'ai', avatar, msg.content, msg.role !== 'user');
            });
            loadHistoryList();
        };

        window.createNewChat = function() {
            activeChatId = Date.now().toString();
            currentMessages = [];
            document.getElementById('chatBox').innerHTML = `
                <div class="message ai">
                    <div class="msg-avatar">🤖</div>
                    <div class="msg-content">নতুন চ্যাট শুরু হয়েছে! আমি GAIVEX AI, কীভাবে সাহায্য করতে পারি?</div>
                </div>
            `;
            loadHistoryList();
            closeSidebar();
        };

        // সাইডবার কন্ট্রোল
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        };

        window.closeSidebar = () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        };

        // Auth Logic
        window.toggleAuthModal = (show) => document.getElementById('authModal').style.display = show ? 'flex' : 'none';
        window.switchAuthTab = (tab) => {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        };

        window.handleGoogleSignIn = async () => { await signInWithPopup(auth, googleProvider); toggleAuthModal(false); };
        window.handleEmailRegister = async (e) => {
            e.preventDefault();
            const res = await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value, document.getElementById('regPassword').value);
            await updateProfile(res.user, { displayName: document.getElementById('regName').value });
            toggleAuthModal(false);
        };
        window.handleEmailLogin = async (e) => { e.preventDefault(); await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); toggleAuthModal(false); };
        window.handleLogout = async () => { await signOut(auth); };

        // UI toggles
        window.toggleMenu = () => document.getElementById('dropdownMenu').classList.toggle('show');
        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
    </script>
</body>
</html>

<head>

    name="viewport"

<meta name="theme-color" content="#061426">

<title>GAIVEX AI — Smart Admission Assistant</title>

<link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#061426;
    --bg2:#081b30;
    --card:#0d243b;
    --card2:#102b45;
    --border:#214561;

    --primary:#00bfff;
    --primary2:#008fd0;

    --text:#eef8ff;
    --muted:#8fa8bc;

    --success:#10b981;
    --danger:#ef4444;
    --warning:#f59e0b;

    --user:#009fe3;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,191,255,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(0,120,255,.08),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);

    font-family:
        "Hind Siliguri",
        "Inter",
        sans-serif;

    overflow-x:hidden;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    background:rgba(5,19,35,.94);

    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:1000;

    backdrop-filter:blur(14px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:40px;
    height:40px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #00bfff,
            #006ca5
        );

    font-size:22px;

    box-shadow:
        0 0 20px
        rgba(0,191,255,.25);
}

.brand-title{
    font-size:21px;
    font-weight:700;
    color:var(--primary);
}

.brand-title span{
    color:#ff3b57;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.icon-btn{
    width:40px;
    height:40px;

    border-radius:11px;

    border:1px solid var(--border);

    background:rgba(15,43,68,.9);

    color:white;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;

    transition:.2s;
}

.icon-btn:hover{
    border-color:var(--primary);
    transform:translateY(-1px);
}

/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:1000px;

    margin:auto;

    min-height:
        calc(100vh - 68px);

    display:flex;
    flex-direction:column;
}

/* =====================================================
   AI PROFILE
===================================================== */

.ai-profile{
    display:flex;
    align-items:center;
    gap:12px;

    padding:15px;

    border-bottom:1px solid var(--border);

    background:rgba(8,27,48,.72);
}

.ai-avatar{
    width:55px;
    height:55px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #00bfff,
            #0074aa
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:29px;

    box-shadow:
        0 0 25px
        rgba(0,191,255,.22);
}

.ai-name{
    font-size:20px;
    color:var(--primary);
    font-weight:700;
}

.ai-status{
    color:var(--muted);
    font-size:13px;

    display:flex;
    align-items:center;
    gap:6px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#10b981;

    box-shadow:
        0 0 8px #10b981;
}

/* =====================================================
   QUICK ACTIONS
===================================================== */

.quick-area{
    padding:10px 12px;

    border-bottom:1px solid var(--border);

    overflow-x:auto;

    white-space:nowrap;

    scrollbar-width:none;
}

.quick-area::-webkit-scrollbar{
    display:none;
}

.quick-btn{
    display:inline-flex;

    align-items:center;
    gap:6px;

    padding:8px 12px;

    margin-right:6px;

    border-radius:20px;

    border:1px solid var(--border);

    background:#0c2238;

    color:#d8edf8;

    font-family:inherit;

    cursor:pointer;

    font-size:12px;

    transition:.2s;
}

.quick-btn:hover{
    border-color:var(--primary);
    color:var(--primary);
}

/* =====================================================
   CHAT
===================================================== */

.chat{
    flex:1;

    padding:
        15px 12px 130px;

    overflow-y:auto;

    scroll-behavior:smooth;
}

.message{
    display:flex;

    margin-bottom:16px;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}

.message.ai{
    justify-content:flex-start;
}

.bubble{
    max-width:min(88%,760px);

    padding:13px 15px;

    border-radius:16px;

    line-height:1.7;

    font-size:15px;

    white-space:normal;

    word-wrap:break-word;
}

.user .bubble{
    background:
        linear-gradient(
            135deg,
            #009fe3,
            #007db5
        );

    border-bottom-right-radius:4px;

    color:white;
}

.ai .bubble{
    background:
        linear-gradient(
            145deg,
            #102c46,
            #0d243b
        );

    border:1px solid var(--border);

    border-bottom-left-radius:4px;
}

.message-time{
    font-size:10px;
    color:#718ca0;
    margin-top:4px;
}

/* =====================================================
   TYPING
===================================================== */

.typing{
    display:none;

    align-items:center;
    gap:5px;

    margin:0 0 15px 16px;
}

.typing.show{
    display:flex;
}

.typing span{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--primary);

    animation:
        typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-4px);
    }
}

/* =====================================================
   SEARCH / SOURCE BUTTON
===================================================== */

.search-link{
    display:inline-flex;

    align-items:center;
    gap:6px;

    margin-top:10px;

    padding:8px 13px;

    background:#008fd0;

    color:white;

    border-radius:8px;

    text-decoration:none;

    font-size:13px;

    font-weight:700;
}

.search-link:hover{
    background:#00a8ee;
}

/* =====================================================
   CHAT INPUT
===================================================== */

.input-area{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:900;

    background:
        linear-gradient(
            to top,
            #061426 75%,
            rgba(6,20,38,.93)
        );

    padding:
        10px max(
            12px,
            calc((100vw - 1000px)/2 + 12px)
        ) 15px;

    border-top:1px solid var(--border);
}

.input-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.voice-btn,
.send-btn{
    width:48px;
    height:48px;

    flex-shrink:0;

    border-radius:14px;

    border:1px solid var(--border);

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.voice-btn{
    background:#102b45;
    color:#c8e9f7;
}

.voice-btn.listening{
    background:#b91c1c;

    border-color:#ef4444;

    animation:pulse 1s infinite;
}

@keyframes pulse{

    50%{
        box-shadow:
            0 0 0 8px
            rgba(239,68,68,.12);
    }
}

.send-btn{
    background:
        linear-gradient(
            135deg,
            #00c7ff,
            #008dcc
        );

    color:#001827;

    font-weight:bold;
}

.message-input{
    flex:1;

    min-height:48px;
    max-height:130px;

    resize:none;

    border-radius:15px;

    border:1px solid #24617d;

    background:#020d1c;

    color:white;

    padding:12px 14px;

    outline:none;

    font-family:inherit;

    font-size:15px;
}

.message-input:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 0 2px
        rgba(0,191,255,.08);
}

.input-hint{
    text-align:center;

    color:#617d92;

    font-size:11px;

    margin-top:5px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:5000;

    background:rgba(0,0,0,.78);

    align-items:center;
    justify-content:center;

    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(94vw,700px);

    max-height:88vh;

    overflow-y:auto;

    background:#0b2137;

    border:1px solid var(--border);

    border-radius:17px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);
}

.modal-head{
    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:15px;

    border-bottom:1px solid var(--border);
}

.modal-head h3{
    color:var(--primary);
    font-size:18px;
}

.close-btn{
    background:none;
    border:none;

    color:#9ab2c4;

    font-size:26px;

    cursor:pointer;
}

.modal-body{
    padding:15px;
}

/* =====================================================
   STAT CARDS
===================================================== */

.stats-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.stat{
    background:#07192b;

    border:1px solid var(--border);

    border-radius:10px;

    padding:12px 6px;

    text-align:center;
}

.stat-value{
    font-size:18px;

    font-weight:700;

    color:var(--primary);
}

.stat-label{
    color:var(--muted);

    font-size:11px;
}

/* =====================================================
   LIST
===================================================== */

.list-box{
    margin-top:12px;

    max-height:400px;

    overflow-y:auto;
}

.list-item{
    background:#07192b;

    border:1px solid var(--border);

    border-radius:10px;

    padding:12px;

    margin-bottom:8px;

    cursor:pointer;

    transition:.2s;
}

.list-item:hover{
    border-color:var(--primary);
}

.list-title{
    color:var(--primary);

    font-weight:700;

    font-size:14px;
}

.list-meta{
    color:var(--muted);

    font-size:11px;

    margin-top:3px;
}

.list-text{
    color:#c5d6e2;

    font-size:13px;

    margin-top:6px;

    line-height:1.6;
}

/* =====================================================
   PROFILE
===================================================== */

.profile{
    display:flex;

    gap:12px;

    align-items:center;

    background:#07192b;

    padding:12px;

    border-radius:12px;

    border:1px solid var(--border);

    margin-bottom:12px;
}

.profile-avatar{
    width:45px;
    height:45px;

    border-radius:50%;

    background:var(--primary);

    color:#002238;

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:700;
}

.profile-name{
    font-weight:700;
}

.profile-email{
    color:var(--muted);

    font-size:11px;
}

/* =====================================================
   REVIEW
===================================================== */

.question-card{
    background:#07192b;

    border:1px solid var(--border);

    border-radius:10px;

    padding:12px;

    margin-bottom:10px;
}

.question-title{
    font-weight:700;

    margin-bottom:7px;
}

.correct{
    color:#10b981;
}

.wrong{
    color:#ef4444;
}

.explanation{
    background:#061426;

    padding:8px;

    border-radius:7px;

    color:#bcd1df;

    font-size:12px;

    margin-top:7px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    left:50%;
    bottom:85px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#102c46;

    border:1px solid var(--border);

    color:white;

    padding:9px 15px;

    border-radius:10px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:10000;

    font-size:13px;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .brand-title{
        font-size:19px;
    }

    .ai-name{
        font-size:18px;
    }

    .bubble{
        max-width:91%;
        font-size:14px;
    }

    .stats-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

    .stat-value{
        font-size:15px;
    }

}

/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *{
        animation:none!important;
        transition:none!important;
    }

}

</style>

</head>

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* =====================================================

function addMessageRaw(
    role,
    html,
    time,
    save=true
){

    const chat =
        document.getElementById("chat");


    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${role}`;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerHTML =
        html;


    const timeEl =
        document.createElement("div");

    timeEl.className =
        "message-time";

    timeEl.textContent =
        time || getTime();


    const holder =
        document.createElement("div");


    holder.appendChild(bubble);

    holder.appendChild(timeEl);

    wrapper.appendChild(holder);

    chat.appendChild(wrapper);


    chat.scrollTop =
        chat.scrollHeight;


    if(save){

        saveChat();

    }

}

function(html){

    addMessageRaw(

/* =====================================================
   PERFORMANCE
===================================================== */

function getPerformance(){

    const exams =
        Object.values(
            examData || {}
        );


    let score = 0;

    let total = 0;

    let best = -Infinity;

    let worst = Infinity;

    let bestExam = "";

    let worstExam = "";

    const subjects = {};


    exams.forEach(exam => {

        const s =
            Number(exam.score) || 0;

        const t =
            Number(exam.total) || 0;


        score += s;

        total += t;


        if(s > best){

            best = s;

            bestExam =
                exam.examTitle ||
                "পরীক্ষা";

        }


        if(s < worst){

            worst = s;

            worstExam =
                exam.examTitle ||
                "পরীক্ষা";

        }


        const subject =
            exam.subject ||
            exam.subjectName ||
            "অন্যান্য";


        if(!subjects[subject]){

            subjects[subject] = {

                score:0,
                total:0,
                exams:0

            };

        }


        subjects[subject].score += s;

        subjects[subject].total += t;

        subjects[subject].exams++;

    });


    const accuracy =
        total
        ? (score / total * 100)
        : 0;


    return {

        exams:exams.length,

        score,

        total,

        accuracy,

        best,

        worst,

        bestExam,

        worstExam,

        subjects

    };

}

/* =====================================================
   NOTES SEARCH
===================================================== */

function searchNotes(keyword=""){

    keyword =
        String(keyword)
            .toLowerCase()
            .trim();


    const list =
        Object.entries(
            notes || {}
        );


    const results =
        list.filter(
            ([id,note]) => {

                const searchable = [

                    note.title,

                    note.subject,

                    note.paper,

                    note.chapter,

                    note.textContent

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return (
                    !keyword ||
                    searchable.includes(keyword)
                );

            }
        );


    if(!results.length){

        return `
            📚 কোনো Note পাওয়া যায়নি।
        `;

    }


    let html = "";


    results.slice(0,30)
        .forEach(
            ([id,note]) => {

                html += `

                    <div class="list-item">

                        <div class="list-title">

                            📌
                            ${escapeHTML(
                                note.title ||
                                "Note"
                            )}

                        </div>

                        <div class="list-meta">

                            ${
                                note.subject
                                ?
                                escapeHTML(
                                    note.subject
                                )
                                :
                                ""
                            }

                            ${
                                note.chapter
                                ?
                                " • " +
                                escapeHTML(
                                    note.chapter
                                )
                                :
                                ""
                            }

                        </div>

                        ${
                            note.textContent
                            ?
                            `
                                <div class="list-text">

                                    ${escapeHTML(
                                        note.textContent
                                    ).slice(0,350)}

                                </div>
                            `
                            :
                            ""
                        }

                        ${
                            note.contentUrl
                            ?
                            `
                                <a
                                    class="search-link"
                                    href="${escapeHTML(
                                        note.contentUrl
                                    )}"
                                    target="_blank"
                                    rel="noopener"
                                    onclick="event.stopPropagation()"
                                >
                                    📄 Note Open
                                </a>
                            `
                            :
                            ""
                        }

                    </div>

                `;

            }
        );


    return html;

}

/* =====================================================
   LANGUAGE DETECTION
===================================================== */

function detectLanguage(text){

    if(
        /[\u0980-\u09FF]/.test(text)
    )
        return "bn";


    if(
        /[\u0900-\u097F]/.test(text)
    )
        return "hi";


    if(
        /[\u0600-\u06FF]/.test(text)
    )
        return "ar-ur";


    if(
        /[a-zA-Z]/.test(text)
    )
        return "en";


    return "unknown";

}


/* =====================================================
   INTENT DETECTION
===================================================== */

function detectIntent(text){

    const q =
        text
            .toLowerCase()
            .trim();


    if(
        /performance|পারফরম্যান্স|accuracy|এক্যুরেসি|বিশ্লেষণ|analysis|আমার অবস্থা/
        .test(q)
    )
        return "performance";


    if(
        /history|হিস্টোরি|আগের পরীক্ষা|পুরনো পরীক্ষা|previous exam|my exams/
        .test(q)
    )
        return "history";


    if(
        /notice|নোটিশ|ঘোষণা|announcement|update|আপডেট/
        .test(q)
    )
        return "notice";


    if(
        /weakness|দুর্বল|দুর্বলতা|weak subject/
        .test(q)
    )
        return "weakness";


    if(
        /strength|শক্তিশালী|ভালো বিষয়/
        .test(q)
    )
        return "strength";


    if(
        /note|notes|নোট|নোটস|chapter note/
        .test(q)
    )
        return "notes";


    if(
        /hello|hi|hey|হ্যালো|আসসালামু|সালাম/
        .test(q)
    )
        return "greeting";


    return "general";

}


/* =====================================================
   NOTES KEYWORD EXTRACTION

        )

}

/* =====================================================

===================================================== */

async function askAIBackend(question){

    if(!AI_API_URL){

        return null;

    }


    try{

        const context =
            buildAIContext();


        const response =
            await fetch(
                AI_API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:question,

                            question,

                            language:
                                detectLanguage(
                                    question
                                ),

                            context

                        })

                }
            );


        if(!response.ok){

            throw new Error(
                "AI backend error"
            );

        }


        const data =
            await response.json();


        return (
            data.answer ||
            data.response ||
            data.text ||
            data.message ||
            null
        );

    }
    catch(error){

        console.error(
            "AI Backend:",
            error
        );

        return null;

    }

}

/*
 * Wikipedia থেকে সরাসরি article-এর
 * introductory answer নেওয়া হবে।
 */

async function askWikipedia(question){

    try{

        const language =
            detectLanguage(question);


        const wikiLanguage =
            language === "bn"
            ? "bn"
            : "en";


        const result =
            await fetchWikipedia(
                question,
                wikiLanguage
            );


        if(result){

            return result;

        }


        /*
         * বাংলা Wikipedia-তে result না পেলে
         * English Wikipedia-তে চেষ্টা করবে।
         */

        if(wikiLanguage === "bn"){

            return await fetchWikipedia(
                question,
                "en"
            );

        }


        return null;

    }
    catch(error){

        console.warn(
            "Wikipedia error:",
            error
        );

        return null;

    }

}


/* =====================================================
   WIKIPEDIA FETCH
===================================================== */

async function fetchWikipedia(
    question,
    language
){

    try{

        const api =
            `https://${language}.wikipedia.org/w/api.php`;


        /*
         * Search
         */

        const searchURL =
            api +
            "?action=query" +
            "&list=search" +
            "&srsearch=" +
            encodeURIComponent(question) +
            "&srlimit=3" +
            "&utf8=1" +
            "&format=json" +
            "&origin=*";


        const searchResponse =
            await fetch(
                searchURL,
                {
                    method:"GET"
                }
            );


        if(!searchResponse.ok){

            return null;

        }


        const searchData =
            await searchResponse.json();


        const results =
            searchData?.query?.search || [];


        if(!results.length){

            return null;

        }


        const title =
            results[0].title;


        /*
         * Article extract
         */

        const extractURL =
            api +
            "?action=query" +
            "&prop=extracts" +
            "&exintro=1" +
            "&explaintext=1" +
            "&exchars=1800" +
            "&redirects=1" +
            "&titles=" +
            encodeURIComponent(title) +
            "&format=json" +
            "&origin=*";


        const extractResponse =
            await fetch(
                extractURL
            );


        if(!extractResponse.ok){

            return null;

        }


        const extractData =
            await extractResponse.json();


        const pages =
            extractData?.query?.pages || {};


        const page =
            Object.values(pages)[0];


        const extract =
            page?.extract?.trim();


        if(
            !extract ||
            extract.length < 30
        ){

            return null;

        }


        const wikiURL =
            `https://${language}.wikipedia.org/wiki/` +
            encodeURIComponent(
                title.replace(/ /g,"_")
            );


        return {

            source:"Wikipedia",

            title:title,

            answer:extract,

            url:wikiURL

        };

    }
    catch(error){

        console.warn(
            `Wikipedia ${language}:`,
            error
        );

        return null;

    }

}


/* =====================================================
   DUCKDUCKGO
===================================================== */

async function askDuckDuckGo(question){

    try{

        const url =
            "https://api.duckduckgo.com/" +
            "?q=" +
            encodeURIComponent(question) +
            "&format=json" +
            "&no_html=1" +
            "&skip_disambig=1";


        const response =
            await fetch(
                url
            );


        if(!response.ok){

            throw new Error(
                "DuckDuckGo request failed"
            );

        }


        const data =
            await response.json();


        let answer =
            data?.AbstractText || "";


        let title =
            data?.Heading || "";


        let sourceURL =
            data?.AbstractURL || "";


        /*
         * Direct answer
         */

        if(!answer){

            answer =
                data?.Answer || "";

        }


        /*
         * Definition
         */

        if(!answer){

            answer =
                data?.Definition || "";

        }


        /*
         * Related Topics
         */

        if(!answer){

            const topics =
                data?.RelatedTopics || [];


            for(
                const topic of topics
            ){

                if(
                    topic &&
                    topic.Text
                ){

                    answer =
                        topic.Text;

                    sourceURL =
                        topic.FirstURL ||
                        "";

                    title =
                        topic.Text
                            .split(" - ")[0]
                            .slice(0,120);

                    break;

                }

            }

        }


        if(
            !answer ||
            answer.trim().length < 30
        ){

            return null;

        }


        return {

            source:"DuckDuckGo",

            title:
                title ||
                "DuckDuckGo Result",

            answer:
                answer.trim(),

            url:
                sourceURL || ""

        };

    }
    catch(error){

        console.warn(
            "DuckDuckGo:",
            error
        );

        return null;

    }

}

window.sendMessage =
async function(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    input.value = "";

    input.style.height =
        "48px";


    addUserMessage(text);

    setTyping(true);


    try{

        /*
         * =================================================
         * STEP 1
         * GAIVEX Local / Firebase Data
         * =================================================
         */

        const local =
            localAI(text);


        if(
            local &&
            detectIntent(text) !== "general"
        ){

            await delay(250);

            addAIMessage(
                local.html
            );

            return;

        }


        /*
         * =================================================
         * STEP 2
         * Secure AI Backend
         * =================================================
         */

        const ai =
            await askAIBackend(
                text
            );


        if(ai){

            addAIMessage(
                formatAIResponse(ai)
            );

            return;

        }


        /*
         * =================================================
         * STEP 3
         * Wikipedia
         *
         * Wikipedia সরাসরি answer দিলে
         * chat bubble-এ দেখাবে।
         * কোনো search link নয়।
         * =================================================
         */

        const wikipedia =
            await askWikipedia(
                text
            );


        if(wikipedia){

            addAIMessage(
                formatPublicWebAnswer(
                    wikipedia
                )
            );

            return;

        }


        /*
         * =================================================
         * STEP 4
         * DuckDuckGo
         *
         * Wikipedia ব্যর্থ হলে এখানে আসবে।
         * =================================================
         */

        const duckduckgo =
            await askDuckDuckGo(
                text
            );


        if(duckduckgo){

            addAIMessage(
                formatPublicWebAnswer(
                    duckduckgo
                )
            );

            return;

        }


        /*
         * =================================================
         * STEP 5
         * Google Search
         *
         * সব জায়গায় উত্তর না পাওয়া গেলে
         * শুধুমাত্র তখন Google link।
         * =================================================
         */

        addAIMessage(`

            <b>🔎 সরাসরি উত্তর পাওয়া যায়নি।</b>

            <br><br>

            Wikipedia এবং DuckDuckGo
            দুটোতেই এই প্রশ্নের নির্ভরযোগ্য
            সরাসরি উত্তর পাওয়া যায়নি।

            <br><br>

            আপনি Google-এ আরও বিস্তারিত
            Search করতে পারেন:

            <br>

            ${googleSearch(text)}

        `);

    }
    catch(error){

        console.error(
            "Send Message Error:",
            error
        );


        /*
         * কোনো unexpected error হলেও
         * Google fallback থাকবে।
         */

        addAIMessage(`

            ⚠️ উত্তর সংগ্রহ করার সময়
            একটি সমস্যা হয়েছে।

            <br><br>

            আপনি Google-এ Search করতে পারেন:

            <br>

            ${googleSearch(text)}

        `);

    }
    finally{

        setTyping(false);

    }

};

function formatAIResponse(text){

    let safe =
        escapeHTML(text);


    safe =
        safe.replace(
            /\*\*(.*?)\*\*/g,
            "<b>$1</b>"
        );


    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );


    return safe;

}

window.toggleVoice =
function(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        showToast(
            "এই Browser-এ Voice Input নেই"
        );

        return;

    }


    if(isListening){

        if(recognition){

            recognition.stop();

        }

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "bn-BD";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
    function(){

        isListening = true;


        document
            .getElementById(
                "voiceBtn"
            )
            .classList.add(
                "listening"
            );


        showToast(
            "🎤 কথা বলুন..."
        );

    };


    recognition.onresult =
    function(event){

        let transcript = "";


        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            transcript +=
                event.results[i][0]
                    .transcript;

        }


        document
            .getElementById(
                "messageInput"
            )
            .value =
            transcript;

    };


    recognition.onerror =
    function(error){

        console.warn(
            "Voice:",
            error
        );


        showToast(
            "Voice Input-এ সমস্যা হয়েছে"
        );

    };


    recognition.onend =
    function(){

        isListening = false;


        document
            .getElementById(
                "voiceBtn"
            )
            .classList.remove(
                "listening"
            );

    };


    try{

        recognition.start();

    }
    catch(error){

        console.warn(error);

    }

};


/* =====================================================
   TEXT TO SPEECH
===================================================== */

window.speakAI =
function(text){

    if(
        !("speechSynthesis" in window)
    ){

        showToast(
            "এই Browser-এ Voice Output নেই"
        );

        return;

    }


    speechSynthesis.cancel();


    const clean =
        String(text)
            .replace(
                /<[^>]*>/g,
                ""
            )
            .slice(0,4000);


    const utter =
        new SpeechSynthesisUtterance(
            clean
        );


    const lang =
        detectLanguage(
            clean
        );


    if(lang === "bn"){

        utter.lang =
            "bn-BD";

    }
    else if(lang === "hi"){

        utter.lang =
            "hi-IN";

    }
    else if(lang === "ar-ur"){

        utter.lang =
            "ur-PK";

    }
    else{

        utter.lang =
            "en-US";

    }


    utter.rate = .95;

    utter.pitch = 1;


    speechSynthesis.speak(
        utter
    );

};
